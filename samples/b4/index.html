<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Ashen Crown B4 graphics sample</title>
<style>html,body{margin:0;background:#101a1c;color:#efe6cf;font:16px/1.4 'Noto Sans CJK KR',sans-serif}canvas{display:block;image-rendering:pixelated}</style></head>
<body><canvas id="out"></canvas>
<script type="module">
import {bridgeSprite,HD_TILE,paintGround,treeSprite,bushSprite,ruinSprite,cragSprite,houseSprite,figureSprite,CAST,drawShadow,drawFlame} from '../../src/render/hd-art.js';
import {MISSIONS} from '../../src/data/missions.js';
const T=HD_TILE,out=document.getElementById('out'),view=location.hash.slice(1)||'scene';
const passable=t=>!['x','w','v','t','h'].includes(t);
function scene(map,units,{buildings=[],selected=null,mov=0,attack=[],time=0,scale=2,cursor=null}={}){
 const H=map.length,W=map[0].length,{pix,objects}=paintGround(map,{theme:sceneTheme}),ground=pix.canvas();
 out.width=W*T*scale;out.height=H*T*scale;const c=out.getContext('2d');c.imageSmoothingEnabled=false;c.setTransform(scale,0,0,scale,0,0);c.drawImage(ground,0,0);
 // range overlays (under objects/units)
 const sel=units.find(u=>u.id===selected);
 if(sel){const seen=new Map([[sel.x+','+sel.y,0]]),q=[[sel.x,sel.y]];while(q.length){const [x,y]=q.shift(),d=seen.get(x+','+y);for(const [dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(ny<0||nx<0||ny>=H||nx>=W||seen.has(k)||!passable(map[ny][nx]))continue;const cost=map[ny][nx]==='f'?2:1;if(d+cost>mov||units.some(u=>u.x===nx&&u.y===ny&&u.team==='enemy'))continue;seen.set(k,d+cost);q.push([nx,ny]);}}
  for(const k of seen.keys()){const [x,y]=k.split(',').map(Number);c.fillStyle='rgba(40,120,235,.42)';c.fillRect(x*T,y*T,T,T);c.strokeStyle='rgba(190,225,255,.75)';c.lineWidth=1;c.strokeRect(x*T+1.5,y*T+1.5,T-3,T-3);}}
 for(const [x,y]of attack){c.fillStyle='rgba(225,80,70,.32)';c.fillRect(x*T+1,y*T+1,T-2,T-2);c.fillStyle='rgba(255,170,150,.6)';c.fillRect(x*T+1,y*T+1,T-2,1);}
 // sortable drawables
 const covered=new Set();for(const b of buildings)for(let j=0;j<b.h;j++)for(let i=0;i<b.w;i++)covered.add((b.x+i)+','+(b.y+j));
 const draw=[];
 for(const o of objects){if(o.kind==='house'&&covered.has((o.x/T)+','+(o.y/T-1)))continue;draw.push(o);}
 for(const b of buildings){if(b.w===1){for(let j=0;j<b.h;j++)draw.push({kind:'house',x:b.x*T,y:(b.y+j+1)*T,w:1,h:1,state:j===0?b.state:'intact',seed:b.x*5+(b.y+j)*11});}else draw.push({kind:'house',x:b.x*T,y:(b.y+b.h)*T,w:b.w,h:b.h,state:b.state,seed:b.x*5+b.y*11});}
 for(const u of units)draw.push({kind:'unit',u,x:u.x*T+T/2,y:u.y*T+T-3,key:u.y*T+T+.5});
 draw.sort((a,b)=>(a.key??a.y)-(b.key??b.y));
 for(const o of draw){
  if(o.kind==='tree'){const s=treeSprite(o.seed%9,o.size);drawShadow(c,o.x,o.y-2,11*o.size,3.5*o.size);c.drawImage(s,Math.round(o.x-20),Math.round(o.y-s.height+3));}
  if(o.kind==='bush'){drawShadow(c,o.x,o.y,9,3);c.drawImage(bushSprite(o.seed%5),o.x-12,o.y-14);}
  if(o.kind==='ruin'){c.drawImage(ruinSprite(o.seed%4),o.x,o.y-40);}
  if(o.kind==='bridge')c.drawImage(bridgeSprite(o.map,o.tx,o.ty),o.x,o.y);
  if(o.kind==='crag'){drawShadow(c,o.x+24,o.y-3,20,5);c.drawImage(cragSprite(o.seed%3),o.x,o.y-56);}
  if(o.kind==='house'){const s=houseSprite(o.seed%6,o.w||1,o.h||1,o.state||'intact');c.fillStyle='rgba(20,24,30,.28)';c.fillRect(o.x+6,o.y-4,s.width-4,6);c.drawImage(s,o.x,o.y-s.height+2);
   if(o.state==='burning'){for(let i=0;i<(o.w||1)*2;i++)drawFlame(c,o.x+12+i*20,o.y-s.height+16+(i%2)*8,time+i*90,1.2);for(let i=0;i<7;i++){const r=Math.round(4+i*1.4),px=Math.round(o.x+s.width/2-4+i*3+Math.sin(i*1.3+time/500)*3),py=Math.round(o.y-s.height-2-i*8);c.fillStyle=`rgba(70,66,72,${.30-i*.035})`;c.fillRect(px-r,py-r+2,r*2,r*2-4);c.fillRect(px-r+2,py-r,r*2-4,r*2);}}}
  if(o.kind==='unit'){const u=o.u,s=figureSprite(u.sprite,{facing:u.facing||'down',frame:u.frame||0});
   c.fillStyle=u.team==='ally'?'rgba(80,160,255,.55)':u.team==='enemy'?'rgba(230,70,60,.55)':'rgba(240,210,110,.6)';c.beginPath();c.ellipse(o.x,o.y,13,4.2,0,0,7);c.fill();
   drawShadow(c,o.x,o.y,10,3);c.globalAlpha=u.acted?.62:1;c.drawImage(s,o.x-20,o.y-50);c.globalAlpha=1;
   if(u.hp!=null){const w=26,f=Math.max(0,u.hp/u.max);c.fillStyle='#14181c';c.fillRect(o.x-w/2-1,o.y+1,w+2,4);c.fillStyle=u.team==='ally'?'#5fd38a':u.team==='enemy'?'#e8594a':'#f0cf6a';c.fillRect(o.x-w/2,o.y+2,Math.round(w*f),2);}}
 }
 if(cursor){const [x,y]=cursor,k=4,col='#ffe08a';c.fillStyle=col;for(const [ax,ay,dx,dy]of[[0,0,1,1],[T,0,-1,1],[0,T,1,-1],[T,T,-1,-1]]){c.fillRect(x*T+ax-(dx<0?k+1:0)+(dx>0?-1:0),y*T+ay+(dy>0?-1:-1),k+1,2);c.fillRect(x*T+ax+(dx>0?-1:-1),y*T+ay-(dy<0?k+1:0)+(dy>0?-1:0),2,k+1);}}
 return c;
}
let sceneTheme='';
const U=(id,sprite,team,x,y,hp,max,extra={})=>({id,sprite,team,x,y,hp,max,...extra});
if(view==='scene'){
 const m=MISSIONS[1];
 const units=[U('eric','eric','ally',6,8,42,42,{facing:'up'}),U('elina','elina','ally',4,8,30,30,{facing:'up'}),U('lia','lia','ally',8,8,27,27,{facing:'left'}),U('sain','sain','ally',5,9,31,31,{facing:'right'}),U('kai','kai','ally',9,7,33,33,{acted:true,facing:'up'}),
  U('b1','bandit','enemy',3,5,24,24,{facing:'down'}),U('b2','bandit','enemy',8,5,18,26,{facing:'right'}),U('a1','archer','enemy',6,4,22,22,{facing:'down'}),U('b3','bandit','enemy',1,2,25,25,{facing:'right'}),U('boss','captain','enemy',6,1,62,62,{facing:'down'}),
  U('c1','mira','civilian',2,4,20,28,{facing:'left'}),U('c2','farmer','civilian',10,3,28,28,{facing:'down'})];
 scene(m.map,units,{buildings:m.layers.buildings,selected:'eric',mov:2,cursor:[6,8],time:400});
}
if(view==='terrain'){
 const map=['wwwwbwwwwwmm','gwwwbwwwgmmm','ggrrrrrrggmg','ssggrffgddgg','sssgrffgdddg','kkkkqqkkkkgg','kkkkkkkkkkxg'].map(r=>r.split(''));
 scene(map,[U('g','guard','civilian',6,5,null),U('t','torch','enemy',2,5,28,30),U('q','quartermaster','enemy',8,6,60,60),U('m','merchant','civilian',3,2,null)],{time:0});
}
if(view==='cast'){
 const groups=[['아군',['eric','elina','lia','sain','kai','aren']],['적군',['bandit','archer','captain','torch','quartermaster','lion','bearer','ironSpear','cavalry']],['주민',['elder','smith','merchant','refugee','child','farmer','mira','guard','aide']]];
 const S=4,cell=46*S,rowH=52*S+64;out.width=cell*9+40;out.height=groups.length*rowH+30;const c=out.getContext('2d');c.imageSmoothingEnabled=false;c.fillStyle='#16252a';c.fillRect(0,0,out.width,out.height);
 groups.forEach(([label,ids],g)=>{const y0=20+g*rowH;c.fillStyle='#d9b96a';c.font='bold 26px sans-serif';c.fillText(label,24,y0+28);ids.forEach((id,i)=>{const x=24+i*cell,y=y0+40;c.fillStyle='#1d3036';c.fillRect(x,y,cell-10,52*S+4);c.fillStyle='rgba(20,24,30,.35)';c.beginPath();c.ellipse(x+(cell-10)/2,y+50*S,11*S,3*S,0,0,7);c.fill();c.drawImage(figureSprite(id),x+(cell-10)/2-20*S,y,40*S,52*S);c.fillStyle='#efe6cf';c.font='20px sans-serif';c.textAlign='center';c.fillText(CAST[id].name,x+(cell-10)/2,y+52*S+24);c.textAlign='left';});});
}
if(view==='facing'){
 const ids=['lion','bearer','ironSpear','ironArcher','cavalry','eric','elina','lia','sain'],dirs=['down','right','up','left'],S=3,cw=40*S+8,ch=52*S+40,gw=cw*4+28,cols=3,rows=Math.ceil(ids.length/cols);
 out.width=gw*cols+16;out.height=rows*(ch+34)+60;const c=out.getContext('2d');c.imageSmoothingEnabled=false;c.fillStyle='#16252a';c.fillRect(0,0,out.width,out.height);
 c.font='bold 22px sans-serif';c.fillStyle='#d9b96a';c.fillText('이동 방향별 모습 (아래 · 오른쪽 · 위 · 왼쪽)',20,34);
 ids.forEach((id,i)=>{const gx=16+(i%cols)*gw,gy=56+Math.floor(i/cols)*(ch+34);c.fillStyle='#efe6cf';c.font='18px sans-serif';c.fillText(CAST[id].name,gx+6,gy+18);
  dirs.forEach((f,k)=>{const x=gx+k*cw,y=gy+26;c.fillStyle='#1d3036';c.fillRect(x,y,cw-6,52*S+6);c.fillStyle='rgba(20,24,30,.35)';c.beginPath();c.ellipse(x+(cw-6)/2,y+50*S,11*S,3*S,0,0,7);c.fill();c.drawImage(figureSprite(id,{facing:f}),x+(cw-6)/2-20*S,y,40*S,52*S);});});
}
if(view==='walk'){
 const m=MISSIONS[1],path=[[4,8],[5,8],[6,8],[7,8],[7,7],[7,6],[6,6],[5,6],[4,6],[4,7],[4,8]];
 window.frames=[];const N=(path.length-1)*8;
 for(let f=0;f<N;f++){const seg=Math.floor(f/8),t=(f%8)/8,[ax,ay]=path[seg],[bx,by]=path[seg+1],facing=bx>ax?'right':bx<ax?'left':by<ay?'up':'down';
  const u=U('eric','eric','ally',ax+(bx-ax)*t,ay+(by-ay)*t,42,42,{facing,frame:1+Math.floor(f/2)%4});
  scene(m.map,[u,U('lia','lia','ally',9,7,27,27,{facing:'left'}),U('b1','bandit','enemy',3,5,24,24,{facing:'down'})],{scale:2,time:f*80});
  const crop=document.createElement('canvas');crop.width=6*T*2;crop.height=5*T*2;crop.getContext('2d').drawImage(out,2*T*2,4*T*2,crop.width,crop.height,0,0,crop.width,crop.height);window.frames.push(crop.toDataURL('image/png'));}
}
if(view==='m04'){const m=MISSIONS[4];sceneTheme='fortress';scene(m.map,m.enemies.map(e=>U(e.id,e.burns?'torch':e.kind==='captain'?'quartermaster':e.kind==='archer'?'fortArcher':'fortGuard','enemy',e.x,e.y,e.hp,e.hp,{facing:'down'})),{scale:2});}
window.ready=true;
</script></body></html>
