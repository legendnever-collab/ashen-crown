 <path d="M1150 610 L1200 545 L1240 470 L1300 440 L1360 365 L1310 290 L1440 330" fill="none" stroke="#c0392b" stroke-width="5" stroke-dasharray="14 9"/>
 <!-- sites -->
 <g font-size="15" fill="#2b2118" font-weight="700">
  <g><rect x="770" y="490" width="50" height="40" fill="#f3e3a4" stroke="#2b2118" stroke-width="3"/><path d="M770 490 l8 -14 l8 14 m10 0 l8 -14 l8 14 m10 0 l8 -14 l8 14" fill="none" stroke="#2b2118" stroke-width="3"/><text x="795" y="555" text-anchor="middle">왕도 아우렐리아</text><text x="795" y="573" text-anchor="middle" font-size="12" font-weight="400">M27 왕도의 성문</text></g>
  <g><rect x="690" y="190" width="40" height="34" fill="#c5ccd6" stroke="#2b2118" stroke-width="3"/><text x="710" y="246" text-anchor="middle">철관성 (M07)</text></g>
  <g><circle cx="600" cy="335" r="9" fill="#7a5a3a"/><text x="600" y="315" text-anchor="middle" font-size="13">회색 협곡 (M08)</text></g>
