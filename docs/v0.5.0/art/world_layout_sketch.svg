 <!-- beyond the sealed border: OPEN -->
 <path d="M1490 420 C1500 300 1460 200 1440 180 L1536 160 L1536 700 L1450 680 C1480 600 1495 520 1490 420 Z" fill="url(#fog)"/>
 <!-- mountains north, river, forest east -->
 <g fill="none" stroke="#5a5f66" stroke-width="3">
  <path d="M380 200 l25 -40 l25 40 M440 190 l30 -50 l30 50 M520 200 l25 -40 l25 40 M640 180 l30 -50 l30 50 M720 205 l25 -40 l25 40 M880 190 l30 -50 l30 50 M980 200 l25 -40 l25 40 M1080 190 l28 -45 l28 45"/>
 </g>
 <path d="M1300 160 C1290 250 1330 330 1300 420 C1270 500 1210 560 1120 600 C1000 650 900 600 800 560 C700 520 640 560 560 540 C470 520 380 560 230 600" fill="none" stroke="#4f86a8" stroke-width="6"/>
 <g fill="#4d7a3e" opacity=".85"><circle cx="1220" cy="430" r="14"/><circle cx="1245" cy="415" r="14"/><circle cx="1265" cy="440" r="14"/><circle cx="1240" cy="455" r="13"/><circle cx="1200" cy="455" r="12"/><circle cx="1280" cy="415" r="12"/></g>
 <!-- canyon -->
 <path d="M560 300 C590 330 600 360 640 380" fill="none" stroke="#7a5a3a" stroke-width="10" opacity=".7"/>
