<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
 <!-- Ashen Crown · Erdia layout sketch (PROPOSED). Composition guide for the world-map painting; not final art. -->
 <defs>
  <pattern id="waves" width="40" height="20" patternUnits="userSpaceOnUse"><path d="M0 10 q10 -8 20 0 t20 0" fill="none" stroke="#7fa6b5" stroke-width="1.5" opacity=".5"/></pattern>
  <pattern id="fog" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 16 L16 0" stroke="#8a8a8a" stroke-width="2" opacity=".35"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
 </defs>
 <rect width="1536" height="1024" fill="#9fc3cf"/>
 <rect width="1536" height="1024" fill="url(#waves)"/>
 <!-- continent -->
 <path d="M300 120 C420 60 640 70 820 90 C1000 70 1200 80 1350 150 C1460 200 1500 300 1490 420 C1500 540 1470 650 1400 720 C1320 800 1200 870 1060 920 C900 960 700 960 560 930 C420 900 300 850 230 760 C160 680 150 560 170 450 C150 330 200 190 300 120 Z" fill="#e9dcb8" stroke="#6b5838" stroke-width="4"/>
