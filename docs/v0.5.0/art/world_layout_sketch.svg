 <path d="M300 120 C420 60 640 70 820 90 C1000 70 1150 85 1240 130 L1180 250 C1050 300 900 330 760 330 C600 330 450 300 300 280 C240 250 250 170 300 120 Z" fill="#6f8296" opacity=".55"/>
