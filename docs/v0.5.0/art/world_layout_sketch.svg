  <g><rect x="410" y="400" width="26" height="22" fill="#dfeec5" stroke="#2b2118" stroke-width="2"/><rect x="420" y="640" width="26" height="22" fill="#dfeec5" stroke="#2b2118" stroke-width="2"/><text x="470" y="395" font-size="12" font-weight="400">영주성 ×2 (M10)</text></g>
  <g><path d="M740 800 l20 -30 l20 30 z" fill="#f2c5a0" stroke="#2b2118" stroke-width="3"/><text x="760" y="825" text-anchor="middle">성화 대성당 (M11)</text></g>
  <g><rect x="960" y="840" width="30" height="26" fill="#f2c5a0" stroke="#2b2118" stroke-width="2"/><text x="975" y="888" text-anchor="middle">침묵의 수도원 (M12)</text></g>
 </g>
 <g font-size="13" fill="#1d140c" font-weight="700">
  <circle cx="1150" cy="610" r="10" fill="#e67e22" stroke="#1d140c" stroke-width="3"/><text x="1080" y="640">① 잿빛 마을</text>
  <circle cx="1200" cy="545" r="8" fill="#fff" stroke="#1d140c" stroke-width="3"/><text x="1090" y="545">변경 야영지</text>
  <circle cx="1240" cy="470" r="7" fill="#1d140c"/><text x="1150" y="490">② 숲길</text>
  <circle cx="1300" cy="440" r="7" fill="#1d140c"/><text x="1310" y="465">③ 무너진 다리</text>
  <rect x="1350" y="352" width="22" height="22" fill="#b9a993" stroke="#1d140c" stroke-width="3"/><text x="1380" y="392">④ 버려진 성채</text>
  <circle cx="1310" cy="290" r="7" fill="#1d140c"/><text x="1220" y="282">⑤ 국경 능선</text>
  <rect x="1432" y="318" width="18" height="26" fill="#6b5838" stroke="#1d140c" stroke-width="3"/><text x="1390" y="310">⑥ 국경 관문</text>
 </g>
 <!-- region labels -->
 <g font-size="26" font-weight="800" fill="#1d1a16" opacity=".8" text-anchor="middle">
  <text x="760" y="140">북부 · 철왕관 통령령</text>
  <text x="330" y="440">서부 · 자유도시 연맹</text>
  <text x="760" y="740">남부 · 성화령</text>
  <text x="820" y="440">중앙 · 왕도령</text>
  <text x="1270" y="690">동부 변경 (ACT I)</text>
 </g>
 <text x="1505" y="560" font-size="14" fill="#444" text-anchor="end" transform="rotate(-90 1505 560)">봉인된 국경 너머 — OPEN</text>
 <g font-size="14" fill="#1d1a16"><rect x="24" y="900" width="430" height="100" fill="#fffaf0" opacity=".85" stroke="#6b5838"/>
  <text x="40" y="928" font-weight="700">Erdia 배치 스케치 (PROPOSED · 그림 아님)</text>
  <text x="40" y="952">붉은 점선 = ACT I 행군로 ①→⑥ · 빗금 = 미공개 지역</text>
  <text x="40" y="976">지명은 모두 PROPOSED, 세력 이름·지도자만 CANON 방향</text></g>
</svg>
