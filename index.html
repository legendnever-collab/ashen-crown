:root{color-scheme:dark;--ink:#ede7d6;--dim:#a6b5b2;--gold:#d9bc7d;--line:#3b5355;--panel:#1b3035;--blue:#88c5d2;--red:#c77f76;--green:#abc48a;font-family:Georgia,'Ashen UI',serif;background:#102529;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer;background:#263c40;color:var(--ink);border:1px solid #496165;padding:10px 14px;border-radius:3px;transition:background .15s,border-color .15s}button:hover:not(:disabled){background:#354c4c;border-color:var(--gold)}button:focus-visible{outline:2px solid #f5d28e;outline-offset:3px}button:disabled{opacity:.35;cursor:default}button.primary{background:#d7ba7b;color:#192e32;border-color:#eed6a1;font-weight:bold}button.primary:hover:not(:disabled){background:#eace95}button.danger{border-color:#9a635f;color:#efb0a4}button.small{padding:6px 9px;font-size:12px}button.active{border-color:var(--gold);color:#f5dd9b;background:#364a44}h1,h2,h3,p{margin:0}h1{font-size:clamp(46px,6vw,84px);font-weight:normal;letter-spacing:.04em}h2{font-weight:normal;font-size:30px}h3{font-size:18px;font-weight:normal}p{line-height:1.75;color:#c3cfca}.eyebrow{font:11px/1.5 Arial,'Ashen UI',sans-serif;text-transform:uppercase;letter-spacing:.22em;color:var(--gold)}.muted{color:var(--dim);font-size:12px}.tag{display:inline-block;border:1px solid #50615a;padding:3px 7px;font:10px Arial,'Ashen UI',sans-serif;letter-spacing:.08em;color:var(--gold);border-radius:2px}.stack{display:flex;flex-direction:column;gap:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spacer{flex:1}.rule{height:1px;background:var(--line);margin:10px 0}.accent{color:var(--gold)}
#app{height:100dvh;display:flex;flex-direction:column}.topbar{height:69px;flex:none;display:flex;align-items:center;gap:18px;padding:0 26px;background:#11292d;border-bottom:1px solid #49605c}.wordmark{font-size:20px;letter-spacing:.08em}.crest{width:28px;height:29px;color:var(--gold)}.topbar .sub{font:10px Arial,'Ashen UI',sans-serif;letter-spacing:.22em;color:#9daaa2;display:block;margin-top:3px}.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}#save-status{font:11px Arial,'Ashen UI',sans-serif;color:#9cbaa4;max-width:230px}.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0;flex:1}.field{position:relative;min-height:0;min-width:0;overflow:hidden;background:#162e2f;background-image:radial-gradient(ellipse at 50% 50%,#294440,transparent 80%)}.canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none;outline:none}.map-tools{position:absolute;bottom:14px;left:16px;display:flex;gap:5px;background:#172e32df;padding:5px;border:1px solid #46605b;border-radius:3px}.map-tools .hint{font:11px Arial,'Ashen UI',sans-serif;align-self:center;margin:0 8px;color:#b3bdb3}.map-label{position:absolute;left:25px;top:18px;pointer-events:none}.map-label h3{font-size:22px;margin-top:7px}.map-label p{font-size:12px;margin-top:3px}.rail{border-left:1px solid #4b615e;overflow-y:auto;background:linear-gradient(160deg,#20373b,#182d32);padding:20px 18px;scrollbar-width:thin}.phasebar{display:flex;align-items:center;gap:18px;min-height:53px;flex:none;padding:10px 26px;background:#233b3d;border-bottom:1px solid var(--line);font-size:13px}.phase-pill{font:11px Arial,'Ashen UI',sans-serif;letter-spacing:.12em;padding:6px 9px;background:#42605d;color:#e3e8d4;border:1px solid #6b8980}.objectives{display:flex;gap:14px;color:#c8d3c8}.objective.done{color:#b6d69a}.objective::before{content:'◇ ';color:var(--gold)}.objective.done::before{content:'✓ '}.turn{font-size:20px;color:var(--gold)}.board-caption{position:absolute;bottom:69px; const RANGE_STYLE={move:{fill:'rgba(43,161,232,.62)',border:'#a9e8ff'},attack:{fill:'rgba(228,78,64,.62)',border:'#ffbf89'},support:{fill:'rgba(70,190,117,.60)',border:'#cbf5a6'}};
function moveDuration(path,mode='step',speed=1){return mode==='instant'||path.length<2?0:(path.length-1)*(mode==='step'?320:210)/speed;}
function motionAt(path,elapsed,mode='step',speed=1){
 const duration=moveDuration(path,mode,speed),progress=duration?Math.max(0,Math.min(1,elapsed/duration)):1,step=progress*(path.length-1),index=Math.min(path.length-2,Math.floor(step));
 if(index<0)return {...path[0],index:0,done:true};const f=step-index,t=mode==='step'?Math.min(1,f/.78):f;
 return {x:path[index].x+(path[index+1].x-path[index].x)*t,y:path[index].y+(path[index+1].y-path[index].y)*t,index:progress===1?path.length-1:index,done:progress===1};
}
function attackKind(unit,mode){if(unit.id==='lia'&&mode==='skill')return 'fireball';if(unit.range?.[0]>=2)return 'arrow';if(unit.id==='kai')return 'dagger';return unit.kind==='bandit'||unit.kind==='captain'?'axe':'sword';}
function presentationPlan(events,units,{movement='step',speed=1,reduced=false}={}){
 const plans=[],hp=[],motions=[];let cursor=0,lastImpact=0;
 for(const event of events){
  if(event.type==='move'){const duration=moveDuration(event.path,movement,speed);motions.push({...event,delay:cursor,duration,movement,speed});cursor+=duration;}
  else if(event.type==='attack'){
   const unit=units.find(u=>u.id===event.id),kind=attackKind(unit,event.mode),duration=(reduced?220:kind==='fireball'?1250:kind==='arrow'?680:720)/speed,impact=cursor+duration*(kind==='fireball'?.56:kind==='arrow'?.65:.46);
   plans.push({...event,kind,delay:cursor,duration,impact});lastImpact=impact;cursor+=duration;
  }else{const delay=['hit','critical','miss','death'].includes(event.type)?lastImpact:Math.max(0,cursor-180/speed),duration=(['level','potential'].includes(event.type)?1400:900)/speed;plans.push({...event,delay,duration});
   if(Number.isFinite(event.toHP))hp.push({id:event.id,delay,hp:event.toHP});
  }
 }
 return {plans,motions,hp,duration:Math.max(cursor,...plans.map(e=>e.delay+Math.min(e.duration,450/speed)),0)};
}

function placePopover({width,height,popupWidth,popupHeight,anchor,protectedPoints=[]}){
 const margin=6,maxX=Math.max(margin,width-popupWidth-margin),maxY=Math.max(margin,height-popupHeight-margin),clamp=(v,max)=>Math.max(margin,Math.min(max,v));
 const xs=[anchor.x+20,anchor.x-popupWidth-20,anchor.x-popupWidth/2,margin,maxX],ys=[anchor.y-popupHeight-23,anchor.y+23,anchor.y-popupHeight/2,margin,maxY];let best=null;
 for(const x0 of xs)for(const y0 of ys){const x=clamp(x0,maxX),y=clamp(y0,maxY);let score=Math.hypot(x+popupWidth/2-anchor.x,y+popupHeight/2-anchor.y);
  for(const p of protectedPoints){const r=p.radius??12;if(p.x+r>x&&p.x-r<x+popupWidth&&p.y+r>y&&p.y-r<y+popupHeight)score+=10000*(p.weight??1);}
  if(!best||score<best.score)best={x,y,score};
 }return {x:Math.round(best.x),y:Math.round(best.y)};
}

function paintPortraits(){document.querySelectorAll('[data-sprite]').forEach(canvas=>{const u=findUnit(state,canvas.dataset.sprite);if(!u)return;const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,canvas.width,canvas.height);drawPortrait(c,u);});}
function bar(label,value,max,cls=''){return `<div class="bar-row"><span>${label}</span><div class="meter ${cls}"><b style="width:${max?100*value/max:0}%"></b></div><span>${value}/${max}</span></div>`;}
function heroCards(){return HEROES.map(h=>{const u=findUnit(state,h.id);return `<button class="hero-card ${ui.selected===u.id?'selected':''}" data-do="select" data-id="${u.id}">${portrait(u,'card-sprite')}<h3>${u.name}</h3><p>LV ${u.level} · ${u.role}<br>${u.className}</p></button>`;}).join('');}
function heroDetail(u){return `<div class="hero-detail">${portrait(u)}<div><h3>${u.name} <span class="tag">LV ${u.level}</span></h3><p>${esc(u.description)}</p><p class="accent">${esc(u.talent)} · ${u.skill}</p></div></div>`;}
function render(){
 const battle=state.screen==='battle',deploy=state.screen==='deployment',u=findUnit(state,ui.selected);const rescued=state.units.filter(c=>c.rescued).length,boss=findUnit(state,'boss');
 $('#phasebar').innerHTML=`<span class="eyebrow">MISSION 01</span><span class="turn">${battle||state.screen==='result'?`TURN ${String(state.turn).padStart(2,'0')}`:'THE ASHEN VILLAGE'}</span><span class="phase-pill">${deploy?'FREE DEPLOYMENT':battle?`${state.phase.toUpperCase()} PHASE`:state.screen==='result'?state.outcome.toUpperCase():'FIRST BATTLE'}</span><div class="objectives"><span class="objective ${rescued===2?'done':''}">주민 ${rescued}/2 구출</span><span class="objective ${boss.hp<=0?'done':''}">산적 대장 격파${battle?` · HP ${boss.hp}/${boss.maxHP}`:''}</span></div>`;
 $('#map-label').innerHTML=battle||deploy?`<div class="eyebrow">BORDERLANDS · SOUTHERN APPROACH</div><h3>The Ashen Village</h3><p>${deploy?'남쪽의 푸른 영역에 장수를 자유 배치하세요.':state.turn<5?'TURN 5 전 주민 구출 권장 · 구출은 행동 1회':'주민이 직접 공격받습니다 · 즉시 구출하세요'}</p>`:'';
 $('#board-caption').textContent=battle?ui.busy?'적의 행동을 지켜보세요.':ui.preview?'예측을 확인한 뒤 행동을 확정하세요.':!u||u.acted?'다음 장수를 선택하거나 Phase를 종료하세요.':ui.mode==='move'?`${u.name} · 푸른 칸으로 이동. 이동 후에는 취소할 수 있습니다.`:ui.mode==='rescue'?'인접한 주민을 선택하세요.':ui.mode==='skill'?`${u.skill} · 유효한 대상을 선택하세요.`:'붉은 범위의 적을 선택해 공격을 예측하세요.':deploy?'장수 선택 → 남쪽 Tile 클릭 · 다른 장수 위치를 클릭하면 Swap':'';
 $('#logentries').innerHTML=state.log.slice(-18).map(l=>`<div>${esc(l)}</div>`).join('');$('#logentries').scrollTop=$('#logentries').scrollHeight;
 app.classList.toggle('in-battle',battle||deploy);app.classList.toggle('journal-open',ui.journal);$('#rail').hidden=!(battle||deploy);$('#screen').innerHTML='';
 if(battle||deploy){$('#rail').innerHTML=renderDock(state,ui,esc,portrait,(label,value,max,cls)=>bar(label,label==='HP'?renderer.displayHP(u):value,max,cls));}else{renderScreen();$('#rail').innerHTML=`<div class="eyebrow">COMMANDER’S NOTES</div><h3 style="margin:13px 0">한 사람씩, 하나의 가능성</h3><p style="font-size:13px">다섯 장수의 역할을 연결하세요. 숲의 사수, 동료를 지키는 기사, 빠른 구출과 치유가 전장의 흐름을 바꿉니다.</p><div class="rule"></div><div class="eyebrow">MISSION OBJECTIVES</div><p style="font-size:12px;margin:10px 0">주민 2명 구출 + Garr 격파<br>선택 목표: 전원 생존 · 8턴 이내 · Eric의 단서</p><div class="rule"></div><div class="muted">완료한 미션: ${state.campaign.clears}회<br>v${VERSION} · 오리지널 픽셀 아트<br>오프라인 실행 · 로컬 저장</div><button class="small" data-do="help" style="margin-top:18px">조작과 전투 규칙</button>`;}
 const pop=$('#unit-popover');pop.innerHTML=menuHTML(state,ui,esc);pop.hidden=!pop.innerHTML;positionPopover();paintPortraits();
}
function positionPopover(){
 const pop=$('#unit-popover');if(!pop||pop.hidden)return;const selected=findUnit(state,ui.selected),unit=findUnit(state,ui.preview||ui.selected),anchor=ui.pendingMove||unit;if(!anchor)return;
 const center=renderer.tileCenter(anchor.x,anchor.y),field=$('.field'),protectedPoints=state.units.filter(t=>alive(t)&&(t.id===selected?.id||ui.menu==='root'&&canAct(state,selected)&&(t.team==='ally'||validTarget(state,selected,t,'attack')||validTarget(state,selected,t,'skill')||validTarget(state,selected,t,'rescue')||t.team==='enemy'&&Math.abs(selected.x-t.x)+Math.abs(selected.y-t.y)<=Math.max(selected.range[1],rangeFor(selected,'skill')[1])))).map(t=>({...renderer.tileCenter(t.x,t.y),radius:Math.max(6,renderer.camera.scale*32),weight:t.id===selected?.id?1:t.team==='ally'?4:100}));
 const pos=placePopover({width:field.clientWidth,height:field.clientHeight,popupWidth:pop.offsetWidth,popupHeight:pop.offsetHeight,anchor:center,protectedPoints}),left=pos.x+'px',top=pos.y+'px';if(pop.style.left!==left)pop.style.left=left;if(pop.style.top!==top)pop.style.top=top;
}
renderer.onCamera=()=>{positionPopover();const u=findUnit(state,ui.selected),hp=$('.dock-vitals .bar-row');if(u&&hp){const shown=renderer.displayHP(u),value=hp.lastElementChild,meter=hp.querySelector('.meter b');if(value.textContent!==`${shown}/${u.maxHP}`){value.textContent=`${shown}/${u.maxHP}`;meter.style.width=100*shown/u.maxHP+'%';}}};
async function previewMove(id,x,y){const u=findUnit(state,id),path=pathTo(state,u,x,y);if(!canAct(state,u)||u.moved||!path||path.length<2)return false;ui.pendingMove={id,x,y,path};ui.menu=null;ui.preview=null;ui.notice='이동 경로를 따라 걷는 중입니다. 도착 후 확정하거나 취소하세요.';ui.busy=true;render();const duration=renderer.walk(id,path,ui.movement,ui.speed);await new Promise(r=>setTimeout(r,duration+24));ui.busy=false;ui.menu='move-confirm';ui.notice=null;render();return true;}
async function cancelMovement(){const m=ui.pendingMove;if(!m)return;ui.menu=null;ui.busy=true;render();const duration=renderer.walk(m.id,[...m.path].reverse(),ui.movement,ui.speed);await new Promise(r=>setTimeout(r,duration+24));renderer.motion.delete(m.id);ui.pendingMove=null;ui.busy=false;ui.mode='choose';ui.menu='root';ui.notice='이동 취소 · 원래 위치와 이동권을 유지합니다.';render();}
function confirmMovement(){const m=ui.pendingMove;if(!m)return;const path=moveUnit(state,m.id,m.x,m.y);renderer.motion.delete(m.id);ui.pendingMove=null;ui.menu='root';ui.mode='choose';ui.notice=path?'이동 확정 · 공격, 스킬, 도구 또는 대기를 선택하세요.':'이동을 확정할 수 없습니다. 원래 위치를 유지합니다.';commit();}
function renderScreen(){const u=findUnit(state,ui.selected);let html='';
 if(state.screen==='title')html=`<div class="title-inner"><div class="eyebrow">AN ORIGINAL FANTASY TACTICAL RPG</div><h1>Ashen<br>Crown<span class="accent">.</span></h1><div class="subtitle">First Battle — The Ashen Village</div><p>재가 된 왕관 아래, 다섯 동료의 이야기가 시작됩니다.<br>당신의 선택은 전장을 바꾸고, 장수의 숨겨진 가능성을 깨웁니다.</p><div class="title-actions"><button class="primary" data-do="new">첫 전투 시작 →</button><button data-do="load" ${loaded.state||state.campaign.clears?'':'disabled'}>저장 불러오기</button><button data-do="help">플레이 안내</button></div><div class="title-bottom"><div>TACTICAL COMBAT<br><span class="accent">지형 · 사거리 · 협공</span></div><div>CHARACTER GROWTH<br><span class="accent">다섯 장수 · 서로 다른 역할</span></div><div>HIDDEN POTENTIAL<br><span class="accent">행동에서 발견하는 단서</span></div></div></div>`;
 else if(state.screen==='intro')html=`<div class="screen-inner"><div class="eyebrow">PROLOGUE · THE BORDERLANDS</div><h2>불길 너머의 약속</h2><div class="story">왕국이 무너진 지 세 번째 겨울.<br>국경의 작은 마을마저 산적 Garr의 손에 불타고 있다.<br><br>Eric은 닳은 방패를 들었다.<br>“왕관은 잃었어도, 지킬 사람은 아직 남아 있어.”<br><br>숲의 사수 Elina, 서툰 마법사 Lia, 치유사 Sain,<br>그림자처럼 빠른 Kai가 그의 곁에 섰다.</div><button class="primary" data-do="warroom">동료들과 전투 준비 →</button></div>`;
 else if(state.screen==='warroom')html=`<div class="screen-inner"><div class="eyebrow">WAR ROOM · PREPARE YOUR COMPANY</div><h2>누가 선두에 설 것인가?</h2><p class="muted" style="margin-top:10px">장수를 눌러 고유 능력을 확인하세요. 이번 미션에는 다섯 명 모두 출전합니다.</p><div class="hero-cards">${heroCards()}</div>${heroDetail(u)}<div class="row"><span class="muted spacer">12×10 전장 · 7명의 산적 · 2명의 주민<br>회복약 2개 · 전투불능 장수는 승리 후 복귀</span><button class="primary" data-do="deploy">자유 배치 시작 →</button></div></div>`;
 else if(state.screen==='result'){
 const victory=state.outcome==='victory',last=state.campaign.results.at(-1);
 html=`<div class="screen-inner"><div class="eyebrow">MISSION 01 · GROWTH JOURNAL</div><div class="result-head"><h2>${victory?'Village Saved':'A Costly Lesson'}</h2><span class="muted">TURN ${state.turn}<br>${victory?'VICTORY':'DEFEAT'} · 주민 ${last.rescued}/2</span></div><p style="font-size:13px;margin-top:12px">${esc(state.reason)}</p><div class="badges"><span class="badge ${last.allAlive?'':'failed'}">${last.allAlive?'✓':'◇'} 전원 생존</span><span class="badge ${last.swift&&victory?'':'failed'}">${last.swift&&victory?'✓':'◇'} 8턴 이내 승리</span><span class="badge ${last.potential?'':'failed'}">${last.potential?'✓':'◇'} Guardian’s Oath 단서</span></div><div class="growth-list">${HEROES.map(h=>{const a=findUnit(state,h.id),start=state.missionStart.find(m=>m.id===a.id);const gains=a.growthHistory.filter(g=>g.level>start.level);return `<article class="growth-card" data-growth="${a.id}"><div class="row"><h3>${a.name}</h3><span class="gain">+${a.earnedXP} EXP · LV ${start.level} → ${a.level}</span></div><p>${gains.length?`성장: HP +${a.maxHP-start.stats.maxHP} · ATK +${a.atk-start.stats.atk} · DEF +${a.def-start.stats.def} · MAG +${a.mag-start.stats.mag}`:'이번 전투의 경험이 다음 성장을 준비합니다.'}</p><p>${esc([...new Set(a.highlights)].slice(-3).join(' · ')||'동료와 함께 첫 전장을 경험했습니다.')}${a.hp===0?' · 전투불능':''}</p><p class="accent">${a.clues.length?`Potential: ${esc(a.clues.join(', '))} (1/3)`:'숨겨진 잠재력은 아직 발견되지 않았습니다.'}</p><p class="goal">다음 성장 목표 · ${esc(h.goal)}</p></article>`;}).join('')}</div><div class="row"><button class="primary" data-do="replay" ${ui.busy?'disabled':''}>${victory?'성장한 군단으로 다시 출전':'전투 전 성장으로 재도전'} →</button><button data-do="fresh-replay" ${ui.busy?'disabled':''}>LV 초기 상태로 연습</button><button data-do="backup" ${ui.busy?'disabled':''}>텍스트 백업</button></div><p class="muted" style="margin-top:13px">${ui.busy?'전투 결과를 정리하고 있습니다. 잠시 후 재도전할 수 있습니다.':victory?'성장한 장수와 결과가 저장되었습니다.':'패배 기록을 저장했습니다. 재도전은 이번 전투 시작 전 성장 상태로 돌아갑니다.'} v0.1에는 첫 전투만 포함됩니다.</p></div>`;
 }
 $('#screen').innerHTML=`<div class="screen-overlay ${state.screen==='result'?'result-overlay':''}">${html}</div>`;
}
function modal(title,body,actions){$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${body}<div class="row">${actions}<button data-do="close-modal">닫기</button></div></section></div>`;$('#modal-root button')?.focus();}
function closeModal(){$('#modal-root').innerHTML='';$('#battle-map').focus({preventScroll:true});}
const help=()=>modal('전투 안내',`<p><b>목표:</b> 주민 2명 구출 + 산적 대장 Garr 격파. 주민 한 명이라도 사망하거나 아군이 전멸하면 패배합니다.</p><p><b>조작:</b> 장수 탭 → 작은 행동 메뉴 → 이동 → 목적지 → 이동 확정. 이후 공격/스킬 → 대상 → 예측 → 행동 확정. 유닛당 이동 1회와 행동 1회. 공격·스킬·구출·약·대기는 행동을 마칩니다. 행동 전 이동은 Z로 취소할 수 있습니다.</p><p><b>지형:</b> Grass / Road 이동 비용 1. Forest 비용 2, DEF +1 / 회피 +12%; Kai는 숲 비용 1. Village DEF +2. Ruin은 통과 불가. 사거리는 직교 거리입니다. 건물이나 숲이 사격을 차단하지 않습니다.</p><p><b>스킬:</b> Guard는 인접 동료를 보호하며, Eric이 그 동료 옆에 있을 때 첫 인접 근접 피해를 대신 받습니다. Fire Bolt는 RES를 적용합니다. Heal은 자기 회복 가능. Quick Strike의 협공은 적 반대편 인접 아군이 있어야 성립합니다.</p><p><b>이벤트:</b> TURN 3 증원, TURN 5 주민 공격 시작. 주민 옆에서 구출 행동. 마법에도 기본 공격 사거리 내에서는 반격 가능. 반격에 대한 재반격은 없습니다.</p><p><b>키:</b> 1 이동 · 2 공격 · 3 스킬 · 4 구출 · Z 취소 · W 대기 · Tab 다음 장수 · E Phase 종료 · Escape 취소. 휠 Zoom, 우클릭/Shift 드래그 Pan. Touch는 탭과 드래그 Pan 지원. 선택한 장수의 얼굴과 HP/MP는 하단에 표시됩니다. 작은 메뉴에서 스킬·도구·특성을 열 수 있습니다. 하단에서 칸별 걷기 / 연속 걷기 / 즉시 이동, 속도와 약한 효과를 선택하세요. 두 손가락으로 확대할 수 있습니다. 이동을 선택한 뒤 같은 Tile을 누르면 제자리에서 행동합니다.</p><p>로컬 저장은 현재 브라우저와 파일 경로에 연결됩니다. 파일을 옮기거나 다른 브라우저를 사용하기 전 텍스트 백업을 권장합니다. 초기화는 메뉴에서 직접 확인합니다.</p>`,'');
function nextHero(){const ids=HEROES.map(h=>h.id),start=ids.indexOf(ui.selected);for(let i=1;i<=5;i++){const u=findUnit(state,ids[(start+i)%5]);if(canAct(state,u)){ui.selected=u.id;ui.mode='choose';ui.preview=null;ui.notice=null;ui.inspected=null;render();return;}}ui.preview=null;render();}
async function effects(before){const duration=renderer.addEffects(state.feedback,before,{movement:ui.movement,speed:ui.speed,reduced:ui.reduced});const potential=state.feedback.find(e=>e.type==='potential');if(potential){const u=findUnit(state,potential.id);toast(`${u.name} · Potential Clue Discovered — ${u.clues.at(-1)} (1/3)`);}await new Promise(r=>setTimeout(r,duration+24));}
async function enemyLoop(){if(enemyRunning)return;ui.menu=null;enemyRunning=true;ui.busy=true;render();try{while(state.phase==='enemy'&&state.screen==='battle'){const before=structuredClone(state);advanceEnemy(state);const playing=effects(before);save();render();await playing;}ui.preview=null;if(!canAct(state,findUnit(state,ui.selected)))ui.selected=HEROES.find(h=>alive(findUnit(state,h.id)))?.id||'eric';ui.mode='choose';}finally{ui.busy=false;enemyRunning=false;commit();}}
async function execute(mode,target){if(ui.busy)return;const before=structuredClone(state);const r=performAction(state,ui.selected,mode,target);if(!r.ok){toast(r.error);return;}ui.preview=null;ui.menu=null;ui.notice=null;ui.inspected=null;ui.phaseConfirm=false;ui.busy=true;const playing=effects(before);save();render();await playing;ui.busy=false;if(state.screen==='battle')nextHero();commit();}
async function dispatch(action,id){if(ui.pendingMove&&!['confirm-move','cancel-move','close-unit-menu','zoom-in','zoom-out','reset-camera','help','close-modal'].includes(action)){ui.menu='move-confirm';render();toast('먼저 이동을 확정하거나 취소하세요.');return;}if(ui.busy&&!['journal','zoom-in','zoom-out','reset-camera','help','close-modal'].includes(action))return;
 switch(action){
 case 'new':state=newGame(state.initialSeed,state.campaign);ui.selected='eric';setScreen('intro');break;
 case 'warroom':setScreen('warroom');break;case 'deploy':setScreen('deployment');break;
 case 'select':{const u=findUnit(state,id);if(!u||u.team!=='ally'||state.screen==='battle'&&!alive(u))break;ui.selected=id;ui.menu=state.screen==='battle'?'root':null;ui.mode=initialMode(u);ui.preview=null;ui.notice=null;ui.inspected=null;ui.phaseConfirm=false;render();break;}
 case 'preset':presetDeployment(state,id);commit();break;
 case 'start-battle':if(startBattle(state)){ui.mode='choose';ui.notice=null;commit();toast('주민 2명 구출 + Garr 격파. 먼저 남쪽 산적을 저지하세요.');}break;
 case 'open-unit-menu':ui.menu=ui.pendingMove?'move-confirm':'root';render();break;
 case 'submenu':ui.menu=id;render();break;
 case 'close-unit-menu':if(ui.pendingMove)await cancelMovement();else{ui.menu=null;ui.preview=null;render();}break;
 case 'cancel-target':ui.menu=null;ui.preview=null;render();break;
 case 'confirm-move':confirmMovement();break;
 case 'cancel-move':await cancelMovement();break;
 case 'mode':if(canAct(state,findUnit(state,ui.selected))||state.screen==='deployment'){ui.mode=id;ui.menu=null;ui.preview=null;ui.notice=null;ui.inspected=null;ui.phaseConfirm=false;render();}break;
 case 'undo':if(undoMove(state,ui.selected)){ui.menu='root';ui.mode='choose';ui.preview=null;commit();}break;
 case 'wait':await execute('wait');break;case 'item':await execute('item');break;
 case 'confirm':if(ui.preview)await execute(ui.mode,ui.preview);break;
 case 'cancel':if(ui.pendingMove){await cancelMovement();break;}ui.menu=null;ui.preview=null;ui.mode='choose';ui.notice=null;ui.inspected=null;ui.phaseConfirm=false;render();break;
 case 'next':nextHero();break;
 case 'end-phase':{ui.menu=null;const n=state.units.filter(u=>canAct(state,u)).length;if(n){ui.phaseConfirm=true;ui.preview=null;render();}else if(beginEnemyPhase(state)){save();await enemyLoop();}break;}
 case 'confirm-phase':ui.menu=null;ui.phaseConfirm=false;if(beginEnemyPhase(state)){save();await enemyLoop();}break;
