:root{color-scheme:dark;--ink:#ede7d6;--dim:#a6b5b2;--gold:#d9bc7d;--line:#3b5355;--panel:#1b3035;--blue:#88c5d2;--red:#c77f76;--green:#abc48a;font-family:Georgia,'Ashen UI',serif;background:#102529;color:var(--ink)}

.bag-grid{display:grid;grid-template-columns:repeat(3,56px);gap:6px}
.bag-slot{width:56px;height:56px;display:grid;place-items:center;background:radial-gradient(#2b4a4f,#163036);border:2px solid #4c6f70;border-radius:6px;padding:0}
.bag-slot.empty{border-style:dashed;opacity:.45}.bag-slot.active{border-color:#e2c27c;box-shadow:0 0 0 2px #e2c27c55}
.bag-counts{display:flex;gap:6px;margin-top:8px}.bag-count{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:5px}.bag-count.active{border-color:#e2c27c}
.item-detail{display:flex;gap:12px;align-items:flex-start;padding:12px;background:#10262b;border:1px solid #d8bb7c66;border-radius:8px;min-height:110px}
.item-detail h3{margin:0 0 4px;color:#f1e3b8}.item-detail p{margin:0 0 6px;font-size:13px}
.gear-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.gear-cell{position:relative;display:grid;justify-items:center;gap:2px;padding:6px 4px;background:#163036;border:1px solid #3f6266;border-radius:6px}
.gear-cell small{font-size:10px;text-align:center;line-height:1.2}.gear-cell i{position:absolute;top:3px;right:5px;font:700 10px Arial;color:#9fe0b5;font-style:normal}
.gear-cell em{position:absolute;top:3px;left:4px;font:700 9px Arial;font-style:normal;background:#d8bb7c;color:#13262a;border-radius:3px;padding:0 3px}
.bag-pending{color:#f1d58c}
.paperdoll{display:grid;grid-template-columns:150px 1fr 1.2fr;gap:12px;align-items:start;margin:10px 0}
.doll-portrait{text-align:center}.doll-portrait h3{margin:6px 0 0;font-size:14px}
.doll-slots{display:grid;gap:8px}
.doll-slot{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:8px;background:#10262b;border:1px solid #3f6266;border-radius:6px}
.doll-slot.filled{border-color:#d8bb7c99}.doll-slot .doll-name{grid-column:1/-1;font:600 10px Arial;letter-spacing:.1em;color:#9fb4a8}
.doll-slot .doll-empty{width:40px;height:40px;display:grid;place-items:center;border:1px dashed #4c6f70;border-radius:4px;font-size:10px;color:#8ea39a}
.doll-slot b{font-size:12px}.doll-slot button{grid-column:2;justify-self:start;padding:2px 8px;font-size:11px}
.doll-stats{display:grid;gap:6px}.stat-row{display:grid;grid-template-columns:34px 1fr 64px;gap:8px;align-items:center;font:12px Arial,'Ashen UI',sans-serif}
.stat-bar{position:relative;height:8px;background:#0c1d21;border-radius:4px;overflow:hidden}.stat-bar i{position:absolute;inset:0 auto 0 0;background:#6fa6b2}.stat-bar em{position:absolute;top:0;bottom:0;background:#e2c27c}
.gear-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.gear-card{display:flex;gap:10px;padding:8px;background:#163036;border:1px solid #3f6266;border-radius:6px}.gear-card.unfit{opacity:.6}.gear-card h3{margin:0;font-size:13px}.gear-card p{margin:2px 0;font-size:12px}
@media(max-width:720px){.bag-layout{grid-template-columns:1fr}.paperdoll{grid-template-columns:1fr}.doll-portrait{display:flex;align-items:center;gap:10px;text-align:left}.doll-portrait canvas{width:72px;height:72px}}
.turn-prompt{position:absolute;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);min-width:250px;padding:14px 18px 16px;background:#152b30f7;border:2px solid #d8bb7c;border-radius:8px;box-shadow:0 10px 30px #071a24cc;text-align:center}
.turn-prompt .row{justify-content:center;gap:10px}.turn-prompt button{min-width:84px}
.turn-prompt[hidden]{display:none}
.chest-find{display:flex;gap:14px;align-items:center;justify-content:center;padding:10px 0;font:15px/1.6 Arial,'Ashen UI',sans-serif}.chest-find b{color:#f1d58c}
/* v0.4 benchmark pass: tabbed unit sheet. */
.info-tabs{display:flex;gap:4px;margin:4px 0 10px;flex-wrap:wrap}.info-tabs button{padding:5px 14px}.info-tabs button.active{border-color:#e2c27c;color:#f1d58c;background:#27464a}

.info-bar.hp i{background:#8fc78a}.info-bar.mp i{background:#6fa6d6}.info-bar.xp i{background:#e2c27c}
.info-body{padding:10px 2px}.grade-table{border-collapse:collapse;width:100%;max-width:420px}.grade-table th{text-align:left;font-weight:600;padding:5px 8px;color:#c7d6c6}.grade-table td{padding:5px 8px}
.grade{font:700 16px Arial;width:34px;text-align:center}.g-S{color:#ffd86b}.g-A{color:#f4b860}.g-B{color:#9fd3a1}.g-C{color:#8fc0d8}.g-D{color:#a9a9b8}.g-E{color:#8b8b8b}
.info-note{font-size:12px;color:#cbd8c7}.info-bio{font:14px/1.9 'Ashen UI',Arial,'Ashen UI',sans-serif;max-width:560px}
.tactic-card{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}.tactic-card h4{margin:0 0 4px;grid-column:1}.tactic-card p{grid-column:1;margin:0;font-size:13px}.tactic-card .range-grid{grid-column:2;grid-row:1/3}

.class-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.class-grid h4{margin:0 0 6px}.apt-table{border-collapse:collapse;font-size:12px}.apt-table th,.apt-table td{padding:3px 8px;border-bottom:1px solid #284346;text-align:left}
.info-slots{display:grid;gap:8px;max-width:420px}
@media(max-width:720px){.class-grid,.tactic-card{grid-template-columns:1fr}.tactic-card .range-grid{grid-column:1;grid-row:auto}.info-head{grid-template-columns:72px 1fr}.info-head canvas{width:72px;height:72px}}

.result-banner.win h2{color:#f1d58c;text-shadow:0 0 18px #e2c27c66}.result-banner.lose h2{color:#d98a7c}
.result-banner span{font:15px 'Ashen UI',Arial,'Ashen UI',sans-serif;color:#cfdccf}
.result-reason{font-size:15px;color:#e8d6c8}

.reward-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:#132a2e;border:2px solid #d8bb7c88;border-radius:10px;font:600 16px 'Ashen UI',Arial,'Ashen UI',sans-serif;color:#f6ebc9}
.reward-chip.bond{border-color:#e48aa0;color:#ffd3de}.reward-chip.warn{border-color:#c98a4a}
.stars{display:flex;justify-content:center;gap:18px;margin:4px 0 14px}.star{display:grid;justify-items:center;font-size:28px;color:#5e6f69}.star.on{color:#f3cf6c;text-shadow:0 0 10px #f3cf6c77}.star small{font:12px Arial,'Ashen UI',sans-serif;color:#b9c8bf}

/* v0.4 feedback #4: classic SRPG dialogue window — painted bust overlapping a translucent box.
   The whole screen is the "next" button; only Auto/Skip remain (top-right). */
.dialogue-backdrop{--bust-h:clamp(250px,54vh,500px);display:block;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;background:linear-gradient(180deg,rgba(6,12,16,0) 45%,rgba(6,12,16,.5))}
.dialogue-backdrop.staged-scene{background:#08181f}
.dialogue-backdrop.in-place-dialogue{background:linear-gradient(180deg,rgba(6,12,16,0) 50%,rgba(6,12,16,.42))}
.dialogue-backdrop .dialogue-panel{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(1120px,calc(100% - 24px));max-width:none;height:clamp(132px,25vh,214px);display:block;gap:0;padding:0;margin:0;background:linear-gradient(180deg,rgba(18,24,32,.86),rgba(8,11,16,.93));border:1px solid rgba(220,182,108,.62);border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,232,180,.12),0 10px 36px rgba(0,0,0,.5);animation:dialogueIn .18s ease-out;z-index:1}
.dialogue-backdrop .dialogue-panel.reduced{animation:none}
.dialogue-backdrop .story-bust{position:absolute;left:6px;bottom:-1px;height:var(--bust-h);width:auto;aspect-ratio:360/440;image-rendering:auto;pointer-events:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.dialogue-backdrop .dialogue-copy{position:absolute;left:calc(var(--bust-h)*.80 + 10px);right:52px;top:16px;bottom:14px;overflow:hidden}
.dialogue-backdrop .dialogue-name{margin:0 0 8px;font:bold 22px/1.2 Georgia,'Ashen UI',serif;color:#f4a43c;letter-spacing:.04em;text-shadow:0 2px 0 #1a0e04,0 0 10px rgba(240,150,40,.25)}
.dialogue-backdrop .dialogue-text{margin:0;min-height:0;font:19px/1.72 Arial,'Ashen UI',sans-serif;color:#f6f2e8;text-shadow:0 1px 0 #000;word-break:keep-all;overflow-wrap:anywhere}
.dialogue-next{position:absolute;right:20px;bottom:16px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid #f0c060;filter:drop-shadow(0 0 4px rgba(240,190,90,.6));animation:nextBob 1s ease-in-out infinite}
.story-controls{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));display:flex;gap:6px;z-index:3}
.story-controls button{min-height:40px;min-width:62px;padding:6px 14px;background:rgba(14,20,28,.8);border:1px solid rgba(220,182,108,.65);border-radius:3px;color:#f2e3c0;font:bold 14px Arial,'Ashen UI',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.story-controls button.on{background:#c89640;border-color:#f3d590;color:#1b1208}
.dialogue-backdrop #scene-stage{left:0;top:0;transform:none;width:100%;height:calc(100dvh - clamp(132px,25vh,214px) - 10px)}
@keyframes nextBob{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(4px);opacity:.55}}
@keyframes dialogueIn{from{opacity:.4;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@media(max-width:600px){
 .dialogue-backdrop{--bust-h:clamp(200px,34vh,300px)}
 .dialogue-backdrop .dialogue-panel{height:clamp(150px,23vh,190px);width:calc(100% - 16px);bottom:max(10px,env(safe-area-inset-bottom))}

}

 'pre:1':[['aren','에릭, 아침 종 울리기 전에 한 바퀴 돌자. 병사들은 좀 어때?'],['eric','방패 고치는 중이다. 오늘은 좀 조용했으면 좋겠군.'],['aren','네 눈으로 본 것도 듣고 싶다.'],['elina','북쪽 숲에 낯선 발자국이 있어요. 습격이라고 하기엔… 아직 일러요.'],['aren','주민들이 겁먹지 않게 확인해 줘. …에릭, 마을을 부탁한다.'],['lia','아, 기록 보던 중이었어요! 떠나기 전에 잠깐 얘기할 수 있어요?'],['sain','피난민분들이 쉬고 계세요. 약이 없어도 제 손 닿는 데까지는 돕겠습니다.'],['kai','같은 길을 가려면 준비가 돼야지. 할 말 있으면 동쪽 길목으로 와.'],['eric','동료들은 내가 둘러보지. 정찰 보고는 리아한테 듣고.'],['aren','서두르지 마라. 빠뜨린 게 없는지… 천천히 보자.']],

// Supplement existing first-clear Gold, never replace or repeat it.
function supplementalRewards(missionId,{rescued=0,captured=false,seal=false,orders=false,broken=false,wagons=0,refugees=0,beacon=false}={}){
 const reward=(suffix,kind,type,amount=1,optional=false)=>({id:`v032:m${missionId}:${suffix}`,missionId,kind,type,amount,optional});
 if(missionId===1)return [reward('supply','item','medium'),...(rescued===2?[reward('rescue','item','ward',1,true)]:[])];
 if(missionId===2)return [reward('supply','item','ether'),...(captured?[reward('capture','gold',null,30,true)]:[])];
 if(missionId===3)return [reward('supply-hp','item','medium'),reward('supply-mp','item','ether'),...(rescued===2?[reward('full-rescue','gear','focusCharm',1,true)]:[])];
 const v4=(suffix,kind,type,amount=1,optional=false)=>({...reward(suffix,kind,type,amount,optional),id:`v040:m${missionId}:${suffix}`});
 if(missionId===4)return [v4('supply','item','medium'),...(seal?[v4('seal-notes','gear','focusCharm',1,true)]:[]),...(orders?[v4('orders','gold',null,40,true)]:[]),...(seal&&orders?[v4('all-evidence','item','ether',1,true)]:[])];
 if(missionId===5)return [v4('supply-mp','item','ether'),v4('supply-hp','item','medium'),...(broken?[v4('formation-broken','gear','heavyShield',1,true)]:[]),...(wagons===2?[v4('both-wagons','gold',null,50,true)]:[])];
 if(missionId===6)return [v4('supply-hp','item','medium'),v4('supply-mp','item','ether'),...(refugees===4?[v4('all-refugees','gear','trailBoots',1,true)]:[]),...(beacon?[v4('beacon','gold',null,60,true)]:[])];
 return [];
}
const knownRewards=()=>[1,2,3,4,5,6].flatMap(id=>supplementalRewards(id,{rescued:2,captured:true,seal:true,orders:true,broken:true,wagons:2,refugees:4,beacon:true}));
function initRewardLedger(e){e.rewardClaims??=[];e.rewardHistory??=[];e.rewardPending??=[];return e;}
function deliverRewards(e){let count=0;for(let i=0;i<e.rewardPending.length;){const r=e.rewardPending[i];if(r.kind==='item'&&Object.values(e.items).reduce((a,b)=>a+b,0)<6){e.items[r.type]++;}else if(r.kind==='gear'&&e.gear.length<24){e.gear.push({id:`g${e.next++}`,type:r.type,level:0});}else{i++;continue;}e.rewardPending.splice(i,1);count++;}return count;}
function grantSupplemental(e,missionId,context={},legacy=false){initRewardLedger(e);const grants=[];for(const r of supplementalRewards(missionId,context)){if(e.rewardClaims.includes(r.id))continue;e.rewardClaims.push(r.id);e.rewardHistory.push({...r,legacy});if(r.kind==='gold')e.gold+=r.amount;else for(let n=0;n<r.amount;n++)e.rewardPending.push({...r});grants.push(r);}deliverRewards(e);return grants;}
function legacyRewardCatchup(e,campaign){initRewardLedger(e);for(const id of campaign.completed||[]){const result=campaign.results.find(r=>r.missionId===id&&r.outcome==='victory'&&!r.practice);const rescued=result?.rescued??(id===1?campaign.flags.mission_01_civilians_rescued:id===3?campaign.flags.mission_03_refugees_saved:0)??0;grantSupplemental(e,id,{rescued,captured:!!campaign.flags.mission_02_prisoner_captured,seal:!!campaign.flags.mission_04_seal_notes,orders:!!campaign.flags.mission_04_transfer_orders,broken:campaign.flags.mission_05_baldrick_withdrew==='broken',wagons:campaign.flags.mission_05_wagons_saved||0,refugees:campaign.flags.mission_06_refugees_through||0,beacon:!!campaign.flags.mission_06_beacon_destroyed},true);}}
function validateRewardLedger(e){const known=new Map(knownRewards().map(r=>[r.id,r]));const valid=r=>{const k=known.get(r?.id);return k&&['missionId','kind','type','amount','optional'].every(p=>r[p]===k[p]);};if(!Array.isArray(e.rewardClaims)||new Set(e.rewardClaims).size!==e.rewardClaims.length||e.rewardClaims.some(id=>!known.has(id))||!Array.isArray(e.rewardHistory)||e.rewardHistory.length!==e.rewardClaims.length||new Set(e.rewardHistory.map(r=>r.id)).size!==e.rewardHistory.length||e.rewardHistory.some(r=>!valid(r)||!e.rewardClaims.includes(r.id)||typeof r.legacy!=='boolean')||!Array.isArray(e.rewardPending)||new Set(e.rewardPending.map(r=>r.id)).size!==e.rewardPending.length||e.rewardPending.some(r=>!valid(r)||r.kind==='gold'||!e.rewardClaims.includes(r.id)))throw Error('보상 기록이 손상되었습니다.');}
const rewardLabel=r=>r.kind==='gold'?`${r.amount} Gold`:`${r.kind==='gear'?GEAR[r.type].name:TOOLS[r.type].name} × ${r.amount}`;

// Runtime-only input: never serialized. One step per frame avoids catch-up overshoot.
function createHeldMovement(step,{delay=180,interval=100}={}){
 let held=new Map(),next=Infinity;
 return {
  press(source,direction,now){if(held.has(source))return;held.set(source,direction);next=now+delay;if(!step(...direction))this.clear();},

function narrativeState(){return {queue:[],active:null,events:[],seen:[],history:[],auto:false};}
function enqueueStory(s,key){const n=s.narrative;if(!n||!STORY[key]||n.events.includes(key))return false;n.events.push(key);n.queue.push(key);return true;}
function openStory(s){const n=s.narrative;if(!n.active&&n.queue.length)n.active={key:n.queue.shift(),index:0};return n.active;}
function storyLine(s){const a=s.narrative?.active;return a?STORY[a.key]?.[a.index]:null;}
function advanceStory(s,skip=false){const n=s.narrative,a=n.active;if(!a)return false;const lines=STORY[a.key];if(skip){for(let i=a.index;i<lines.length;i++)n.history.push({...lines[i],scene:a.key});a.index=lines.length;}else{n.history.push({...lines[a.index],scene:a.key});a.index++;}n.history=n.history.slice(-250);if(a.index>=lines.length){if(!n.seen.includes(a.key))n.seen.push(a.key);n.active=null;openStory(s);}s.campaign.dialogueMemory={seen:[...n.seen],history:structuredClone(n.history)};return true;}
function remember(s,key){if(s.practice)return;s.campaign.tacticalMemory[key]=(s.campaign.tacticalMemory[key]||0)+1;}
function setStoryFlag(s,key,value=true){if(!s.practice)s.campaign.flags[key]=value;}
function introStory(s){enqueueStory(s,`${s.missionId}:intro`);if(s.campaign?.choices?.m04_records_choice)enqueueStory(s,`${s.missionId}:intro:${s.campaign.choices.m04_records_choice}`);openStory(s);}
function afterBattleEvents(s){
 if(s.screen==='battle'&&s.phase==='player'&&s.turn===2)enqueueStory(s,`${s.missionId}:turn2`);
 if(s.missionId===1&&s.screen==='battle'&&s.turn===4)enqueueStory(s,'1:turn4');
 if(s.units.some(u=>u.rescued))enqueueStory(s,`${s.missionId}:rescue`);
 if(s.missionId===3&&s.units.some(u=>u.team==='civilian'&&u.hp<=0))enqueueStory(s,'3:loss');

function enterInterior(s,kind){const f=s.frontier;if(s.screen!=='exploration'||s.narrative.active||f.interior)return false;

 if(!door&&(!INTERIORS[kind]||INTERIORS[kind].generic||!interactions(s).some(n=>n.action===kind)))return false;
 f.returnPosition={hub:f.hub,x:f.x,y:f.y,facing:f.facing};f.interior=door?door.interior:kind;if(door)f.interiorBuilding=door.buildingId;[f.x,f.y]=INTERIORS[f.interior].spawn;f.facing='up';syncFrontier(s);return true;}

function validateFrontier(f){if(f?.pendingRecruit!=null&&(!RECRUITS[f.pendingRecruit]||f.affiliation?.[f.pendingRecruit]!=='encountered'))throw Error('동료 선택 기록이 손상되었습니다.');if(!f||f.actorId!=='eric'||f.campaignEntry!=='advisor'||typeof f.advisorPending!=='boolean'||!HUBS[f.hub]||!Number.isInteger(f.x)||!Number.isInteger(f.y)||!['preparation','aftermath'].includes(f.phase)||!['up','down','left','right'].includes(f.facing)||!f.visited||!f.affiliation||!Array.isArray(f.events)||!Array.isArray(f.members)||new Set(f.members).size!==5||f.members.length!==5||!['eric','elina','lia','sain','kai'].every(id=>f.members.includes(id)&&['available','encountered','affiliated'].includes(f.affiliation[id]))||!f.ready||['equipment','items','formation','objective'].some(k=>typeof f.ready[k]!=='boolean'))throw Error('탐색 기록이 손상되었습니다.');for(const hub of Object.keys(HUBS))if(!Array.isArray(f.visited[hub])||f.visited[hub].some(id=>!HUBS[hub].places.some(p=>p.id===id)))throw Error('방문 기록이 손상되었습니다.');if(f.interiorBuilding!=null&&(typeof f.interiorBuilding!=='string'||!INTERIORS[f.interior]?.generic||!HUBS[f.hub]?.places.some(p=>p.buildingId===f.interiorBuilding&&p.interior===f.interior)))throw Error('건물 내부 기록이 손상되었습니다.');if(f.interior&&INTERIORS[f.interior]?.generic&&f.interiorBuilding==null)throw Error('건물 내부 기록이 손상되었습니다.');if(f.interior){if(!INTERIORS[f.interior]||!f.returnPosition||f.returnPosition.hub!==f.hub||!walkable({frontier:{...f,interior:null}},f.returnPosition.x,f.returnPosition.y))throw Error('상점 복귀 위치가 손상되었습니다.');}const dummy={frontier:f};if(!walkable(dummy,f.x,f.y))throw Error('에릭 위치가 손상되었습니다.');return f;}

function migrateFrontier(f,missionId=1){

  if(!INTERIORS[f.interior]){delete f.interior;delete f.interiorBuilding;delete f.returnPosition;}

// src/core/rules.js
const distance=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
const key=(x,y)=>`${x},${y}`;
const alive=u=>u.hp>0&&!u.rescued;
const terrainAt=(x,y,s)=>TERRAIN[(s?missionOf(s).map:MAP)[y]?.[x]];
const findUnit=(s,id)=>s.units.find(u=>u.id===id);
const at=(s,x,y)=>s.units.find(u=>alive(u)&&u.x===x&&u.y===y);
function nextRandom(state){const next=(Math.imul(state>>>0,1664525)+1013904223)>>>0;return {state:next,value:next/4294967296};}
function roll(s){const r=nextRandom(s.rng);s.rng=r.state;return r.value;}
function terrainCost(s,u,x,y){const type=missionOf(s).map[y]?.[x];if(!type||missionOf(s).layers.collision[y]?.[x]||!Number.isFinite(TERRAIN[type]?.cost))return Infinity;const profile=u.movementProfile||CLASS_MOVEMENT[HERO_CLASS[u.id]]?.profile||'infantry';return TERRAIN_COSTS[profile]?.[type]??TERRAIN[type].cost;}
function movement(s,u,ignore=false){
 const start=key(u.x,u.y), costs=new Map([[start,0]]),prev=new Map(),queue=[{x:u.x,y:u.y,c:0}];
 const allowance=effectiveStats(s,u).mov+(u.shadowBonus||0);
 while(queue.length){queue.sort((a,b)=>a.c-b.c);const p=queue.shift();if(p.c!==costs.get(key(p.x,p.y)))continue;
  for(const [dx,dy] of [[0,-1],[-1,0],[1,0],[0,1]]){const x=p.x+dx,y=p.y+dy,t=terrainAt(x,y,s);if(!t||!Number.isFinite(t.cost))continue;
   const occupant=at(s,x,y);if(!ignore&&occupant&&occupant.id!==u.id&&occupant.team!==u.team)continue;
   const c=p.c+terrainCost(s,u,x,y),k=key(x,y);
   if(c<=allowance&&c<(costs.get(k)??Infinity)){costs.set(k,c);prev.set(k,key(p.x,p.y));queue.push({x,y,c});}
  }
 }
 if(!ignore)for(const p of [...costs.keys()]){const [x,y]=p.split(',').map(Number),occupant=at(s,x,y);if(occupant&&occupant.id!==u.id)costs.delete(p);}
 return {costs,prev};
}
function pathTo(s,u,x,y){const {costs,prev}=movement(s,u);let k=key(x,y);if(!costs.has(k))return null;const path=[];while(k){const [px,py]=k.split(',').map(Number);path.unshift({x:px,y:py});k=prev.get(k);}return path;}
function skillCost(u){const h=HEROES.find(h=>h.id===u.id);return (h?.cost||0)+(u.id==='lia'&&u.hp<=u.maxHP/2?1:0);}
function rangeFor(u,mode='attack'){return mode==='skill'&&u.id==='lia'?[1,3]:mode==='skill'&&u.id==='sain'?[0,2]:mode==='skill'&&u.id==='eric'?[0,0]:u.range;}
function validTarget(s,u,t,mode='attack'){
 if(!u||!t||!alive(u)||!alive(t))return false;
 const d=distance(u,t);if(t.team==='object')return mode==='search'&&u.team==='ally'&&d===1&&!t.locked&&!t.inert;if(mode==='search')return false;if(mode==='capture')return s.missionId===2&&t.id==='boss'&&t.team==='enemy'&&t.hp<=t.maxHP/2&&d===1;
 if(mode==='rescue')return t.team==='civilian'&&t.kind!=='wagon'&&!missionOf(s).escortOnly&&d===1;
 if(mode==='skill'&&u.id==='eric')return t.id===u.id;
 if(mode==='skill'&&u.id==='sain')return (t.team==='ally'||t.team==='civilian'&&missionOf(s).healCivilians&&t.kind!=='wagon')&&d>=rangeFor(u,mode)[0]&&d<=rangeFor(u,mode)[1];
 const [min,max]=rangeFor(u,mode);return u.team!==t.team&&t.team!=='civilian'&&d>=min&&d<=max;
}
function flank(s,u,t){return s.units.some(a=>a.team===u.team&&alive(a)&&a.id!==u.id&&distance(a,t)===1&&((u.x<t.x&&a.x>t.x)||(u.x>t.x&&a.x<t.x)||(u.y<t.y&&a.y>t.y)||(u.y>t.y&&a.y<t.y)));}
function strikeStats(s,u,t,mode='attack'){
 u=effectiveStats(s,u);t=effectiveStats(s,t);
 const magic=mode==='skill'&&u.id==='lia',aim=mode==='skill'&&u.id==='elina',quick=mode==='skill'&&u.id==='kai';
 const ground=terrainAt(t.x,t.y,s),defense=magic?t.res:t.def,burning=!!s.burning?.[key(t.x,t.y)];
 let raw=Math.max(1,(magic?u.mag:u.atk)-defense+(aim?2:0)+(magic&&u.hp<=u.maxHP/2?4:0)+(quick&&flank(s,u,t)?6:0));
 let dmg=Math.max(1,Math.round(magic?raw*(ground.fire??1):raw*(1-(ground.phys||0))));
 if(t.id==='eric'&&t.hp<=t.maxHP*.3)dmg=Math.max(1,Math.floor(dmg*.85));
 // M05 lion formation (mission data only; M01–04 have no formation): living bearers give adjacent
 // allies of theirs DEF and accuracy; Baldrick's charge punishes isolated targets unless Erik guards.
 const form=missionOf(s).formation;let formHit=0;
 if(form){const near=v=>v.team==='enemy'&&!form.bearers.includes(v.id)&&s.units.some(b=>form.bearers.includes(b.id)&&alive(b)&&distance(b,v)===1);
  if(near(t)&&!magic)dmg=Math.max(1,dmg-form.def);else if(near(t)&&magic)dmg=Math.max(1,dmg-form.def);
  if(near(u))formHit=form.hit;
  if(u.id==='boss'&&isolated(s,t)&&!(t.guarding&&!t.guardUsed))dmg+=form.charge;}
 const standing=missionOf(s).map[u.y][u.x];const hawk=u.id==='elina'&&(standing==='f'||standing==='v')?12:0;
 const hit=Math.max(70,Math.min(100,(magic?100:97)+Math.round((u.spd-t.spd)*1.5)-(ground.evade||0)+hawk+(aim?18:0)+(u.hit||0)+formHit-(t.dodge||0)));
 const crit=magic?0:Math.min(12,Math.max(3,Math.round((u.spd-t.spd)/2)+5));
 return {damage:dmg,hit,crit,magic,fire:magic,terrainMul:magic?(ground.fire??1):1-(ground.phys||0),flank:quick&&flank(s,u,t),burning};
}
const isolated=(s,t)=>t.team==='ally'&&!s.units.some(a=>a.team==='ally'&&alive(a)&&a.id!==t.id&&distance(a,t)===1);
function guardFor(s,u,t,mode){if(mode==='skill'&&u.id==='lia'||distance(u,t)!==1)return null;return s.units.find(g=>alive(g)&&g.team===t.team&&g.id!==t.id&&(g.guarding&&!g.guardUsed||g.guardTarget===t.id)&&distance(g,t)===1);}
function forecast(s,u,t,mode='attack'){
 if(mode==='skill'&&u.id==='sain')return {heal:Math.min(t.maxHP-t.hp,12+effectiveStats(s,u).mag),hit:100,damage:0,counter:0,after:Math.min(t.maxHP,t.hp+12+effectiveStats(s,u).mag)};
 if(mode==='skill'&&u.id==='eric')return {guard:true,damage:0,hit:100,counter:0,after:t.hp};
 if(mode==='capture')return {capture:true,damage:0,hit:100,counter:0,after:t.hp};
 if(mode==='rescue')return {rescue:true,damage:0,hit:100,counter:0,after:t.hp};
 if(mode==='search')return {search:true,damage:0,hit:100,counter:0,after:t.hp};
 const guard=guardFor(s,u,t,mode),victim=guard||t,stats=strikeStats(s,u,victim,mode),canCounter=validTarget(s,victim,u,'attack')&&victim.hp>stats.damage;
 const counter=canCounter?strikeStats(s,victim,u).damage:0;
 return {...stats,counter,counterHit:canCounter?strikeStats(s,victim,u).hit:0,after:Math.max(0,victim.hp-stats.damage),guard:guard?.id,victim:victim.id};
}
function awardXP(s,u,amount,reason){
 if(u.team!=='ally'||!amount)return;
 u.xp+=amount;u.earnedXP+=amount;u.highlights.push(reason);s.feedback.push({type:'xp',id:u.id,text:`+${amount} EXP`});
 let leveled=false;while(u.xp>=BALANCE.xpLevel){leveled=true;u.xp-=BALANCE.xpLevel;u.level++;const g=HEROES.find(h=>h.id===u.id).growth;const changes={...g};for(const [stat,n] of Object.entries(g)){if(stat==='hp'){u.maxHP+=n;u.hp=Math.min(u.maxHP,u.hp+n);}else if(stat==='mp'){u.maxMP+=n;u.mp=Math.min(u.maxMP,u.mp+n);}else u[stat]+=n;}if(u.id==='eric'&&u.level>=5)u.appearanceTier=2;u.growthHistory.push({level:u.level,changes});s.feedback.push({type:'level',id:u.id,text:`LEVEL ${u.level}`,toHP:u.hp});s.log.push(`${u.name} → LV ${u.level}. 성장이 새로운 힘으로 이어집니다.`);}
 if(leveled){u.hp=u.maxHP;u.mp=u.maxMP;s.log.push(`${u.name}: 레벨업으로 HP/MP 전부 회복.`);}
}
function discover(s,u,clue){if(!u.clues.includes(clue)){u.clues.push(clue);s.feedback.push({type:'potential',id:u.id,text:'POTENTIAL DISCOVERED'});s.log.push(`Potential Clue Discovered — ${clue} (1/3). 각성은 아직 해금되지 않았습니다.`);}}
// One-line tactical summary of a tile, shown when the player taps terrain.
function terrainSummary(s,x,y,u=null){const type=missionOf(s).map[y]?.[x],t=TERRAIN[type];if(!t)return '전장 밖';
 if(!Number.isFinite(t.cost))return `${t.ko} · 통행 불가`;
 const costs=['infantry','rogue','cavalry'].map(p=>TERRAIN_COSTS[p]?.[type]??t.cost),cost=c=>Number.isFinite(c)?c:'불가';
 const move=costs.every(c=>c===costs[0])?`이동 ${cost(costs[0])}`:`이동 보병 ${cost(costs[0])} · 도적 ${cost(costs[1])} · 기병 ${cost(costs[2])}`;
 const parts=[t.ko,move];if(t.phys)parts.push(`일반공격 ${Math.round(t.phys*100)}%↓`);if(t.evade)parts.push(`회피 ${Math.abs(t.evade)}%${t.evade>0?'↑':'↓'}`);
 if(t.fire&&t.fire!==1)parts.push(`화공 ${Math.round(Math.abs(t.fire-1)*100)}%${t.fire>1?'↑':'↓'}`);if(t.hpRecovery)parts.push(`턴 시작 HP ${t.hpRecovery*100}% 회복`);
 if(s.burning?.[key(x,y)])parts.push('🔥 불타는 중');if(u&&u.team==='ally'){const c=terrainCost(s,u,x,y);parts.push(`${u.name}: ${Number.isFinite(c)?`비용 ${c}`:'진입 불가'}`);}
 return parts.join(' · ');}

const grade=v=>v>=24?'S':v>=19?'A':v>=14?'B':v>=10?'C':v>=6?'D':'E';
function rangeGrid(min,max){let cells='';for(let y=-3;y<=3;y++)for(let x=-3;x<=3;x++){const d=Math.abs(x)+Math.abs(y),cls=d===0?'self':d>=min&&d<=max?'hit':'';cells+=`<i class="${cls}"></i>`;}return `<div class="range-grid" aria-label="공격 범위 ${min}–${max}">${cells}</div>`;}

function unitInfoHTML(s,u,tab,esc,portrait){
 const hero=HEROES.find(h=>h.id===u.id),v=u.team==='ally'?effectiveStats(s,u):u,profile=u.movementProfile||CLASS_MOVEMENT[HERO_CLASS[u.id]]?.profile||'infantry';
 const tabs=[['ability','능력'],['equipment','장비'],['tactics','기술'],['bio','열전'],['class','병종']].map(([id,label])=>`<button data-do="unit-info" data-id="${u.id}|${id}" class="${tab===id?'active':''}">${label}</button>`).join('');
 const bar=(label,a,b,cls)=>`<div class="info-bar ${cls}"><span>${label}</span><div><i style="width:${Math.round(100*a/Math.max(1,b))}%"></i></div><b>${a}/${b}</b></div>`;
 const head=`<div class="info-head">${portrait(u)}<div><h3>${esc(u.name)} <small>${u.team==='ally'?'아군':u.team==='enemy'?'적군':'주민'}</small></h3><p>${esc(CLASS_KO[u.className]||KIND_KO[u.kind]||u.className||'')} · LV ${u.level??'—'}</p>${bar('HP',u.hp,u.maxHP,'hp')}${u.maxMP?bar('MP',u.mp,u.maxMP,'mp'):''}${u.team==='ally'?bar('EXP',u.xp,100,'xp'):''}</div></div>`;
 let body='';
 if(tab==='ability')body=`<table class="grade-table">${[['ATK','공격력','atk'],['DEF','방어력','def'],['MAG','정신력','mag'],['RES','저항력','res'],['SPD','순발력','spd']].map(([k,ko,f])=>`<tr><th>${ko}</th><td class="grade g-${grade(v[f]||0)}">${grade(v[f]||0)}</td><td>${v[f]||0}${u.team==='ally'&&v[f]!==u[f]?` <small>(기본 ${u[f]})</small>`:''}</td></tr>`).join('')}<tr><th>이동력</th><td class="grade">${v.mov}</td><td>${PROFILE_KO[profile]||'보병'}</td></tr></table>${hero?`<p class="info-note">특성 · <b>${esc(u.talent)}</b> — ${esc(hero.description)}</p><p class="info-note">잠재력 단서 · ${esc(u.clues?.join(', ')||'아직 발견하지 못했다')}</p>`:''}`;
 if(tab==='equipment')body=u.team!=='ally'?'<p class="info-note">장비 정보를 알 수 없다.</p>':`<div class="info-slots">${['weapon','armor','accessory'].map(slot=>{const g=s.economy.gear.find(a=>a.id===s.economy.equipped[u.id][slot]);return `<div class="doll-slot ${g?'filled':''}"><span class="doll-name">${{weapon:'무기',armor:'방어구',accessory:'장신구'}[slot]}</span>${g?itemIcon(g.type,40):'<span class="doll-empty">기본</span>'}<b>${g?esc(GEAR[g.type].name)+(g.level?' +1':''):'기본 장비'}</b></div>`;}).join('')}</div>`;
 if(tab==='tactics')body=hero?`<div class="tactic-card"><h4>${esc(u.skill)} <small>MP ${skillCost(u)}</small></h4><p>${esc(SKILL_NOTE[u.id]||hero.description)}</p>${rangeGrid(...rangeFor(u,'skill'))}</div>`:'<p class="info-note">기술을 쓰지 않는다.</p>';
 if(tab==='bio')body=`<p class="info-bio">${esc(BIO[u.id]||ENEMY_BIO[u.kind]||(u.team==='enemy'?'국경을 어지럽히는 무리의 일원. 자세한 내력은 알려지지 않았다.':'피난길에 오른 국경 마을 주민.'))}</p>`;
 if(tab==='class'){const types=['g','r','f','m','d','s','b','v'];body=`<div class="class-grid"><div><h4>${esc(PROFILE_KO[profile]||'보병')} · 지형 적성</h4><table class="apt-table">${types.map(t=>{const c=TERRAIN_COSTS[profile]?.[t]??TERRAIN[t].cost,T=TERRAIN[t];return `<tr><th>${T.ko}</th><td>${Number.isFinite(c)?`이동 ${c}`:'불가'}</td><td>${T.phys?`피해 ${Math.round(T.phys*100)}%↓ `:''}${T.evade?`회피 ${T.evade>0?'+':''}${T.evade}% `:''}${T.fire&&T.fire!==1?`화공 ×${T.fire}`:''}</td></tr>`;}).join('')}</table></div><div><h4>공격 범위</h4>${rangeGrid(...u.range)}<p class="info-note">${u.range[0]===u.range[1]?`사거리 ${u.range[0]}`:`사거리 ${u.range[0]}–${u.range[1]}`}${u.range[0]>1?' · 인접한 적은 공격할 수 없다':''}</p></div></div>`;}
 return `<div class="info-tabs">${tabs}</div>${head}<div class="info-body">${body}</div>`;
}

// Logical world coordinates; output backing resolution never alters hit testing.
class MapCamera{
 constructor(){this.zoom=1;this.target=null;this.offset={x:0,y:0};this.current=null;this.key=null;}

 zoomBy(factor){this.zoom=Math.max(.35,Math.min(2.4,this.zoom*factor));}

 layout(width,height,mapWidth,mapHeight,{follow=null,key='',smooth=true}={}){
  if(this.key!==key){this.key=key;this.reset();}
  const base=width<600||height<300?40:64,tilePixels=Math.max(base,Math.min(width/mapWidth,base*1.5))*this.zoom,scale=tilePixels/64;
  const point=this.target||follow||{x:mapWidth/2-.5,y:mapHeight/2-.5};
  const clamp=(v,extent,view)=>extent<=view?(view-extent)/2:Math.max(view-extent,Math.min(0,v));
  let x=clamp(width/2-(point.x+.5)*tilePixels+this.offset.x,mapWidth*tilePixels,width),y=clamp(height/2-(point.y+.5)*tilePixels+this.offset.y,mapHeight*tilePixels,height);
  if(smooth&&this.current&&Math.abs(this.current.scale-scale)<.001){x=this.current.x+(x-this.current.x)*.3;y=this.current.y+(y-this.current.y)*.3;}
  this.current={x:Math.round(x*2)/2,y:Math.round(y*2)/2,scale,width,height,mapWidth,mapHeight};return this.current;
 }
 tileAt(px,py){const {x,y,scale}=this.current||{x:0,y:0,scale:1};return {x:Math.floor((px-x)/scale/64),y:Math.floor((py-y)/scale/64)};}
}

 const colors={f:'#395e4b',g:'#73835b',r:'#b9a17a',x:'#4b5050',w:'#477b96',b:'#bb9361',v:'#98734d',m:'#89917d',s:'#556f63',d:'#c2ad7b'};
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){c.fillStyle=colors[map[y][x]]||'#987655';c.fillRect(x*sx,y*sy,sx+.5,sy+.5);}

// src/render/hd-art.js
// B4 graphics sample (v0.4, PROPOSED — not wired into the game until approved).
// Original pixel art painted at 48 logical pixels per tile: per-pixel shading ramps with
// ordered dithering, coloured outlines, organic terrain edges and hand-built figures.

const HD_TILE=48;

// ---------- colour helpers ----------
const hex=h=>{const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];};

// hue-shifted toward violet in shadow and warm yellow in light (classic pixel-art ramp).
function ramp(h){const c=hex(h);return [mixRGB(c,SHADOW,.55),mixRGB(c,SHADOW,.28),c,mixRGB(c,LIGHT,.22),mixRGB(c,LIGHT,.45)].map(v=>pack(v));}
const col=h=>pack(hex(h));
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
const dither=(x,y,v)=>v>BAYER[(y&3)*4+(x&3)];

const hash=(x,y,s=0)=>{let h=(x*374761393+y*668265263+s*1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;};
const smooth=t=>t*t*(3-2*t);

// ---------- pixel buffer ----------
class Pix{
 constructor(w,h){this.w=w;this.h=h;this.d=new Uint32Array(w*h);}

 set(x,y,c){x=Math.floor(x);y=Math.floor(y);if(c&&x>=0&&y>=0&&x<this.w&&y<this.h)this.d[y*this.w+x]=c;}
 rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,c);}

// ---------- terrain palettes ----------
const GRASS=['#43623a','#527440','#5f8445','#6d924c','#8cad5c'].map(col);
const DIRT=['#6e5638','#86694a','#9e8058','#b7996b','#cdb283'].map(col);
const SAND=['#a58a5a','#bba06a','#cdb27a','#dcc48e','#ebd8a6'].map(col);

const STONE=ramp('#8a8778'),MOSS=ramp('#5d7a43'),WOOD=ramp('#8a6040'),PLASTER=ramp('#dccaa0'),ROOF=ramp('#a3593b'),THATCH=ramp('#b98d4f');
const LEAF=['#1d3528','#284a33','#36623d','#4e8248','#71a455'].map(col);
const FLAG=ramp('#a29a86'),PLANK=ramp('#8a6442'),WALLR=ramp('#6e6a60');

const tileAt=(map,x,y)=>map[y]?.[x];
const isLike=(t,set)=>t!==undefined&&set.includes(t);
// ground layer for one tile into a Pix covering the whole map (global coords keep noise seamless)
function groundPixel(kind,gx,gy){
 if(kind==='grass'){const n=noise(gx,gy,22,1)*.75+noise(gx,gy,6,2)*.25;let t=2;if(n<.3)t=dither(gx,gy,(.3-n)*6)?1:2;else if(n>.66)t=dither(gx,gy,(n-.66)*6)?3:2;return GRASS[t];}

 if(kind==='sand'){const w=Math.sin((gx*.35+gy*.9+noise(gx,gy,18,5)*9))*.5+.5;return SAND[w<.18?1:w>.85?3:2];}
 if(kind==='water'){const n=noise(gx,gy,26,6)*.7+noise(gx*.6,gy*2,8,8)*.3;let t=2;if(n<.34)t=dither(gx,gy,(.34-n)*6)?1:2;return WATER[t];}

}
const KIND={g:'grass',f:'grass',v:'grass',t:'grass',h:'grass',r:'dirt',x:'grass',m:'grass',d:'sand',w:'water',b:'water',s:'swamp',k:'flag',q:'flag',p:'plank'};
// paints the full terrain ground; decor (trees, houses, rocks) is returned as sortable objects
function paintGround(map,{theme=''}={}){
 const H=map.length,W=map[0].length,T=HD_TILE,p=new Pix(W*T,H*T),objects=[],fort=theme==='fortress';
 for(let ty=0;ty<H;ty++)for(let tx=0;tx<W;tx++){
  const t=map[ty][tx],kind=fort&&t==='x'?'wall':KIND[t]||'grass';
  for(let y=0;y<T;y++)for(let x=0;x<T;x++){const gx=tx*T+x,gy=ty*T+y;let k=kind;
   // organic edges: dirt/sand/water tiles fray into neighbouring grass
   if(['dirt','sand','water','swamp'].includes(kind)){const same=(dx,dy)=>(KIND[tileAt(map,tx+dx,ty+dy)]??kind)===kind||(kind==='water'&&tileAt(map,tx+dx,ty+dy)==='b')||(kind==='dirt'&&['r','h'].includes(tileAt(map,tx+dx,ty+dy)));const j=2+noise(gx,gy,6,9)*5;let dmin=99;if(!same(-1,0))dmin=Math.min(dmin,x);if(!same(1,0))dmin=Math.min(dmin,T-1-x);if(!same(0,-1))dmin=Math.min(dmin,y);if(!same(0,1))dmin=Math.min(dmin,T-1-y);for(const [dx,dy,cx,cy]of[[-1,-1,0,0],[1,-1,T-1,0],[-1,1,0,T-1],[1,1,T-1,T-1]])if(same(dx,0)&&same(0,dy)&&!same(dx,dy))dmin=Math.min(dmin,Math.hypot(x-cx,y-cy));if(dmin<j)k='grass';else if(dmin<j+1.2)k=kind==='water'?'foam':'rim';}
   let c=k==='rim'?(kind==='dirt'?DIRT[0]:kind==='sand'?SAND[0]:col('#33483a')):k==='foam'?WATER[4]:groundPixel(k,gx,gy);
   p.set(gx,gy,c);}
  const ox=tx*T,oy=ty*T,R=(i)=>hash(tx,ty,i);
  // surface detail
  if(kind==='grass'){for(let i=0;i<14;i++){const x=ox+Math.floor(R(i)*44)+2,y=oy+Math.floor(R(i+40)*42)+4;if(p.get(x,y)!==GRASS[1]&&p.get(x,y)!==GRASS[2]&&p.get(x,y)!==GRASS[3])continue;p.set(x,y,GRASS[4]);p.set(x-1,y+1,GRASS[3]);p.set(x+1,y+1,GRASS[3]);p.set(x,y+1,GRASS[0]);}
   if(R(80)<.35){const x=ox+6+Math.floor(R(81)*34),y=oy+8+Math.floor(R(82)*32);for(let i=0;i<7;i++){const gx=x+Math.floor(R(83+i)*9),gy=y+Math.floor(R(84+i*2)*5);p.set(gx,gy,GRASS[0]);p.set(gx,gy-1,GRASS[1]);p.set(gx,gy-2,GRASS[3]);}}
   if(t==='g'&&R(86)<.18){const x=ox+8+Math.floor(R(87)*30),y=oy+10+Math.floor(R(88)*28),sr=ramp('#9a9682');p.rect(x,y,3,2,sr[2]);p.set(x,y,sr[3]);p.rect(x,y+2,3,1,sr[0]);}
   if(t==='g'&&R(90)<.45){const x=ox+6+Math.floor(R(91)*36),y=oy+6+Math.floor(R(92)*34),fc=R(93)<.5?col('#f2e6c4'):col('#f0c95a');for(let i=0;i<3;i++){const fx=x+Math.floor(R(94+i)*8),fy=y+Math.floor(R(97+i)*6);p.set(fx,fy,fc);p.set(fx,fy+1,GRASS[0]);}}}
  if(kind==='dirt'){for(let i=0;i<6;i++){const x=ox+4+Math.floor(R(i)*40),y=oy+4+Math.floor(R(i+20)*40);if(![DIRT[1],DIRT[2],DIRT[3]].includes(p.get(x,y)))continue;p.set(x,y,DIRT[4]);p.set(x+1,y,DIRT[3]);p.set(x,y+1,DIRT[0]);p.set(x+1,y+1,DIRT[1]);}}
  if(kind==='water'){for(let i=0;i<5;i++){const x=ox+3+Math.floor(R(i)*38),y=oy+4+Math.floor(R(i+9)*40);for(let k=0;k<5+Math.floor(R(i+30)*4);k++)if(p.get(x+k,y)!==WATER[4])p.set(x+k,y,k%4===0?WATER[3]:WATER[4]);}}
  if(kind==='swamp'){for(let i=0;i<6;i++){const x=ox+4+Math.floor(R(i)*40),y=oy+10+Math.floor(R(i+9)*32);for(let k=0;k<5+i%3;k++)p.set(x+(k>3?1:0),y-k,k>3?col('#9a8a54'):col('#6f8f55'));}}

  if(t==='f'){const spots=[[12,30],[34,28],[23,45],[8,46],[40,46]],n=3+(R(50)<.5?1:0);for(let i=0;i<n;i++){const [sx,sy]=spots[(i+Math.floor(R(49)*5))%5];objects.push({kind:'tree',x:ox+sx+Math.floor(R(51+i)*5)-2,y:oy+sy,size:.66+R(60+i)*.16,seed:tx*31+ty*17+i});}}

  if(t==='t')objects.push({kind:'outpost',x:ox,y:oy+T,seed:tx});

}
function paintWall(p,ox,oy,tx,ty,face){

function wagonSprite(){return cached('wagon',()=>{const p=new Pix(48,52),W=ramp('#7a5634'),C=ramp('#e2d6b4');
 p.box(5,30,38,10,W);for(let x=7;x<42;x+=6)p.rect(x,31,1,8,W[1]);
 for(let y=10;y<31;y++){const half=17-Math.round(Math.pow((y-10)/20,0.5)*0)-((y<14)?(14-y):0);for(let x=24-half;x<24+half;x++){let t=x<14?3:x>36?1:2;if((x-6)%8===0)t=1;p.set(x,y,C[t]);}}
 p.rect(8,14,32,1,C[4]);for(const [x,y]of[[12,40],[36,40]]){p.ball(x,y,6,6,ramp('#5a3e28'));p.ball(x,y,2,2,ramp('#c9a24a'));for(const [a,b]of[[0,-4],[0,4],[-4,0],[4,0]])p.set(x+a,y+b,W[3]);}
 p.box(40,32,8,2,W);p.rect(14,22,6,6,col('#3a6fc8'));p.rect(26,20,8,5,col('#c8413a'));
 return p.outline();});}

function drawShadow(c,x,y,w=14,h=4){c.fillStyle='rgba(20,24,30,.32)';c.beginPath();c.ellipse(x,y,w,h,0,0,Math.PI*2);c.fill();}
function drawFlame(c,x,y,t,s=1){for(let i=0;i<5;i++){const ph=t/120+i*1.7,h=(10+6*Math.sin(ph))*s,w=4*s;c.fillStyle=i%2?'#ffcf6a':'#f07a32';c.fillRect(Math.round(x-8*s+i*4*s),Math.round(y-h),Math.round(w),Math.round(h));}c.fillStyle='#fff2b0';c.fillRect(Math.round(x-2*s),Math.round(y-8*s),Math.round(4*s),Math.round(5*s));}

// src/render/hd-figure.js
// Character sprites v2 (benchmark pass, 2026-10-17). Original art following classic tactical-SRPG
// sprite conventions only: a 48×48 cell, roughly 4½-head proportions, four facings (down, left,
// right, up) and a four-frame march cycle that also plays while standing. Nothing is traced from
// any existing sprite; every figure is assembled from parametric parts below.
const FIG_W=48,FIG_H=48,FIG_FOOT=46;
const figCache=new Map();
const darker=r=>[r[0],r[0],r[1],r[2],r[3]];
const INK=col('#1c1820');
// frame 0 = stand; odd frames = step A (near foot forward), even frames = step B
const phaseOf=frame=>frame?((frame-1)%2)*2:-1; // two-pose march (A,B,A,B) like classic SRPG map sprites

function figureSprite(id,{frame=0,facing='down'}={}){const key=`${id}:${frame}:${facing}`;if(figCache.has(key))return figCache.get(key);
 const S=CAST[id]||CAST.bandit;let p;
 if(facing==='left'){const r=drawFigure2(S,frame,'right');p=new Pix(r.w,r.h);for(let y=0;y<r.h;y++)for(let x=0;x<r.w;x++)p.d[y*r.w+(r.w-1-x)]=r.d[y*r.w+x];}
 else p=drawFigure2(S,frame,facing);
 const c=p.canvas();figCache.set(key,c);return c;}

// thick limb between two points, lit from the upper left
// limb between two points: rounded joint, tapered toward the hand/foot, lit from the upper left
function limb(p,x0,y0,x1,y1,w,r,tone=2,taper=.74){const dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy)||1,ux=-dy/len,uy=dx/len,w0=w/2,w1=w*taper/2;
 p.poly([[x0+ux*w0,y0+uy*w0],[x1+ux*w1,y1+uy*w1],[x1-ux*w1,y1-uy*w1],[x0-ux*w0,y0-uy*w0]],r[tone]);if(w>=4)p.fillEllipse(x0,y0+.3,w0,w0*.9,r[tone]);
 const steps=Math.ceil(len);for(let i=0;i<=steps;i++){const t=i/steps,x=x0+dx*t,y=y0+dy*t,h=(w0+(w1-w0)*t)*Math.abs(ux)+(1-Math.abs(ux))*.2;p.set(x-h+.5,y,r[tone+1]);p.set(x+h-1,y,r[Math.max(0,tone-1)]);}}
function boot(p,x,y,r,dir=0){ // dir: 0 front, 1 right-facing profile
 if(dir){p.box(x-3,y-5,9,5,r);p.rect(x-3,y-1,10,1,r[0]);p.rect(x+4,y-3,2,2,r[1]);p.rect(x-3,y-5,6,1,r[3]);}
 else{p.box(x-4,y-5,8,5,r);p.rect(x-4,y-1,8,1,r[0]);p.rect(x-3,y-5,5,1,r[3]);}}

function drawFigure2(S,frame,facing){
 const p=new Pix(FIG_W,FIG_H),view=facing==='up'?'back':facing==='down'?'front':'side',back=view==='back',side=view==='side';
 const sk=ramp(SKIN[S.skin]||S.skin),hr=ramp(S.hair),coat=ramp(S.coat),trim=ramp(S.trim),legs=ramp(S.legs),boots=ramp(S.boots);
 const metal=ramp(S.metal||'#b4c0c6'),big=S.big?1:0,small=S.small?1:0,mounted=!!S.mounted,ph=phaseOf(frame);
 const bob=ph===1||ph===3?-1:0,dy=(small?8:mounted?-6:0)+bob;
 const cx=side?23:24,hy=9+dy+(S.stoop?2:0),hrx=5.5+big*.4-small*.3,hry=5.9,sh=16+dy,sw=11+big-small*2,wy=28+dy-small,ww=7+big-small,hip=32+dy-small*2,G=FIG_FOOT;
 const torso=S.body==='plate'?metal:coat;
 const longSkirt=['robe','shawl'].includes(S.body),coatTail=S.body==='coat';
 // arm swing per phase: [nearHandDX, farHandDX] in profile; [leftDY,rightDY] facing front/back
 const swing=ph===0?1:ph===2?-1:0;
 // ---------------- horse (under the rider) ----------------
 if(mounted){HORSE=ramp(S.horse||'#7a5236');horseBody(p,view,frame,S);}
 // ---------------- items behind ----------------
 const bannerOrStaff=['spear','banner','staff','holy'].includes(S.weapon);
 if(S.cape&&!back){const cr=ramp(S.cape);if(side)p.poly([[cx-3,sh],[cx+2,sh],[cx-2,hip+8],[cx-10-(ph===0||ph===2?2:0),hip+7]],cr[1]);else p.poly([[cx-sw+1,sh+1],[cx+sw-1,sh+1],[cx+sw+2,hip+9],[cx-sw-2,hip+9]],cr[0]);}
 if(S.back==='quiver'&&!back){const q=ramp('#7a5434'),qx=side?cx-7:cx+5;p.box(qx,sh-6,4,13,q);for(let i=0;i<3;i++){p.set(qx+i,sh-8,col('#ece4cc'));p.set(qx+i,sh-7,col('#c9443a'));}}
 if(back)weaponFig(p,S,'back',{cx,sh,sw,wy,hip,sk,swing});
 if(side)weaponFig(p,S,'far',{cx,sh,sw,wy,hip,sk,swing});
 // ---------------- legs ----------------
 let nearFoot={x:cx+1,y:G};
 if(!mounted){
  if(side){
   const stride=ph===0||ph===2?8:0,lift=ph===1||ph===3?3:0;
   // far leg (darker) then near leg; contact A: near leg forward
   const nearFwd=ph===0?1:ph===2?-1:0;
   const footN={x:cx+1+nearFwd*stride,y:G},footF={x:cx+1-nearFwd*stride,y:G-(nearFwd===0?lift:0)};
   if(!longSkirt){limb(p,cx,hip,footF.x,footF.y-3,6,darker(legs));boot(p,footF.x,footF.y,darker(boots),1);}
   nearFoot=footN;
  } else {
   const lA=ph===1?3:ph===0?0:0,lB=ph===3?3:0; // lifted foot on passing frames
   const lx=cx-5-big,rx=cx+5+big;
   if(!longSkirt){limb(p,lx+2,hip,lx,G-3-lA,6,legs);limb(p,rx-2,hip,rx,G-3-lB,6,legs);boot(p,lx,G-lA,boots);boot(p,rx+1,G-lB,boots);}
   else{p.box(lx-2,G-3-lA,6,3,boots);p.box(rx-2,G-3-lB,6,3,boots);}
  }
 }
 // far arm in profile (behind torso)
 if(side){const sx=cx+3,hx2=cx+3-swing*4;limb(p,sx,sh+2,hx2+1,wy-1,4,darker(S.body==='plate'?metal:coat));p.ball(hx2+1,wy+1,2,2,darker(sk));}
 // ---------------- torso ----------------
 torsoFill(p,S,{cx,sh,wy,sw,ww,side,torso});
 // hips / lower garment
 const hemY=mounted?hip+2:longSkirt?G-2:coatTail?hip+9:S.body==='apron'?hip+7:hip+4;
 const lower=S.body==='plate'?metal:longSkirt||coatTail?coat:S.body==='apron'?ramp(S.apron):coat;
 lowerFill(p,S,{cx,wy,ww,hemY,side,lower,trim,longSkirt,back});
 // near leg in profile (in front of hips)
 if(side&&!mounted&&!longSkirt){const f=nearFoot;limb(p,cx+2,hip,f.x,f.y-3,6,legs);boot(p,f.x,f.y,boots,1);}
 if(side&&longSkirt&&!mounted){const f=nearFoot;p.box(f.x-3,G-3,8,3,boots);}
 // body details (front/back/profile)
 bodyDetails(p,S,view,{cx,sh,sw,wy,ww,hip,torso,coat,trim,sk,hemY});
 // ---------------- arms ----------------
 const sleeve=S.body==='plate'?darker(metal):S.body==='apron'||S.body==='vest'?ramp(S.coat):coat;
 if(side&&S.weapon==='bow'){limb(p,cx,sh+2,cx+8,wy-6,5,sleeve);p.ball(cx+8,wy-5,2.2,2.2,sk);}
 else if(side){const sx=cx-1,hx2=cx-1+swing*4;limb(p,sx,sh+2,hx2,wy-1,5,sleeve);if(S.body==='apron')limb(p,(sx+hx2)/2,(sh+wy)/2,hx2,wy-1,4,sk);p.ball(hx2,wy+1,2.2,2.2,sk);if(S.bandage)p.rect(hx2-2,wy-4,4,2,col('#f2ece0'));}
 else{const ly=back?0:-swing,ry=back?0:swing;
  for(const [sx,hx2,dyH] of [[cx-sw+1,cx-sw-1,ly],[cx+sw-1,cx+sw+1,ry]]){limb(p,sx,sh+3,hx2,wy-1+dyH,5,sleeve);if(S.body==='apron')limb(p,(sx+hx2)/2,(sh+wy)/2+1,hx2,wy-1+dyH,4,sk);p.ball(hx2,wy+1+dyH,2.2,2.2,sk);}
  if(S.bandage&&!back)p.rect(cx+sw-1,wy-5,4,2,col('#f2ece0'));}
 // shoulder pieces / collars
 if(S.body==='plate'){if(side)p.ball(cx,sh+2,3.6,3,metal);else{p.ball(cx-sw+1,sh+2,3.6,3,metal);p.ball(cx+sw-1,sh+2,3.6,3,metal);}}
 if(S.collar){const cr=ramp(S.collar);p.ball(cx+(side?1:0),sh+1,sw+2,3.6,cr,{bias:.05});for(let x=cx-sw-1;x<=cx+sw+2;x+=2)p.set(x,sh+4+((x>>1)%2),cr[1]);}
 if(S.body==='fur'){const fr=ramp(S.fur);p.ball(cx,sh+1,sw+2,3.6,fr);for(let x=cx-sw;x<=cx+sw;x+=2)p.set(x,sh+4,fr[1]);}
 if(S.scarf){const sc=ramp(S.scarf);p.ball(cx+(side?1:0),sh,sw-2,2.6,sc);if(side)p.poly([[cx-4,sh],[cx-1,sh],[cx-7-swing,sh+8],[cx-9-swing,sh+6]],sc[2]);else if(!back)p.poly([[cx+2,sh+1],[cx+5,sh+1],[cx+6,sh+9],[cx+3,sh+9]],sc[2]);else p.poly([[cx-1,sh+1],[cx+2,sh+1],[cx+3,sh+9],[cx,sh+9]],sc[2]);}
 // ---------------- head ----------------
 head(p,S,view,{cx,hy,hrx,hry,sk,hr});
 // ---------------- items in front ----------------
 if(back){if(S.cape){const cr=ramp(S.cape);p.poly([[cx-sw+1,sh+1],[cx+sw-1,sh+1],[cx+sw+2,hip+9],[cx-sw-2,hip+9]],cr[2]);for(let y=sh+1;y<hip+9;y++){p.set(cx-sw+1-(y-sh)/6,y,cr[3]);}p.rect(cx-sw+1,sh+1,2*sw-1,1,trim[2]);}
  if(S.back==='quiver'){const q=ramp('#7a5434');limb(p,cx-5,sh-5,cx+3,wy-2,4,q);for(let i=0;i<3;i++)p.set(cx-6+i,sh-7,col('#ece4cc'));}
  if(S.collar){const cr=ramp(S.collar);p.ball(cx,sh+1,sw+2,3.6,cr);}
  if(S.weapon==='bundle')p.ball(cx,sh+6,5,5,ramp('#b8a07a'));
 }
 if(!back)weaponFig(p,S,side?'side':'front',{cx,sh,sw,wy,hip,sk,swing});
 if(mounted)horseFront(p,view,frame,boots,S);
 return p.outline(INK);
}

// v0.4 feedback #3: bodies are rounded and tapered (shoulder curve → chest → waist → hips), not boxes.
function torsoHalf(t,sw,ww){const round=t<.3?Math.sqrt(Math.max(0,1-Math.pow((.3-t)/.3,2))):1,k=t*t*(3-2*t);return sw-3.4*(1-round)+(ww-sw)*Math.pow(k,1.15);}
function torsoFill(p,S,{cx,sh,wy,sw,ww,side,torso}){const top=sh+1,plate=S.body==='plate';
 for(let y=top;y<=wy;y++){const t=(y-top)/Math.max(1,wy-top),h=torsoHalf(t,sw,ww)*(side?.84:1),chest=side&&t>.12&&t<.62?1.2*Math.sin((t-.12)/.5*Math.PI):0,l=Math.round(cx-h+(side?.5:0)),r=Math.round(cx+h+(side?.5+chest:0));
  for(let x=l;x<r;x++){const u=(x+.5-cx)/Math.max(1,h);let tone=u<-.6?3:u>.5?1:2;if(y<=top+1&&tone===2)tone=3;if(t>.86&&tone===2)tone=1;if(!side&&t>.18&&t<.5&&Math.abs(u+.25)<.18)tone=3;if(side&&u>.05&&u<.45&&t>.18&&t<.48)tone=3;if(plate&&(y-sh)%4===0&&x>l+1&&x<r-2)tone=1;p.set(x,y,torso[tone]);}
  p.set(l,y,torso[4]);p.set(r-1,y,torso[0]);}}
function lowerFill(p,S,{cx,wy,ww,hemY,side,lower,trim,longSkirt,back}){const flare=2+(longSkirt?3:0),plate=S.body==='plate';
 for(let y=wy;y<=hemY;y++){const t=(y-wy)/Math.max(1,hemY-wy),hip=longSkirt?0:Math.sin(Math.min(1,t*1.6)*Math.PI/2)*1.1,h=ww+flare*Math.pow(t,.8)+hip-(y===hemY?1:0),l=Math.round(cx-h+(side?1:0)),r=Math.round(cx+h+(side?1:0))+1;
  for(let x=l;x<r;x++){const u=(x+.5-cx-(side?1:0))/Math.max(1,h);let tone=u<-.6?3:u>.45?1:2;if(plate&&(y-wy)%3===2)tone=1;if(longSkirt&&!back&&Math.abs(x-cx-1-(side?2:0))<.6&&y%4===0)tone=1;if(y===wy&&tone===2)tone=1;p.set(x,y,lower[tone]);}
  p.set(l,y,lower[3]);p.set(r-1,y,lower[1]);}
 const h=ww+flare-1;p.rect(Math.round(cx-h+(side?1:0)),hemY,Math.round(2*h)+1,1,trim[1]);}

function bodyDetails(p,S,view,{cx,sh,sw,wy,ww,hip,torso,coat,trim,sk,hemY}){
 const side=view==='side',back=view==='back',o=side?1:0;
 if(S.body==='plate'){const tb=ramp(S.tabard||S.coat);if(!back){const l=side?cx+1:cx-3,r=side?cx+5:cx+3;p.poly([[l,sh+4],[r,sh+4],[r+1,hemY+2],[l-1,hemY+2]],tb[2]);p.rect(l,sh+4,r-l,1,trim[3]);p.rect(l-1,hemY+2,r-l+2,1,trim[1]);}else p.poly([[cx-4,sh+3],[cx+4,sh+3],[cx+5,hemY+1],[cx-5,hemY+1]],tb[1]);p.rect(cx-ww+o,wy-1,2*ww,2,ramp('#4a3424')[2]);if(!back)p.set(cx+o,wy-1,trim[3]);}
 if(S.body==='leather'){p.rect(cx-ww+o,wy-1,2*ww,2,ramp('#4a3424')[2]);if(!back){p.set(cx+o,wy-1,trim[3]);p.line(cx-sw+2+o,sh+2,cx+ww-1+o,wy-2,ramp('#4a3424')[1]);}else p.line(cx+sw-2,sh+2,cx-ww+1,wy-2,ramp('#4a3424')[1]);}
 if(S.body==='robe'){if(!back)p.rect(cx-1+o*2,sh+2,2,hemY-sh-2,trim[2]);p.rect(cx-ww+o,wy-1,2*ww,2,trim[3]);}
 if(S.body==='jacket'){if(!back)p.poly([[cx-2+o*2,sh+1],[cx+2+o*2,sh+1],[cx+1+o*2,wy],[cx-1+o*2,wy]],ramp('#d9c8a4')[2]);p.rect(cx-ww+o,wy-1,2*ww,2,trim[1]);}
 if(S.body==='coat'){if(!back){p.rect(cx+o*2,sh+2,1,hemY-sh-2,coat[0]);for(let i=0;i<3;i++)p.set(cx+2+o*2,sh+4+i*3,trim[3]);}else p.rect(cx,wy+2,1,hemY-wy-2,coat[0]);p.rect(cx-ww+o,wy-1,2*ww,2,ramp('#3a2a22')[2]);p.rect(cx-sw+o,sh+1,2*sw-o,1,trim[2]);}
 if(S.body==='fur'){p.rect(cx-ww+o,wy-2,2*ww,3,trim[2]);if(!back)p.rect(cx-1+o,wy-2,3,3,col('#e8d48a'));}
 if(S.body==='apron'&&!back){const ap=ramp(S.apron);p.poly([[cx-4+o*2,sh+4],[cx+4+o*2,sh+4],[cx+5+o*2,hemY],[cx-5+o*2,hemY]],ap[2]);p.rect(cx-3+o*2,sh+8,6,3,ap[1]);}
 if(S.body==='apron'&&back){p.line(cx-sw+2,sh+2,cx+ww-1,wy-1,ramp(S.apron)[1]);p.line(cx+sw-2,sh+2,cx-ww+1,wy-1,ramp(S.apron)[1]);}

 }

  for(let y=Math.floor(hy-hry-1);y<=hy+5;y++)for(let x=Math.floor(hx-hrx-1);x<=Math.ceil(hx+hrx+1);x++){const dx=(x+.5-hx)/(hrx+.8),dy=(y+.5-(hy-.8))/(hry+.3);if(dx*dx+dy*dy>1)continue;
   let cover;if(back)cover=y<=hy+4;else if(side)cover=y<=brow||(x<hx&&y<=hy+3)||(x<hx+2&&y<=hy-1);else cover=y<=brow||(Math.abs(x+.5-hx)>hrx-1.2&&y<=hy+2);
   if(!cover)continue;let t=x<hx-1?3:x>hx+2?1:2;if(y<hy-hry+1&&x<hx)t=4;if(back&&y>hy+2)t=1;p.set(x,y,hr[t]);}
  if(!back&&!side)for(let x=Math.round(hx-hrx+1);x<=Math.round(hx+hrx-1);x+=2)p.set(x,brow+1,hr[2]);
  const locks=S.style==='long'?10:S.style==='braid'?5:0;

  if(S.style==='swept'&&!back)p.poly(side?[[hx-hrx,brow],[hx+hrx,brow-2],[hx+hrx-1,brow+1]]:[[hx-hrx,brow],[hx+hrx+1,brow-3],[hx+hrx+1,brow+1]],hr[2]);
 } else {p.set(hx-2,hy-4,sk[4]);p.set(hx-1,hy-4,sk[4]);if(S.hair){if(back){for(let x=Math.round(hx-hrx+1);x<Math.round(hx+hrx);x++)for(let y=hy+1;y<hy+4;y++)if(p.get(x,y))p.set(x,y,hr[x<hx?3:2]);}else if(side)p.box(Math.round(hx-hrx),hy,3,3,hr);else{p.box(Math.round(hx-hrx-.5),hy,2,3,hr);p.box(Math.round(hx+hrx-1),hy,2,3,hr);}}}

 if(S.helm==='knight'){const m=ramp(S.helmMetal||'#c4d0d4');p.ball(hx,hy-2,hrx+1,hry+.5,m,{maxY:back?hy+3:capY});if(!back)p.rect(Math.round(hx-hrx-1),capY,W2+3,1,m[1]);p.box(hx-1,hy-hry-4,2,4,ramp(S.trim));if(!side&&!back){p.box(Math.round(hx-hrx-1),capY,2,5,m);p.box(Math.round(hx+hrx),capY,2,5,m);}if(side)p.box(Math.round(hx-hrx-1),capY,4,5,m);}

 if(S.bandana){const b=ramp(S.bandana);p.ball(hx,hy-2,hrx+.6,hry,b,{maxY:back?hy+1:capY});const kx=side?hx-hrx:back?hx:hx+hrx-1,kd=side?-1:1;p.poly([[kx,capY],[kx+kd*4,capY+2],[kx+kd*3,capY+4],[kx,capY+1]],b[2]);}
 const wrap=(r,topR,bottom,widen,tones)=>{for(let y=Math.floor(hy-topR);y<=hy+bottom;y++)for(let x=Math.floor(hx-hrx-widen);x<=Math.ceil(hx+hrx+widen);x++){const dx=(x+.5-hx)/(hrx+widen),dy=(y+.5-(hy-1))/((topR+bottom)/2+.5);const face=back?false:side?(x+.5>hx-.5&&y>brow-1&&y<hy+5):(Math.abs(x+.5-hx)<hrx-.8&&y>brow-1&&y<hy+5);if(dx*dx+dy*dy<=1&&!face)p.set(x,y,r[tones(x,y)]);}};

// hand-held items. view: 'front' | 'side' (near hand, held forward) | 'far' (profile, far hand) | 'back'
function weaponFig(p,S,view,{cx,sh,sw,wy,hip,sk,swing}){
 const w=S.weapon,front=view==='front',side=view==='side',far=view==='far',back=view==='back';
 const longArms=['sword','staff','holy','axe','greataxe','torch','cane','hammer','spear','banner'];
 if(far&&!longArms.includes(w)&&S.off!=='shield')return;
 const forward=w==='spear'||(w==='banner'&&false);
 if(side&&longArms.includes(w)&&w!=='spear'&&w!=='banner'&&S.off!=='shield'){} // drawn by far hand
 // main hand position
 let hx,hy2;if(front){hx=cx+sw+1;hy2=wy+1+swing;}else if(back){hx=cx-sw-1;hy2=wy+1;}else if(far){hx=cx+4-swing*4;hy2=wy+1;}else if(w==='bow'){hx=cx+8;hy2=wy+1;}else{hx=cx-1+swing*4;hy2=wy+1;}
 const R=c=>ramp(c);
 const pole=(x0,y0,x1,y1,c='#6a4a30')=>{p.line(x0,y0,x1,y1,R(c)[2]);p.line(x0+1,y0,x1+1,y1,R(c)[1]);};
 const drawMain=()=>{
  if(w==='spear'){if(front||back){pole(hx-10,hy2+9,hx+7,hy2-20);p.poly([[hx+6,hy2-21],[hx+10,hy2-25],[hx+8,hy2-20]],R('#d0d8dc')[3]);}else{pole(hx-6,hy2+8,hx+8,hy2-22);p.poly([[hx+7,hy2-23],[hx+11,hy2-28],[hx+9,hy2-21]],R('#d0d8dc')[3]);}}
  if(w==='banner'){pole(hx,hy2+8,hx,hy2-30,'#5a4030');const bf=R('#24262c'),bx=back?hx-11:hx+1;p.poly([[bx,hy2-29],[bx+10,hy2-29],[bx+10,hy2-17],[bx+5,hy2-20],[bx,hy2-17]],bf[2]);p.rect(bx,hy2-29,10,1,R('#c9a24a')[3]);if(!back)p.ball(bx+5,hy2-24,2.4,2.2,R('#c9a24a'));}
  if(w==='sword'){const bl=R('#d9e2e6');if(side){limb(p,hx,hy2,hx+8,hy2-10,2,bl);p.box(hx-1,hy2-1,4,2,R('#c9a24a'));}else{p.box(hx,hy2-13,2,12,bl);p.set(hx,hy2-13,col('#ffffff'));p.box(hx-2,hy2-2,6,2,R('#c9a24a'));}}
  if(w==='axe'){pole(hx,hy2+3,hx,hy2-13);const bl=R('#c5ccc8');p.poly([[hx+1,hy2-13],[hx+6,hy2-15],[hx+6,hy2-7],[hx+1,hy2-8]],bl[2]);}
  if(w==='greataxe'){pole(hx,hy2+6,hx,hy2-20,'#5a3a24');const bl=R('#b8c0bc');p.poly([[hx+2,hy2-20],[hx+9,hy2-23],[hx+10,hy2-12],[hx+2,hy2-14]],bl[2]);p.poly([[hx-1,hy2-20],[hx-7,hy2-22],[hx-7,hy2-13],[hx-1,hy2-14]],bl[3]);}
  if(w==='staff'){pole(hx,hy2+10,hx,hy2-18,'#7a5232');p.ball(hx+.5,hy2-20,2.8,2.8,R(S.orb));p.set(hx,hy2-21,col('#ffffff'));}
  if(w==='holy'){pole(hx,hy2+10,hx,hy2-16,'#c8b47c');p.ball(hx+.5,hy2-18,2.6,2.6,R('#e8b84a'));for(const [a,b]of[[0,-4],[0,3],[-4,0],[3,0]])p.set(hx+a,hy2-18+b,col('#fff3b0'));}
  if(w==='torch'){pole(hx,hy2+2,hx,hy2-9);p.ball(hx+.5,hy2-11,2.4,3,R('#f08a3a'),{bias:.3});p.ball(hx+.5,hy2-12,1.2,1.8,R('#ffd27a'),{bias:.4});}
  if(w==='cane'){pole(hx+1,hy2-2,hx+2,hy2+14,'#7a5a3a');}
  if(w==='hammer'){pole(hx,hy2+2,hx,hy2-8);p.box(hx-3,hy2-11,7,4,R('#8a9094'));}
  if(w==='daggers'){p.box(hx,hy2-6,2,6,R('#d5dde0'));p.rect(hx-1,hy2-1,4,1,R('#c26a36')[2]);}

 };
 if(far){if(longArms.includes(w)&&w!=='spear')drawMain();return;}
 if(side){

 if(w==='ledger'&&front){p.box(ox-2,oy-6,6,7,R('#6a3a2a'));p.rect(ox-1,oy-5,4,1,col('#e8dcc0'));}
 if(w==='papers'&&front){p.box(ox-2,oy-5,5,7,R('#efe6cf'));p.rect(ox-1,oy-3,3,1,col('#8a7a5a'));}
 if(w==='satchel'){const b=R('#8a5a34'),sx=back?cx+sw-4:cx-sw-2;p.box(sx,hip-4,6,6,b);}

}

// B4 rollout: bridges the 48-pixel original art in hd-art.js to the 64-unit world coordinates
// used by every renderer, hit test and camera. Art is pre-scaled ×3 (nearest) once and drawn
// with smoothing so the 4/3 world ratio never produces uneven pixel widths.

function recoveryAmount(current,max,ratio=0){return ratio>0&&current<max?Math.min(max-current,Math.max(1,Math.floor(max*ratio))):0;}
function recoveryValue(s,u,x=u.x,y=u.y){const t=terrainAt(x,y,s);return recoveryAmount(u.hp,u.maxHP,t?.hpRecovery)+recoveryAmount(u.mp,u.maxMP,t?.mpRecovery);}
function applyTerrainRecovery(s){
 if(s.screen!=='battle')return [];
 const team=s.phase==='player'?'ally':'enemy',marker=`${s.turn}:${s.phase}`,events=[];
 for(const u of s.units.filter(u=>u.team===team&&alive(u))){if(u.recoveryPhase===marker)continue;u.recoveryPhase=marker;const t=terrainAt(u.x,u.y,s);for(const [stat,max,ratio]of [['hp',u.maxHP,t.hpRecovery],['mp',u.maxMP,t.mpRecovery]]){const n=recoveryAmount(u[stat],max,ratio);if(!n)continue;u[stat]+=n;const text=`${stat.toUpperCase()} +${n}`;events.push({type:'heal',id:u.id,text,resource:stat,...(stat==='hp'?{toHP:u.hp}:{})});s.log.push(`${u.name} · ${t.name} · ${text}`);}}
 s.feedback.push(...events);return events;
}

 for(const e of list){let pos={x:e.x,y:e.y};if(at(s,pos.x,pos.y)){const free=[];for(let y=0;y<m.height;y++)for(let x=0;x<m.width;x++)if(!at(s,x,y)&&Number.isFinite(terrainAt(x,y,s)?.cost))free.push({x,y});free.sort((a,b)=>distance(a,e)-distance(b,e)||a.y-b.y||a.x-b.x);pos=free[0];}
  s.units.push({...enemyUnit(e,s.turn),...pos});s.feedback.push({type:'spawn',id:e.id,text:'REINFORCEMENT'});}
}

function lionCells(s,u,reachable){
 const form=missionOf(s).formation,boss=findUnit(s,'boss'),live=bearersOf(s).filter(alive);
 let cells=[...reachable].map(([p,c])=>{const [x,y]=p.split(',').map(Number);return {x,y,c};});
 if(u.id==='boss'&&live.length)cells=cells.filter(p=>live.some(b=>distance(p,b)<=form.leash));
 if(form.bearers.includes(u.id)&&boss&&alive(boss))cells=cells.filter(p=>distance(p,boss)<=form.leash);
 return cells.length?cells:[{x:u.x,y:u.y,c:0}];
}

   const f=strikeStats(s,{...u,x:p.x,y:p.y},t);const score=f.damage+(t.hp<=f.damage?30:0)+(u.id==='boss'&&isolated(s,t)?20:0)+(rider&&t.kind==='wagon'?40:0)+(t.id==='sain'?8:0)-p.c*.3;

function movementCells(s,u){const out=[];const mov=u.mov,seen=new Map([[`${u.x},${u.y}`,0]]),q=[{x:u.x,y:u.y,c:0}];while(q.length){const p=q.shift();out.push(p);for(const [dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const x=p.x+dx,y=p.y+dy,t=terrainAt(x,y,s);if(!t||!Number.isFinite(t.cost))continue;const o=at(s,x,y);if(o&&o.team!==u.team)continue;const c=p.c+t.cost;if(c>mov||c>=(seen.get(`${x},${y}`)??Infinity))continue;seen.set(`${x},${y}`,c);q.push({x,y,c});}}const live=bearersOf(s).filter(alive);return u.id==='boss'&&live.length?out.filter(p=>live.some(b=>distance(p,b)<=missionOf(s).formation.leash)):out;}

function triggerWaves(s,trigger){const m=missionOf(s),st=s.missionState;m.waves.forEach((w,i)=>{if(w.trigger!==trigger||st.waves.includes(i+1))return;
 if(w.when==='reported'&&s.campaign.choices?.m04_records_choice!=='reported')return;st.waves.push(i+1);
 if(w.unlessBeacon&&!alive(findUnit(s,'beacon'))){s.log.push('봉화가 꺼져 관문 수비대 증원이 오지 않습니다.');return;}
 spawnWave(s,w.units);if(w.story)enqueueStory(s,w.story);s.log.push(`적 증원 ${w.units.length}명 출현.`);});}
// refugees walk the shortest open route north; they may pass through heroes but never stop on anyone
function refugeeRoute(s,c){const start=`${c.x},${c.y}`,prev=new Map([[start,null]]),q=[{x:c.x,y:c.y}];let goal=null;
 while(q.length){const p=q.shift();if(p.y<=SAFE_Y&&`${p.x},${p.y}`!==start){goal=p;break;}
  for(const [dx,dy]of[[0,-1],[-1,0],[1,0],[0,1]]){const x=p.x+dx,y=p.y+dy,k=`${x},${y}`;if(prev.has(k))continue;const t=terrainAt(x,y,s);if(!t||!Number.isFinite(t.cost))continue;const o=at(s,x,y);if(o&&o.team!=='ally')continue;prev.set(k,`${p.x},${p.y}`);q.push({x,y});}}
 if(!goal)return [];const path=[];let k=`${goal.x},${goal.y}`;while(k&&k!==start){const [x,y]=k.split(',').map(Number);path.unshift({x,y});k=prev.get(k);}return path;}
function escortRefugees(s){const st=s.missionState;

  if(c.hp<=c.maxHP/2){s.log.push(`${c.name}: 부상이 심해 움직이지 못합니다. 세인의 치유가 필요합니다.`);continue;}

  const path=refugeeRoute(s,c);let dest=-1;for(let i=0;i<Math.min(steps,path.length);i++)if(!at(s,path[i].x,path[i].y))dest=i;if(dest<0)continue;
  const from={x:c.x,y:c.y};c.x=path[dest].x;c.y=path[dest].y;s.feedback.push({type:'move',id:c.id,path:[from,...path.slice(0,dest+1)]});
  if(c.y<=SAFE_Y){c.rescued=true;s.feedback.push({type:'rescue',id:c.id,text:'SAFE'});s.log.push(`${c.name}이(가) 관문을 넘었습니다. (${passedOf(s)}/4)`);enqueueStory(s,'6:through');}

function plan6(s,u,cells,{civBias=-20,goal=null,reason='전진'}={}){

  if(!best||score>best.score)best={x:p.x,y:p.y,target:t.id,score,reason:t.team==='civilian'?'피난민 위협':`공격 가능 · 거리 ${d}`};}

// src/render/animation.js
const RANGE_STYLE={move:{fill:'rgba(43,161,232,.62)',border:'#a9e8ff'},attack:{fill:'rgba(228,78,64,.62)',border:'#ffbf89'},support:{fill:'rgba(70,190,117,.60)',border:'#cbf5a6'}};
function moveDuration(path,mode='step',speed=1){return mode==='instant'||path.length<2?0:(path.length-1)*(mode==='step'?320:210)/speed;}
function motionAt(path,elapsed,mode='step',speed=1){
 const duration=moveDuration(path,mode,speed),progress=duration?Math.max(0,Math.min(1,elapsed/duration)):1,step=progress*(path.length-1),index=Math.min(path.length-2,Math.floor(step));
 if(index<0)return {...path[0],index:0,done:true};const f=step-index,t=mode==='step'?Math.min(1,f/.78):f;
 return {x:path[index].x+(path[index+1].x-path[index].x)*t,y:path[index].y+(path[index+1].y-path[index].y)*t,index:progress===1?path.length-1:index,done:progress===1};
}
function attackKind(unit,mode){if(unit.id==='lia'&&mode==='skill')return 'fireball';if(unit.range?.[0]>=2)return 'arrow';if(unit.id==='kai')return 'dagger';return unit.kind==='bandit'||unit.kind==='captain'?'axe':'sword';}
function presentationPlan(events,units,{movement='step',speed=1,reduced=false}={}){
 const plans=[],hp=[],motions=[];let cursor=0,lastImpact=0;
 for(const event of events){
  if(event.type==='move'){const duration=moveDuration(event.path,movement,speed);motions.push({...event,delay:cursor,duration,movement,speed});cursor+=duration;}
  else if(event.type==='attack'){
   const unit=units.find(u=>u.id===event.id),kind=attackKind(unit,event.mode),duration=(reduced?220:kind==='fireball'?1250:kind==='arrow'?680:720)/speed,impact=cursor+duration*(kind==='fireball'?.56:kind==='arrow'?.65:.46);
   plans.push({...event,kind,delay:cursor,duration,impact});lastImpact=impact;cursor+=duration;
  }else{const delay=['hit','critical','miss','death'].includes(event.type)?lastImpact:Math.max(0,cursor-180/speed),duration=(['level','potential'].includes(event.type)?1400:900)/speed;plans.push({...event,delay,duration});
   if(Number.isFinite(event.toHP))hp.push({id:event.id,delay,hp:event.toHP});
  }
 }
 return {plans,motions,hp,duration:Math.max(cursor,...plans.map(e=>e.delay+Math.min(e.duration,450/speed)),0)};
}

function paintBust(c,key,expr){const sp=bustSpecOf(key),g=bGeom(sp),sk=bSkin(sp),rng=bRng(bSeed(key)),hair=bHairDef(sp);
 c.save();if(sp.face==='f'){c.translate(188,0);c.scale(.92,1);c.translate(-188,0);}
 if(sp.hood)bHoodBack(c,sp);bBackHair(c,sp);if(sp.quiver)bQuiver(c);bNeck(c,sk,g);bOutfit(c,sp,rng,sk);if(sp.hoodDown)bHoodDown(c,sp.hoodDown);if(sp.outfit==='leather'&&sp.hoodDown){bEll(c,188,292,10,8);c.fillStyle=sp.trim;c.fill();}
 c.restore();c.save();c.translate(186,270);c.scale(1.1,1.1);c.translate(-186,-262);
 if(sp.style==='bald'||sp.style==='mohawk')bBald(c,sp,sk);bEar(c,sk);bFace(c,sp,g,sk,hair);bFeatures(c,sp,g,sk,expr);bBeard(c,sp,g,sk);bFrontHair(c,sp,hair);
 if(sp.style==='braid')bBraid(c,sp);if(sp.hood)bHoodFront(c,sp);if(sp.hat)bHat(c,sp,rng);c.restore();}
const bustCache=new Map();
function bustCanvas(key,expr='neutral',scale=2){const id=`${key}|${expr}|${scale}`;let out=bustCache.get(id);if(out)return out;
 const raw=document.createElement('canvas');raw.width=BUST_W*scale;raw.height=BUST_H*scale;const r=raw.getContext('2d');r.scale(scale,scale);r.translate(0,16);paintBust(r,key,expr);
 // a warm rim of shadow so the bust reads over any scene, like an inked illustration edge
 out=document.createElement('canvas');out.width=raw.width;out.height=raw.height;const o=out.getContext('2d');o.shadowColor='rgba(8,6,12,.75)';o.shadowBlur=6*scale;o.drawImage(raw,0,0);o.shadowColor='transparent';o.drawImage(raw,0,0);
 bustCache.set(id,out);if(bustCache.size>40)bustCache.delete(bustCache.keys().next().value);return out;}
function drawBust(c,u,{expression='neutral',missionId=1}={}){const key=bustKey(u,missionId),src=bustCanvas(key,expression,Math.max(1,Math.round(c.canvas.width/BUST_W)));c.clearRect(0,0,c.canvas.width,c.canvas.height);c.imageSmoothingEnabled=true;c.drawImage(src,0,0,c.canvas.width,c.canvas.height);return key;}

function contextMessage(s,u,ui){
 if(ui.busy)return ui.pendingMove?'경로를 따라 이동 중 · 도착 후 확정하거나 취소하세요.':'전투 연출 진행 중 · 이동과 공격을 지켜보세요.';

 if(s.screen==='deployment')return ui.mode==='deploy'?'푸른 배치 칸을 누르세요. 다른 장수의 위치에 놓으면 서로 교체합니다.':'장수를 누르면 즉시 선택됩니다. 하단의 배치 이동으로 위치를 변경하세요.';

 if(u.acted)return '행동 완료 · 다른 장수를 누르거나 턴을 종료하세요.';
 if(ui.mode==='move')return `MOV ${effectiveStats(s,u).mov+(u.shadowBonus||0)} · 푸른 칸으로 이동. 같은 위치를 다시 누르면 제자리에서 행동합니다.`;

 return `${u.moved?'이동 완료':'이동 미사용'} · ${effectiveStats(s,u).mov+(u.shadowBonus||0)} MOV · ${u.range.join('–')}칸 공격 · 장수를 누르거나 장수 명령을 열어 행동을 선택하세요.`;

// src/ui/popover-position.js
// Classic SRPG placement: the command list sits right beside the unit (right side first, then
// left, below, above). It never covers the unit itself and avoids legal targets when a
// beside-the-unit slot exists; it is always clamped inside the field.
function placePopover({width,height,popupWidth,popupHeight,anchor,tile=48,protectedPoints=[]}){
 const margin=6,gap=Math.max(14,tile/2+6),maxX=Math.max(margin,width-popupWidth-margin),maxY=Math.max(margin,height-popupHeight-margin),clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
 const half=Math.max(10,tile/2);
 const slots=[
  {x:anchor.x+gap,y:anchor.y-popupHeight/2,side:'right'},
  {x:anchor.x-gap-popupWidth,y:anchor.y-popupHeight/2,side:'left'},
  {x:anchor.x-popupWidth/2,y:anchor.y+gap,side:'below'},
  {x:anchor.x-popupWidth/2,y:anchor.y-gap-popupHeight,side:'above'}];
 let best=null;
 slots.forEach((slot,order)=>{
  const fitsX=slot.x>=margin&&slot.x+popupWidth<=width-margin,fitsY=slot.y>=margin&&slot.y+popupHeight<=height-margin;
  const x=clamp(slot.x,margin,maxX),y=clamp(slot.y,margin,maxY);
  const covers=(p,r)=>p.x+r>x&&p.x-r<x+popupWidth&&p.y+r>y&&p.y-r<y+popupHeight;
  let score=order*10;
  if((slot.side==='right'||slot.side==='left')&&!fitsX)score+=5000;
  if((slot.side==='below'||slot.side==='above')&&!fitsY)score+=5000;
  if(covers(anchor,half))score+=1000000;
  for(const p of protectedPoints)if(covers(p,p.radius??12))score+=100*(p.weight??1);
  if(!best||score<best.score)best={x,y,score,side:slot.side};
 });
 return {x:Math.round(best.x),y:Math.round(best.y),side:best.side};
}

const help=()=>modal('전투 안내',`<p><b>목표:</b> 주민 2명 구출 + 산적 대장 Garr 격파. 주민 한 명이라도 사망하거나 아군이 전멸하면 패배합니다.</p><p><b>조작:</b> 장수 탭 → 작은 행동 메뉴 → 이동 → 목적지 → 이동 확정. 이후 공격/스킬 → 대상 → 예측 → 행동 확정. 유닛당 이동 1회와 행동 1회. 공격·스킬·구출·약·대기는 행동을 마칩니다. 행동 전 이동은 Z로 취소할 수 있습니다.</p><p><b>지형:</b> Grass / Road 이동 비용 1. Forest 비용 2, DEF +1 / 회피 +12%; Kai는 숲 비용 1. Village DEF +2. Ruin은 통과 불가. 사거리는 직교 거리입니다. 건물이나 숲이 사격을 차단하지 않습니다.</p><p><b>스킬:</b> Guard는 인접 동료를 보호하며, Eric이 그 동료 옆에 있을 때 첫 인접 근접 피해를 대신 받습니다. Fire Bolt는 RES를 적용합니다. Heal은 자기 회복 가능. Quick Strike의 협공은 적 반대편 인접 아군이 있어야 성립합니다.</p><p><b>이벤트:</b> TURN 3 증원, TURN 5 주민 공격 시작. 주민 옆에서 구출 행동. 마법에도 기본 공격 사거리 내에서는 반격 가능. 반격에 대한 재반격은 없습니다.</p><p><b>키:</b> 1 이동 · 2 공격 · 3 스킬 · 4 구출 · Z 취소 · W 대기 · Tab 다음 장수 · E Phase 종료 · Escape 취소. 휠 Zoom, 우클릭/Shift 드래그 Pan. Touch는 탭과 드래그 Pan 지원. 선택한 장수의 얼굴과 HP/MP는 하단에 표시됩니다. 작은 메뉴에서 스킬·도구·특성을 열 수 있습니다. 하단에서 칸별 걷기 / 연속 걷기 / 즉시 이동, 속도와 약한 효과를 선택하세요. 두 손가락으로 확대할 수 있습니다. 이동을 선택한 뒤 같은 Tile을 누르면 제자리에서 행동합니다.</p><p>로컬 저장은 현재 브라우저와 파일 경로에 연결됩니다. 파일을 옮기거나 다른 브라우저를 사용하기 전 텍스트 백업을 권장합니다. 초기화는 메뉴에서 직접 확인합니다.</p>`,'');

 return true;
}

function offerAffiliation(){const candidate=state.frontier?.pendingRecruit;if(state.screen!=='exploration'||state.narrative.active||!candidate||$('#modal-root').children.length)return;if(state.frontier.affiliation[candidate]!=='encountered')return;modal('동료의 약속',`<p>${esc(SPEAKERS[candidate]?.ko)}의 협력을 받아들이겠습니까? 기존 다섯 명의 출전은 유지됩니다. 이 선택은 동료의 소속 기록을 남깁니다.</p>`,`<button class="primary" data-do="affiliate" data-id="${candidate}">함께한다</button><button data-do="close-modal">나중에 이야기</button>`);}

function persistUIPrefs(){try{storage.setItem('ashen-crown:ui:v1',JSON.stringify({speed:ui.speed,movement:ui.movement,reduced:ui.reduced,questClosed:ui.questClosed}));}catch{}}
function renderObjectives(){const f=state.frontier,explore=state.screen==='exploration',panel=$('#quest-panel');panel.hidden=!['exploration','battle','deployment'].includes(state.screen);const rescued=state.units.filter(u=>u.team==='civilian'&&u.rescued).length;$('#quest-content').innerHTML=explore?questExplore():`<b>${esc(missionOf(state).title)}</b><p>${esc(missionOf(state).objective)}</p><p class="quest-status">${rulesOf(state)?esc(rulesOf(state).status(state)):state.missionId===2?'생포 '+(findUnit(state,'boss').rescued?'✓':'◇'):`구조 ${rescued}/${missionOf(state).civilians.length}`}</p>`;}
function showPurchase(type,hero){const gear=GEAR[type];if(!gear)return;shopKind='weapon';const u=findUnit(state,hero);modal('장비 선택 → 장수 선택',`<div class="purchase-layout"><article><h3>${gear.icon} ${gear.name}</h3><p>${gear.description}</p><p>${gear.price} Gold · ${gear.slot}</p><p>사용 병종: ${gear.heroes.map(id=>findUnit(state,id).className).join(', ')}</p></article><div class="purchase-roster">${HEROES.map(h=>`<button data-do="purchase-hero" data-id="${type}|${h.id}" ${gear.heroes.includes(h.id)?'':'disabled'} class="${h.id===hero?'active':''}">${portrait(findUnit(state,h.id),'card-sprite')}<span>${h.name}<small>${h.className} · ${gear.heroes.includes(h.id)?'장착 가능':'병종 사용 불가'}</small></span></button>`).join('')}</div><article>${u?portrait(u)+`<h3>${u.name}</h3><p>${esc(equipmentLabel(state.economy,hero))}</p>`+compareGear(type,hero):''}</article></div>`,`<button class="primary" data-do="transaction" data-id="buy-gear|${type}|${hero}" ${!gear.heroes.includes(hero)||state.economy.gold<gear.price?'disabled':''}>${gear.price} Gold · ${u?.name||'장수 선택'} 구매 및 장착 확인 →</button><button data-do="shop-back">취소 / 상품 목록</button>`);paintPortraits();}
function frontierFrame(time){heldMovement.tick(time,state.screen==='exploration'&&!state.narrative.active&&!$('#modal-root').children.length&&!frontierWalking);const canvas=$('#frontier-map');if(canvas&&state.screen==='exploration')drawHub(canvas,{...state,doorStep:doorStep&&!state.frontier.interior,walking:!ui.reduced&&(frontierWalking||time<walkUntil)},{time:ui.reduced?0:time});const stage=$('#scene-stage');if(stage)drawHub(stage,state,{line:storyLine(state),time:ui.reduced?0:time});requestAnimationFrame(frontierFrame);}requestAnimationFrame(frontierFrame);
let hubDrag=null,hubPanUsed=false;
document.addEventListener('pointerdown',e=>{if(e.target.id==='frontier-map'&&(e.shiftKey||e.button===2)){hubDrag={x:e.clientX,y:e.clientY};e.preventDefault();}});
document.addEventListener('pointermove',e=>{if(hubDrag){hubPanUsed=true;hubCamera.panBy(e.clientX-hubDrag.x,e.clientY-hubDrag.y);hubDrag={x:e.clientX,y:e.clientY};}});
document.addEventListener('pointerup',()=>hubDrag=null);
document.addEventListener('contextmenu',e=>{if(e.target.id==='frontier-map')e.preventDefault();});
document.addEventListener('wheel',e=>{if(e.target.id==='frontier-map'){e.preventDefault();hubCamera.zoomBy(e.deltaY<0?1.08:1/1.08);}},{passive:false});

document.addEventListener('keyup',e=>heldMovement.release('key:'+e.code,performance.now()));
window.addEventListener('blur',()=>heldMovement.clear());
document.addEventListener('visibilitychange',()=>{if(document.hidden)heldMovement.clear();});
let walkPointer=null;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-do="walk"]');if(!b||walkPointer!==null)return;e.preventDefault();walkPointer=e.pointerId;try{document.body.setPointerCapture(e.pointerId);}catch{}const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.id];if(d)heldMovement.press('pointer',d,performance.now());},{passive:false});
for(const event of ['pointerup','pointercancel','lostpointercapture'])window.addEventListener(event,e=>{if(e.pointerId===walkPointer&&(event!=='lostpointercapture'||e.target===document.body)){walkPointer=null;heldMovement.release('pointer',performance.now());}});

})();</script></body></html>
