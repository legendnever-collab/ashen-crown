:root{color-scheme:dark;--ink:#ede7d6;--dim:#a6b5b2;--gold:#d9bc7d;--line:#3b5355;--panel:#1b3035;--blue:#88c5d2;--red:#c77f76;--green:#abc48a;font-family:Georgia,'Ashen UI',serif;background:#102529;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer;background:#263c40;color:var(--ink);border:1px solid #496165;padding:10px 14px;border-radius:3px;transition:background .15s,border-color .15s}button:hover:not(:disabled){background:#354c4c;border-color:var(--gold)}button:focus-visible{outline:2px solid #f5d28e;outline-offset:3px}button:disabled{opacity:.35;cursor:default}button.primary{background:#d7ba7b;color:#192e32;border-color:#eed6a1;font-weight:bold}button.primary:hover:not(:disabled){background:#eace95}button.danger{border-color:#9a635f;color:#efb0a4}button.small{padding:6px 9px;font-size:12px}button.active{border-color:var(--gold);color:#f5dd9b;background:#364a44}h1,h2,h3,p{margin:0}h1{font-size:clamp(46px,6vw,84px);font-weight:normal;letter-spacing:.04em}h2{font-weight:normal;font-size:30px}h3{font-size:18px;font-weight:normal}p{line-height:1.75;color:#c3cfca}.eyebrow{font:11px/1.5 Arial,'Ashen UI',sans-serif;text-transform:uppercase;letter-spacing:.22em;color:var(--gold)}.muted{color:var(--dim);font-size:12px}.tag{display:inline-block;border:1px solid #50615a;padding:3px 7px;font:10px Arial,'Ashen UI',sans-serif;letter-spacing:.08em;color:var(--gold);border-radius:2px}.stack{display:flex;flex-direction:column;gap:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spacer{flex:1}.rule{height:1px;background:var(--line);margin:10px 0}.accent{color:var(--gold)}
#app{height:100dvh;display:flex;flex-direction:column}.topbar{height:69px;flex:none;display:flex;align-items:center;gap:18px;padding:0 26px;background:#11292d;border-bottom:1px solid #49605c}.wordmark{font-size:20px;letter-spacing:.08em}.crest{width:28px;height:29px;color:var(--gold)}.topbar .sub{font:10px Arial,'Ashen UI',sans-serif;letter-spacing:.22em;color:#9daaa2;display:block;margin-top:3px}.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}#save-status{font:11px Arial,'Ashen UI',sans-serif;color:#9cbaa4;max-width:230px}.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0;flex:1}.field{position:relative;min-height:0;min-width:0;overflow:hidden;background:#162e2f;background-image:radial-gradient(ellipse at 50% 50%,#294440,transparent 80%)}.canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none;outline:none}.map-tools{position:absolute;bottom:14px;left:16px;display:flex;gap:5px;background:#172e32df;padding:5px;border:1px solid #46605b;border-radius:3px}.map-tools .hint{font:11px Arial,'Ashen UI',sans-serif;align-self:center;margin:0 8px;color:#b3bdb3}.map-label{position:absolute;left:25px;top:18px;pointer-events:none}.map-label h3{font-size:22px;margin-top:7px}.map-label p{font-size:12px;margin-top:3px}.rail{border-left:1px solid #4b615e;overflow-y:auto;background:linear-gradient(160deg,#20373b,#182d32);padding:20px 18px;scrollbar-width:thin}.phasebar{display:flex;align-items:center;gap:18px;min-height:53px;flex:none;padding:10px 26px;background:#233b3d;border-bottom:1px solid var(--line);font-size:13px}.phase-pill{font:11px Arial,'Ashen UI',sans-serif;letter-spacing:.12em;padding:6px 9px;background:#42605d;color:#e3e8d4;border:1px solid #6b8980}.objectives{display:flex;gap:14px;color:#c8d3c8}.objective.done{color:#b6d69a}.objective::before{content:'◇ ';color:var(--gold)}.objective.done::before{content:'✓ '}.turn{font-size:20px;color:var(--gold)}.board-caption{position:absolute;bottom:69px; // src/core/narrative.js
function narrativeState(){return {queue:[],active:null,events:[],seen:[],history:[],auto:false};}
function enqueueStory(s,key){const n=s.narrative;if(!n||!STORY[key]||n.events.includes(key))return false;n.events.push(key);n.queue.push(key);return true;}
function openStory(s){const n=s.narrative;if(!n.active&&n.queue.length)n.active={key:n.queue.shift(),index:0};return n.active;}
function storyLine(s){const a=s.narrative?.active;return a?STORY[a.key]?.[a.index]:null;}
function advanceStory(s,skip=false){const n=s.narrative,a=n.active;if(!a)return false;if(skip&&!n.seen.includes(a.key))return false;const lines=STORY[a.key];if(skip){for(let i=a.index;i<lines.length;i++)n.history.push({...lines[i],scene:a.key});a.index=lines.length;}else{n.history.push({...lines[a.index],scene:a.key});a.index++;}n.history=n.history.slice(-250);if(a.index>=lines.length){if(!n.seen.includes(a.key))n.seen.push(a.key);n.active=null;openStory(s);}s.campaign.dialogueMemory={seen:[...n.seen],history:structuredClone(n.history)};return true;}
function remember(s,key){if(s.practice)return;s.campaign.tacticalMemory[key]=(s.campaign.tacticalMemory[key]||0)+1;}
function setStoryFlag(s,key,value=true){if(!s.practice)s.campaign.flags[key]=value;}
function introStory(s){enqueueStory(s,`${s.missionId}:intro`);openStory(s);}
function afterBattleEvents(s){
 if(s.screen==='battle'&&s.phase==='player'&&s.turn===2)enqueueStory(s,`${s.missionId}:turn2`);
 if(s.missionId===1&&s.screen==='battle'&&s.turn===4)enqueueStory(s,'1:turn4');
 if(s.units.some(u=>u.rescued))enqueueStory(s,`${s.missionId}:rescue`);
 if(s.missionId===3&&s.units.some(u=>u.team==='civilian'&&u.hp<=0))enqueueStory(s,'3:loss');
 if(s.outcome){enqueueStory(s,s.outcome==='victory'?`${s.missionId}:end`:'defeat');}
}

// src/core/economy.js
const CARRY_CAPACITY=6,GEAR_CAPACITY=24;
const rewardFor=id=>({1:100,2:120,3:140}[id]||0);
function initialEconomy(completed=[]){return {gold:180+[...new Set(completed)].reduce((a,id)=>a+rewardFor(id),0),items:{medium:0,ether:0,ward:0},gear:[],equipped:Object.fromEntries(HEROES.map(h=>[h.id,{weapon:null,armor:null,accessory:null}])),next:1,nonce:0,transactions:[],rewards:[...new Set(completed)]};}
function ensureEconomy(s){if(!s.campaign.economy)s.campaign.economy=initialEconomy(s.campaign.completed);if(!s.economy)s.economy=structuredClone(s.campaign.economy);return s.economy;}
const itemCount=e=>Object.values(e.items).reduce((a,b)=>a+b,0);
function equipmentBonus(e,hero){const bonus={};for(const id of Object.values(e?.equipped?.[hero]||{})){const instance=e.gear.find(g=>g.id===id),g=GEAR[instance?.type];if(!g)continue;for(const [k,v]of Object.entries(g.bonus))bonus[k]=(bonus[k]||0)+v;if(instance.level===1)for(const [k,v]of Object.entries(g.upgrade))bonus[k]=(bonus[k]||0)+v;}return bonus;}
function effectiveStats(s,u){const b=u.team==='ally'?equipmentBonus(s.economy,u.id):{};const v={...u,mov:u.mov+(u.classMovementModifier||0)};for(const [k,n]of Object.entries(b))v[k]=(v[k]||0)+n;if(u.ward){v.def+=2;v.res+=2;}return v;}
function equipmentLabel(e,hero){return Object.entries(e.equipped[hero]).map(([slot,id])=>{const g=e.gear.find(a=>a.id===id);return `${slot}: ${g?GEAR[g.type].name+(g.level?' +1':''):'Standard'}`;}).join(' · ');}
function validateEconomy(e){
 if(!e||!Number.isSafeInteger(e.gold)||e.gold<0||e.gold>1000000||!e.items||Object.keys(e.items).length!==3||Object.entries(e.items).some(([id,n])=>!TOOLS[id]||!Number.isInteger(n)||n<0)||itemCount(e)>CARRY_CAPACITY||!Array.isArray(e.gear)||e.gear.length>GEAR_CAPACITY||!Number.isSafeInteger(e.next)||e.next<1||!Number.isSafeInteger(e.nonce)||e.nonce<0||!Array.isArray(e.transactions)||e.transactions.length>100||e.transactions.some(t=>typeof t!=='string')||!Array.isArray(e.rewards)||e.rewards.some(id=>![1,2,3].includes(id))||new Set(e.rewards).size!==e.rewards.length)throw Error('자산 저장이 손상되었습니다.');
 const ids=new Set();for(const g of e.gear){if(!g||!GEAR[g.type]||typeof g.id!=='string'||!/^g[1-9][0-9]*$/.test(g.id)||ids.has(g.id)||Number(g.id.slice(1))>=e.next||![0,1].includes(g.level))throw Error('장비 저장이 손상되었습니다.');ids.add(g.id);}
 if(!e.equipped||Object.keys(e.equipped).length!==5)throw Error('장착 저장이 손상되었습니다.');const used=new Set();for(const h of HEROES){const slots=e.equipped[h.id];if(!slots||Object.keys(slots).length!==3||!['weapon','armor','accessory'].every(k=>Object.hasOwn(slots,k)))throw Error('장비 슬롯이 손상되었습니다.');for(const [slot,id]of Object.entries(slots)){if(id===null)continue;const g=e.gear.find(a=>a.id===id),type=GEAR[g?.type];if(!g||type.slot!==slot||!type.heroes.includes(h.id)||used.has(id))throw Error('장착 호환성이 손상되었습니다.');used.add(id);}}
 return e;
}
// Stale confirmation tokens never apply twice, even after a reload.
function transact(s,request){
 if(s.practice)return {ok:false,error:'연습에서는 정식 자산 거래를 할 수 없습니다.'};
 if(!['exploration','warroom','deployment'].includes(s.screen)||s.narrative?.active)return {ok:false,error:'전투 전 준비 장소에서 거래하세요.'};
 const current=ensureEconomy(s);if(!request||request.token!==`tx:${current.nonce}`||current.transactions.includes(request.token))return {ok:false,error:'이미 처리되었거나 만료된 거래입니다.'};
 const e=structuredClone(current),{op,id,hero,slot}=request;let cost=0;
 try{
 if(op==='buy-item'){const t=TOOLS[id];if(!t)throw Error('알 수 없는 도구입니다.');if(itemCount(e)>=CARRY_CAPACITY)throw Error('도구 소지 한도는 6개입니다.');cost=t.price;e.items[id]++;}
 else if(op==='sell-item'){const t=TOOLS[id];if(!t||!e.items[id])throw Error('보유 도구가 없습니다.');cost=-t.sell;e.items[id]--;}
 else if(op==='buy-gear'){const g=GEAR[id];if(!g)throw Error('알 수 없는 장비입니다.');if(e.gear.length>=GEAR_CAPACITY)throw Error('장비 소지 한도는 24개입니다.');if(hero&&!g.heroes.includes(hero))throw Error('이 장수의 병종은 장비를 사용할 수 없습니다.');cost=g.price;const instance={id:`g${e.next++}`,type:id,level:0};e.gear.push(instance);if(hero)e.equipped[hero][g.slot]=instance.id;}
 else if(op==='sell-gear'||op==='upgrade'){const instance=e.gear.find(a=>a.id===id);if(!instance)throw Error('장비를 찾을 수 없습니다.');if(op==='upgrade'){if(instance.level)throw Error('이미 +1 강화한 장비입니다.');cost=40;instance.level=1;}else{if(Object.values(e.equipped).some(slots=>Object.values(slots).includes(id)))throw Error('장착을 해제한 뒤 판매하세요.');cost=-Math.floor(GEAR[instance.type].price*.4);e.gear=e.gear.filter(a=>a.id!==id);}}
 else if(op==='equip'){const instance=e.gear.find(a=>a.id===id),g=GEAR[instance?.type];if(!g||!g.heroes.includes(hero)||g.slot!==slot)throw Error('이 장수의 직업/슬롯과 호환되지 않습니다.');if(Object.values(e.equipped).some(slots=>Object.values(slots).includes(id)))throw Error('이미 장착된 장비입니다.');e.equipped[hero][slot]=id;}
 else if(op==='unequip'){if(!e.equipped[hero]||!['weapon','armor','accessory'].includes(slot))throw Error('슬롯이 올바르지 않습니다.');e.equipped[hero][slot]=null;}
 else throw Error('알 수 없는 거래입니다.');
 if(cost>e.gold)throw Error('Gold가 부족합니다.');e.gold-=cost;e.transactions.push(request.token);e.transactions=e.transactions.slice(-100);e.nonce++;validateEconomy(e);
 s.economy=e;s.campaign.economy=structuredClone(e);return {ok:true,cost};
 }catch(error){return {ok:false,error:error.message};}
}
function commitEconomyReward(s){if(s.practice)return 0;const e=ensureEconomy(s);if(e.rewards.includes(s.missionId))return 0;const reward=rewardFor(s.missionId);e.rewards.push(s.missionId);e.gold+=reward;s.campaign.economy=structuredClone(e);s.log.push(`첫 승리 보상 +${reward} Gold`);return reward;}
function useTool(s,u,id){const e=ensureEconomy(s),t=TOOLS[id];if(!t||!e.items[id])return {ok:false,error:'보유 도구가 없습니다.'};if(id==='ward'&&u.ward)return {ok:false,error:'보호 효과가 이미 적용 중입니다.'};if(t.stat==='hp'&&u.hp>=u.maxHP||t.stat==='mp'&&u.mp>=u.maxMP)return {ok:false,error:'회복할 수치가 없습니다.'};e.items[id]--;if(id==='ward'){u.ward=true;s.feedback.push({type:'guard',id:u.id,text:'WARD'});}else{const max=t.stat==='hp'?u.maxHP:u.maxMP,amount=Math.min(t.amount,max-u[t.stat]);u[t.stat]+=amount;s.feedback.push({type:'heal',id:u.id,text:`+${amount} ${t.stat.toUpperCase()}`,...(t.stat==='hp'?{toHP:u.hp}:{})});}s.log.push(`${u.name}: ${t.name} 사용 · 행동 1회`);return {ok:true};}

// src/core/frontier.js
function frontierState(missionId=1){return {hub:missionId===1?'village':'camp',x:7,y:7,facing:'down',visited:{village:['square'],camp:['square']},events:[],affiliation:{eric:'affiliated',elina:'affiliated',lia:'available',sain:'available',kai:'available'},members:['eric','elina','lia','sain','kai'],phase:'preparation',pendingRecruit:null,ready:{equipment:false,items:false,formation:false,objective:false}};}
function ensureFrontier(s){if(!s.frontier)s.frontier=structuredClone(s.campaign.frontier||frontierState(s.missionId));ensureEconomy(s);return s.frontier;}
function syncFrontier(s){if(!s.practice)s.campaign.frontier=structuredClone(s.frontier);}
function enterHub(s,{aftermath=false,story=true}={}){const f=ensureFrontier(s);const hub=s.missionId===1?'village':'camp';if(f.hub!==hub){f.hub=hub;[f.x,f.y]=HUBS[hub].spawn;}if(f.interior){const p=f.returnPosition;f.x=p.x;f.y=p.y;delete f.interior;delete f.returnPosition;}f.phase=aftermath?'aftermath':'preparation';s.screen='exploration';if(story&&!s.practice)enqueueStory(s,aftermath&&s.missionId===3&&!s.campaign.bonds.erik_kai?'after:3:quiet':`${aftermath?'after':'pre'}:${s.missionId}`);if(aftermath&&s.missionId===3&&(s.campaign.results.at(-1)?.rescued||0)<2)enqueueStory(s,'after:3:loss');openStory(s);syncFrontier(s);return s;}
const currentHub=s=>s.frontier?.interior?INTERIORS[s.frontier.interior]:HUBS[s.frontier.hub];
function enterInterior(s,kind){const f=s.frontier;if(s.screen!=='exploration'||s.narrative.active||f.interior||!INTERIORS[kind]||!interactions(s).some(n=>n.action===kind))return false;f.returnPosition={hub:f.hub,x:f.x,y:f.y,facing:f.facing};f.interior=kind;[f.x,f.y]=INTERIORS[kind].spawn;f.facing='up';syncFrontier(s);return true;}
function exitInterior(s){const f=s.frontier;if(!f.interior||s.narrative.active||!interactions(s).some(n=>n.action==='exit'))return false;const p=f.returnPosition;if(!p)return false;f.hub=p.hub;f.x=p.x;f.y=p.y;f.facing=p.facing;delete f.interior;delete f.returnPosition;syncFrontier(s);return true;}
function walkable(s,x,y){const h=currentHub(s);return Number.isInteger(x)&&Number.isInteger(y)&&x>0&&y>0&&x<h.width-1&&y<h.height-1&&!h.buildings.some(b=>x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h)&&!h.npcs.some(n=>n.x===x&&n.y===y);}
function visitPlaces(s){const f=s.frontier,h=currentHub(s);for(const p of h.places)if(!f.interior&&Math.abs(f.x-p.x)+Math.abs(f.y-p.y)<=1&&!f.visited[f.hub].includes(p.id))f.visited[f.hub].push(p.id);syncFrontier(s);}
function stepAren(s,dx,dy){if(s.screen!=='exploration'||s.narrative.active||![[0,1],[0,-1],[1,0],[-1,0]].some(d=>d[0]===dx&&d[1]===dy))return false;const f=s.frontier;f.facing=dx<0?'left':dx>0?'right':dy<0?'up':'down';if(!walkable(s,f.x+dx,f.y+dy))return false;f.x+=dx;f.y+=dy;visitPlaces(s);return true;}
function frontierPath(s,x,y){if(!walkable(s,x,y))return null;const f=s.frontier,q=[[[f.x,f.y]]],seen=new Set([`${f.x},${f.y}`]);while(q.length){const p=q.shift(),[a,b]=p.at(-1);if(a===x&&b===y)return p;for(const [dx,dy]of[[0,-1],[-1,0],[1,0],[0,1]]){const nx=a+dx,ny=b+dy,k=`${nx},${ny}`;if(!seen.has(k)&&walkable(s,nx,ny)){seen.add(k);q.push([...p,[nx,ny]]);}}}return null;}
function fastTravel(s,id){const f=s.frontier,h=HUBS[f.hub],p=h.places.find(p=>p.id===id);if(s.screen!=='exploration'||s.narrative.active||f.interior||!p||!f.visited[f.hub].includes(id)||!frontierPath(s,p.x,p.y))return false;[f.x,f.y]=[p.x,p.y];visitPlaces(s);return true;}
function interactions(s){const f=s.frontier,h=currentHub(s);return [...h.npcs.map(n=>({...n,npc:true})),...h.places.filter(p=>p.action)].filter(n=>Math.abs(n.x-f.x)+Math.abs(n.y-f.y)<=1);}
function interactNPC(s,id){const f=s.frontier,n=currentHub(s).npcs.find(n=>n.id===id);if(s.screen!=='exploration'||s.narrative.active||!n||Math.abs(n.x-f.x)+Math.abs(n.y-f.y)>1)return false;const key=`npc:${s.missionId}:${f.phase}:${id}`;if(!STORY[key])return false;if(!f.events.includes(key))f.events.push(key);if(RECRUITS[id]&&f.affiliation[id]==='available')f.affiliation[id]='encountered';if(RECRUITS[id]&&f.affiliation[id]==='encountered')f.pendingRecruit=id;// repeat dialogue, never duplicate affiliation/reward
 s.narrative.events=s.narrative.events.filter(k=>k!==key);enqueueStory(s,key);if(id==='lia'&&s.campaign.flags.royal_supply_evidence)enqueueStory(s,'npc:evidence');if(id==='eric'&&s.campaign.bonds.erik_kai)enqueueStory(s,'npc:bond');openStory(s);syncFrontier(s);return true;}
function affiliate(s,id){const f=s.frontier;if(s.practice||s.screen!=='exploration'||s.narrative.active||!RECRUITS[id]||f.affiliation[id]!=='encountered')return false;f.affiliation[id]='affiliated';f.pendingRecruit=null;if(!f.members.includes(id))f.members.push(id);syncFrontier(s);return true;}
function validateFrontier(f){if(f?.pendingRecruit!=null&&(!RECRUITS[f.pendingRecruit]||f.affiliation?.[f.pendingRecruit]!=='encountered'))throw Error('동료 선택 기록이 손상되었습니다.');if(!f||!HUBS[f.hub]||!Number.isInteger(f.x)||!Number.isInteger(f.y)||!['preparation','aftermath'].includes(f.phase)||!['up','down','left','right'].includes(f.facing)||!f.visited||!f.affiliation||!Array.isArray(f.events)||!Array.isArray(f.members)||new Set(f.members).size!==5||f.members.length!==5||!['eric','elina','lia','sain','kai'].every(id=>f.members.includes(id)&&['available','encountered','affiliated'].includes(f.affiliation[id]))||!f.ready||['equipment','items','formation','objective'].some(k=>typeof f.ready[k]!=='boolean'))throw Error('탐색 기록이 손상되었습니다.');for(const hub of Object.keys(HUBS))if(!Array.isArray(f.visited[hub])||f.visited[hub].some(id=>!HUBS[hub].places.some(p=>p.id===id)))throw Error('방문 기록이 손상되었습니다.');if(f.interior){if(!INTERIORS[f.interior]||!f.returnPosition||f.returnPosition.hub!==f.hub||!walkable({frontier:{...f,interior:null}},f.returnPosition.x,f.returnPosition.y))throw Error('상점 복귀 위치가 손상되었습니다.');}const dummy={frontier:f};if(!walkable(dummy,f.x,f.y))throw Error('아렌 위치가 손상되었습니다.');return f;}
function councilInfo(s){return s.missionId===1?{terrain:'Village / Forest / Ruin',intel:'북쪽 Garr, TURN 3 양쪽 모서리 증원. TURN 5부터 주민 위협.',plan:'주민 둘을 모두 구출하고 Garr 격파. 방패/궁수의 거리와 퇴로를 확인.'}:s.missionId===2?{terrain:'Forest · 이동 비용 2 (Kai 1)',intel:s.campaign.flags.royal_supply_evidence?'군용 인장 확인. 배후는 알 수 없음. 도주 대장 북쪽 출구.':'보급품 출처: 알 수 없음. 도주 대장 북쪽 출구.',plan:'대장 HP 절반 이하 + 인접 → 생포. 생포는 선택; 섬멸/도주 종료도 승리. 길목과 장거리 사격, 우회 기동.'}:{terrain:'Broken Bridge · 좁은 교량 / 북쪽 안전 구역 y≤2',intel:s.campaign.flags.mission_02_supply_route_discovered?'포로 진술: 버려진 성채. 진위·명령자는 미확인. 후방 추격병 접근.':'보급로 진술 없음. 후방 추격병 접근과 교량 위험은 확인.',plan:'10턴 안에 주민 1명 이상 구조 + 생존 장수 전원 북쪽 3줄(y≤2) 철수. 인접 구조 또는 호위 이동. 전원 구조 선택 목표. Guard/Heal/우회 협력.'};}

ntory · 도구')}${!ready&&!f.interior?frontierButton('warroom','War Council · 작전 회의로 이동','',false,'primary'):''}${ready&&s.missionId<3?frontierButton('next-mission',`다음 이야기 · Mission ${s.missionId+1} →`,'',false,'primary'):''}${ready&&s.missionId===3?frontierButton('campaign','Mission 연습'):''}</div><small>방문 후 Fast Travel 해금 · 클릭 목적지 이동<br>도구 ${itemCount(s.economy)}/${CARRY_CAPACITY} · 기본 회복약 2개</small></aside></div></section>`;}

class AudioEngine{

 select(scene,force=false){if(!SCORE[scene])return;const changed=scene!==this.scene;this.scene=scene;if(!this.ctx||!changed&&!force)return;const now=this.ctx.currentTime;if(!this.tracks.has(scene)){const g=this.ctx.createGain();g.gain.value=0;g.connect(this.master);this.tracks.set(scene,g);}for(const [id,g]of this.tracks){g.gain.cancelScheduledValues(now);g.gain.setTargetAtTime(id===scene?1:0,now,.25);}if(changed)this.transitions++;}

 schedule(){if(!this.ctx||this.ctx.state!=='running')return;const now=this.ctx.currentTime;if(this.nextAt<now-.3)this.nextAt=now+.02;while(this.nextAt<now+.22){const t=this.nextAt,beat=60/SCORE[this.scene].tempo/2;for(const [id,dest]of this.tracks){if(id!==this.scene&&dest.gain.value<.005)continue;const score=SCORE[id],i=this.step%32;this.tone(score.melody[i],score.instruments[0],t,beat*.85,score.gain,dest);if(i%4===0){const bass=score.bass[Math.floor(i/8)];this.tone(bass,'horn',t,beat*3.7,.12,dest);this.tone(bass+19,score.instruments[1],t,beat*3.6,.045,dest);}if(['player','enemy','crisis'].includes(id)&&i%2===0)this.tone(i%4?42:30,'horn',t,.09,.12,dest);}this.step++;this.nextAt+=beat;}}
 effect(kind){if(!this.ctx||this.ctx.state!=='running')return;const now=this.ctx.currentTime;const p=kind==='heal'?79:kind==='death'?38:kind==='attack'?51:67;this.tone(p,kind==='heal'?'flute':'horn',now,.13,.22,this.sfxGain);}
 stinger(outcome){if(!this.ctx)return;const notes=outcome==='victory'?[62,65,69,74]:[62,61,57,50];notes.forEach((p,i)=>this.tone(p,'horn',this.ctx.currentTime+.02+i*.18,.4,.22,this.sfxGain));}

}

const RANGE_STYLE={move:{fill:'rgba(43,161,232,.62)',border:'#a9e8ff'},attack:{fill:'rgba(228,78,64,.62)',border:'#ffbf89'},support:{fill:'rgba(70,190,117,.60)',border:'#cbf5a6'}};
function moveDuration(path,mode='step',speed=1){return mode==='instant'||path.length<2?0:(path.length-1)*(mode==='step'?320:210)/speed;}
function motionAt(path,elapsed,mode='step',speed=1){

 return {x:path[index].x+(path[index+1].x-path[index].x)*t,y:path[index].y+(path[index+1].y-path[index].y)*t,index:progress===1?path.length-1:index,done:progress===1};
}
function attackKind(unit,mode){if(unit.id==='lia'&&mode==='skill')return 'fireball';if(unit.range?.[0]>=2)return 'arrow';if(unit.id==='kai')return 'dagger';return unit.kind==='bandit'||unit.kind==='captain'?'axe':'sword';}
function presentationPlan(events,units,{movement='step',speed=1,reduced=false}={}){
 const plans=[],hp=[],motions=[];let cursor=0,lastImpact=0;
 for(const event of events){
  if(event.type==='move'){const duration=moveDuration(event.path,movement,speed);motions.push({...event,delay:cursor,duration,movement,speed});cursor+=duration;}
  else if(event.type==='attack'){
   const unit=units.find(u=>u.id===event.id),kind=attackKind(unit,event.mode),duration=(reduced?220:kind==='fireball'?1250:kind==='arrow'?680:720)/speed,impact=cursor+duration*(kind==='fireball'?.56:kind==='arrow'?.65:.46);
   plans.push({...event,kind,delay:cursor,duration,impact});lastImpact=impact;cursor+=duration;
  }else{const delay=['hit','critical','miss','death'].includes(event.type)?lastImpact:Math.max(0,cursor-180/speed),duration=(['level','potential'].includes(event.type)?1400:900)/speed;plans.push({...event,delay,duration});
   if(Number.isFinite(event.toHP))hp.push({id:event.id,delay,hp:event.toHP});
  }

}

// Keep actionable map targets clear wherever the viewport has enough room.
function placePopover({width,height,popupWidth,popupHeight,anchor,protectedPoints=[]}){
 const margin=6,maxX=Math.max(margin,width-popupWidth-margin),maxY=Math.max(margin,height-popupHeight-margin),clamp=(v,max)=>Math.max(margin,Math.min(max,v));
 const xs=[anchor.x+20,anchor.x-popupWidth-20,anchor.x-popupWidth/2,margin,maxX],ys=[anchor.y-popupHeight-23,anchor.y+23,anchor.y-popupHeight/2,margin,maxY];let best=null;
 for(const x0 of xs)for(const y0 of ys){const x=clamp(x0,maxX),y=clamp(y0,maxY);let score=Math.hypot(x+popupWidth/2-anchor.x,y+popupHeight/2-anchor.y);
  for(const p of protectedPoints){const r=p.radius??12;if(p.x+r>x&&p.x-r<x+popupWidth&&p.y+r>y&&p.y-r<y+popupHeight)score+=(p.x>x&&p.x<x+popupWidth&&p.y>y&&p.y<y+popupHeight?1000000:100)*(p.weight??1);}
  if(!best||score<best.score)best={x,y,score};
 }return {x:Math.round(best.x),y:Math.round(best.y)};
}

 if(state.screen==='title')html=`<div class="title-inner"><div class="eyebrow">AN ORIGINAL FANTASY TACTICAL RPG</div><h1>Ashen<br>Crown<span class="accent">.</span></h1><div class="subtitle">ACT I — The Living Frontier</div><p>재가 된 왕관 아래, 다섯 동료의 이야기가 시작됩니다.<br>당신의 선택은 전장을 바꾸고, 장수의 숨겨진 가능성을 깨웁니다.</p><div class="title-actions"><button class="primary" data-do="new">캠페인 시작 →</button><button data-do="load" ${loaded.state||state.campaign.clears?'':'disabled'}>저장 불러오기</button><button data-do="campaign">Campaign</button><button data-do="audio">♫ Music</button><button data-do="help">플레이 안내</button></div><div class="title-bottom"><div>TACTICAL COMBAT<br><span class="accent">지형 · 사거리 · 협공</span></div><div>CHARACTER GROWTH<br><span class="accent">다섯 장수 · 서로 다른 역할</span></div><div>HIDDEN POTENTIAL<br><span class="accent">행동에서 발견하는 단서</span></div></div></div>`;
 else if(state.screen==='intro')html=`<div class="screen-inner"><div class="eyebrow">ACT I · MISSION ${state.missionId}</div><h2>${missionOf(state).title}</h2><div class="story">${esc(missionOf(state).objective)}<br><br>${esc(missionOf(state).brief)}<br><br>아렌의 명령 아래, 다섯 동료가 각자의 이유로 전장에 나섭니다.</div><button class="primary" data-do="warroom">동료들과 전투 준비 →</button></div>`;
 else if(state.screen==='warroom')html=`<div class="screen-inner council-screen">${councilHTML(state,esc,portrait,ui.selected)}</div>`;
 else if(state.screen==='result'){
 const victory=state.outcome==='victory',last=state.campaign.results.at(-1);
 html=`<div class="screen-inner"><div class="eyebrow">MISSION ${state.missionId} · GROWTH JOURNAL</div><div class="result-head"><h2>${victory?'Mission Complete':'A Costly Lesson'}</h2><span class="muted">TURN ${state.turn}<br>${victory?'VICTORY':'DEFEAT'} · 구조 ${last.rescued}/${missionOf(state).civilians.length}</span></div><p style="font-size:13px;margin-top:12px">${esc(state.reason)}</p><div class="badges"><span class="badge ${last.allAlive?'':'failed'}">${last.allAlive?'✓':'◇'} 전원 생존</span><span class="badge ${last.swift&&victory?'':'failed'}">${last.swift&&victory?'✓':'◇'} ${missionOf(state).par}턴 이내 승리</span><span class="badge ${last.potential?'':'failed'}">${last.potential?'✓':'◇'} Guardian’s Oath 단서</span></div><div class="growth-list">${HEROES.map(h=>{const a=findUnit(state,h.id),start=state.missionStart.find(m=>m.id===a.id);const gains=a.growthHistory.filter(g=>g.level>start.level);return `<article class="growth-card" data-growth="${a.id}"><div class="row"><h3>${a.name}</h3><span class="gain">+${a.earnedXP} EXP · LV ${start.level} → ${a.level}</span></div><p>${gains.length?`성장: HP +${a.maxHP-start.stats.maxHP} · ATK +${a.atk-start.stats.atk} · DEF +${a.def-start.stats.def} · MAG +${a.mag-start.stats.mag}`:'이번 전투의 경험이 다음 성장을 준비합니다.'}</p><p>${esc([...new Set(a.highlights)].slice(-3).join(' · ')||'동료와 함께 첫 전장을 경험했습니다.')}${a.hp===0?' · 전투불능':''}</p><p class="accent">${a.clues.length?`Potential: ${esc(a.clues.join(', '))} (1/3)`:'숨겨진 잠재력은 아직 발견되지 않았습니다.'}</p><p class="goal">다음 성장 목표 · ${esc(h.goal)}</p></article>`;}).join('')}</div><div class="row">${victory&&state.missionId<3&&state.campaign.completed.includes(state.missionId)?`<button class="primary" data-do="next-mission" ${ui.busy?'disabled':''}>Mission ${state.missionId+1} →</button>`:''}<button class="primary" data-do="aftermath">${victory?'마을 / 야영지로 돌아가기':'야영지에서 다시 준비'} →</button><button data-do="replay" ${ui.busy?'disabled':''}>${victory?'현재 Mission 연습':'전투 전 성장으로 재도전'} →</button><button data-do="fresh-replay" ${ui.busy?'disabled':''}>LV 초기 상태로 연습</button><button data-do="backup" ${ui.busy?'disabled':''}>텍스트 백업</button></div><p class="muted" style="margin-top:13px">${ui.busy?'전투 결과를 정리하고 있습니다. 잠시 후 재도전할 수 있습니다.':victory?'성장한 장수와 결과가 저장되었습니다.':'패배 기록을 저장했습니다. 재도전은 이번 전투 시작 전 성장 상태로 돌아갑니다.'} ${state.missionId===3?'ACT I 전반 완료 · 다음은 버려진 성채 (v0.4 예정).':'첫 클리어 성장만 확정합니다. 재플레이의 EXP는 연습용입니다.'}</p></div>`;
 }
 $('#screen').innerHTML=`<div class="screen-overlay ${state.screen==='result'?'result-overlay':''}">${html}</div>`;
}
function modal(title,body,actions){$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-title"><h2>${esc(title)}</h2><button class="modal-close" data-do="close-modal" aria-label="닫기">×</button></div>${body}<div class="row">${actions}</div></section></div>`;const dialog=$('#modal-root .modal');dialog.tabIndex=-1;dialog.focus({preventScroll:true});dialog.scrollTop=0;}
function closeModal(){if($('#modal-root .modal')?.getAttribute('aria-label')==='동료의 약속'){state.frontier.pendingRecruit=null;syncFrontier(state);save();}pendingTransaction=null;shopKind=null;$('#modal-root').innerHTML='';audio.select(musicScene(state));if(state.narrative.active){renderStory();paintPortraits();}$('#battle-map').focus({preventScroll:true});}
const help=()=>modal('전투 안내',`<p><b>목표:</b> 주민 2명 구출 + 산적 대장 Garr 격파. 주민 한 명이라도 사망하거나 아군이 전멸하면 패배합니다.</p><p><b>조작:</b> 장수 탭 → 작은 행동 메뉴 → 이동 → 목적지 → 이동 확정. 이후 공격/스킬 → 대상 → 예측 → 행동 확정. 유닛당 이동 1회와 행동 1회. 공격·스킬·구출·약·대기는 행동을 마칩니다. 행동 전 이동은 Z로 취소할 수 있습니다.</p><p><b>지형:</b> Grass / Road 이동 비용 1. Forest 비용 2, DEF +1 / 회피 +12%; Kai는 숲 비용 1. Village DEF +2. Ruin은 통과 불가. 사거리는 직교 거리입니다. 건물이나 숲이 사격을 차단하지 않습니다.</p><p><b>스킬:</b> Guard는 인접 동료를 보호하며, Eric이 그 동료 옆에 있을 때 첫 인접 근접 피해를 대신 받습니다. Fire Bolt는 RES를 적용합니다. Heal은 자기 회복 가능. Quick Strike의 협공은 적 반대편 인접 아군이 있어야 성립합니다.</p><p><b>이벤트:</b> TURN 3 증원, TURN 5 주민 공격 시작. 주민 옆에서 구출 행동. 마법에도 기본 공격 사거리 내에서는 반격 가능. 반격에 대한 재반격은 없습니다.</p><p><b>키:</b> 1 이동 · 2 공격 · 3 스킬 · 4 구출 · Z 취소 · W 대기 · Tab 다음 장수 · E Phase 종료 · Escape 취소. 휠 Zoom, 우클릭/Shift 드래그 Pan. Touch는 탭과 드래그 Pan 지원. 선택한 장수의 얼굴과 HP/MP는 하단에 표시됩니다. 작은 메뉴에서 스킬·도구·특성을 열 수 있습니다. 하단에서 칸별 걷기 / 연속 걷기 / 즉시 이동, 속도와 약한 효과를 선택하세요. 두 손가락으로 확대할 수 있습니다. 이동을 선택한 뒤 같은 Tile을 누르면 제자리에서 행동합니다.</p><p>로컬 저장은 현재 브라우저와 파일 경로에 연결됩니다. 파일을 옮기거나 다른 브라우저를 사용하기 전 텍스트 백업을 권장합니다. 초기화는 메뉴에서 직접 확인합니다.</p>`,'');
function nextHero(){const ids=HEROES.map(h=>h.id),start=ids.indexOf(ui.selected);for(let i=1;i<=5;i++){const u=findUnit(state,ids[(start+i)%5]);if(canAct(state,u)){ui.selected=u.id;renderer.focus(u.x,u.y);ui.mode=u.moved?'choose':'move';ui.menu='root';ui.preview=null;ui.notice=null;ui.inspected=null;render();return;}}ui.preview=null;render();}
async function effects(before){for(const e of state.feedback)if(['attack','heal','death'].includes(e.type))audio.effect(e.type);if(state.outcome&&!before.outcome)audio.stinger(state.outcome);
 const duration=renderer.addEffects(state.feedback,before,{movement:ui.movement,speed:ui.speed,reduced:ui.reduced});const potential=state.feedback.find(e=>e.type==='potential');if(potential){const u=findUnit(state,potential.id);toast(`${u.name} · Potential Clue Discovered — ${u.clues.at(-1)} (1/3)`);}await new Promise(r=>setTimeout(r,duration+24));}
async function enemyLoop(){if(enemyRunning)return;ui.menu=null;enemyRunning=true;ui.busy=true;render();try{while(state.phase==='enemy'&&state.screen==='battle'&&!state.narrative.active){const before=structuredClone(state);advanceEnemy(state);const actor=findUnit(state,state.feedback.find(e=>e.type==='move'||e.type==='attack')?.id);if(actor)renderer.focus(actor.x,actor.y);const playing=effects(before);save();render();await playing;}ui.preview=null;if(!canAct(state,findUnit(state,ui.selected)))ui.selected=HEROES.find(h=>alive(findUnit(state,h.id)))?.id||'eric';ui.mode='choose';const selected=findUnit(state,ui.selected);if(selected)renderer.focus(selected.x,selected.y);}finally{ui.busy=false;enemyRunning=false;commit();}}
async function execute(mode,target){if(ui.busy)return;const before=structuredClone(state);const r=performAction(state,ui.selected,mode,target);if(!r.ok){toast(r.error);return;}ui.preview=null;ui.menu=null;ui.notice=null;ui.inspected=null;ui.phaseConfirm=false;ui.busy=true;const playing=effects(before);save();render();await playing;ui.busy=false;if(state.screen==='battle')nextHero();commit();}
async function dispatch(action,id){if(state.narrative.active&&!['story-next','story-skip','story-auto','story-fast','story-log','audio','close-modal','save','menu','backup','copy-backup','restore','load','restart-stage','confirm-restart-stage'].includes(action))return;
if(ui.pendingMove&&!['confirm-move','cancel-move','close-unit-menu','zoom-in','zoom-out','reset-camera','help','close-modal'].includes(action)){ui.menu='move-confirm';render();toast('먼저 이동을 확정하거나 취소하세요.');return;}if(ui.busy&&!['journal','zoom-in','zoom-out','reset-camera','help','close-modal'].includes(action))return;
 if(await frontierDispatch(action,id))return;
 switch(action){
 case 'story-next':case 'story-skip':advanceStory(state,action==='story-skip');commit();if(!state.narrative.active&&state.phase==='enemy'&&state.screen==='battle')enemyLoop();break;
 case 'story-fast':state.narrative.fast=!state.narrative.fast;commit();break;
 case 'story-auto':state.narrative.auto=!state.narrative.auto;commit();break;
 case 'story-log':modal('Dialogue History',`<div class="history">${state.narrative.history.map(l=>`<p><b>${esc(SPEAKERS[l.speaker]?.name||'Enemy')}</b> · ${esc(l.text)}</p>`).join('')||'<p>아직 기록이 없습니다.</p>'}</div>`,'');break;
 case 'audio':showAudio();break;
 case 'campaign':showCampaign();break;
 case 'choose-mission':{if(['battle','deployment'].includes(state.screen)){toast('현재 전투/배치를 마친 뒤 Campaign을 선택하세요.');break;}if(state.outcome==='defeat')state=replay(state);const idn=Number(id);if(!MISSIONS[idn])break;if(idn>1&&!state.campaign.completed.includes(idn-1))break;state=newGame(state.initialSeed,state.campaign,idn);ui.selected='eric';closeModal();enterHub(state);renderer.clearPresentation();renderer.reset();commit();break;}
 case 'appearance':showAppearance();break;
 case 'new':state=newGame(state.initialSeed,state.campaign,state.campaign.completed.includes(1)?Math.min(3,(state.campaign.completed.at(-1)||0)+1):1);ui.selected='eric';enterHub(state);commit();break;
 case 'warroom':await prepareCouncil();break;case 'deploy':state.frontier.ready.formation=true;syncFrontier(state);setScreen('deployment');break;
 case 'select':{const u=findUnit(state,id);if(!u||u.team!=='ally'||state.screen==='battle'&&!alive(u))break;ui.selected=id;ui.menu=state.screen==='battle'?'root':null;ui.mode=state.screen==='battle'&&!u.moved&&!u.acted?'move':initialMode(u);renderer.focus(u.x,u.y);ui.preview=null;ui.notice=null;ui.inspected=null;ui.phaseConfirm=false;render();break;}
 case 'preset':presetDeployment(state,id);commit();break;
 case 'start-battle':if(state.screen==='deployment'){modal('출전 최종 확인',`<p><b>${esc(missionOf(state).objective)}</b></p><p>${esc(councilInfo(state).plan)}</p><p>Equipment / Items / Formation / Objective<br>기본 장비로 출전 가능 · 구매 준비는 선택입니다.</p><p>기본 회복약 2개 + 구매 도구 ${itemCount(state.economy)}개. 출전 이후 장비 변경은 잠깁니다.</p>`,'<button class="primary" data-do="confirm-battle">출전 확정</button><button data-do="close-modal">계속 준비</button>');}break;
 case 'confirm-battle':if(startBattle(state)){closeModal();ui.mode='choose';ui.notice=null;commit();}break;
 case 'open-unit-menu':ui.menu=ui.pendingMove?'move-confirm':'root';render();break;
 case 'submenu':ui.menu=id;render();break;
 case 'close-unit-menu':if(ui.pendingMove)await cancelMovement();else{ui.menu=null;ui.preview=null;render();}break;
 case 'cancel-target':ui.menu=null;ui.preview=null;render();break;
 case 'confirm-move':confirmMovement();break;
 case 'cancel-move':await cancelMovement();break;
 case 'mode':if(canAct(state,findUnit(state,ui.selected))||state.screen==='deployment'){ui.mode=id;ui.menu=null;ui.preview=null;ui.notice=null;ui.inspected=null;ui.phaseConfirm=false;render();}break;
 case 'undo':if(undoMove(state,ui.selected)){ui.menu='root';ui.mode='choose';ui.preview=null;commit();}break;
 case 'wait':await execute('wait');break;case 'item':await execute('item');break;
 case 'confirm':if(ui.preview)await execute(ui.mode,ui.preview);break;
 case 'cancel':if(ui.pendingMove){await cancelMovement();break;}ui.menu=null;ui.preview=null;ui.mode='choose';ui.notice=null;ui.inspected=null;ui.phaseConfirm=false;render();break;
 case 'next':nextHero();break;
 case 'end-phase':{ui.menu=null;const n=state.units.filter(u=>canAct(state,u)).length;if(n){ui.phaseConfirm=true;ui.preview=null;render();}else if(beginEnemyPhase(state)){save();await enemyLoop();}break;}
 case 'confirm-phase':ui.menu=null;ui.phaseConfirm=false;if(beginEnemyPhase(state)){save();await enemyLoop();}break;
 case 'next-mission':{const next=state.frontier.phase==='aftermath'&&state.missionId<3?newGame(state.initialSeed+1,state.campaign,state.missionId+1):nextMission(state);if(next){state=next;ui.selected='eric';ui.menu=null;ui.preview=null;enterHub(state);renderer.clearPresentation();renderer.reset();commit();}break;}
 case 'replay':case 'fresh-replay':ui.menu=null;ui.pendingMove=null;state=replay(state,action==='fresh-replay');enterHub(state);ui.selected='eric';ui.mode='choose';ui.preview=null;renderer.reset();commit();break;
 case 'save':if(save().ok)toast('전투·성장·RNG 상태를 저장했습니다.');break;
 case 'load':{const r=loadGame(storage);if(r.state){ui.menu=null;ui.pendingMove=null;state=r.state;ui.phaseConfirm=false;ui.notice=null;ui.inspected=null;ui.preview=null;ui.mode='choose';ui.selected='eric';closeModal();render();if(r.warning)toast(r.warning);if(state.phase==='enemy'&&state.screen==='battle')enemyLoop();}else toast(r.warning||'저장이 없습니다.');break;}
 case 'restart-stage':if(['battle','result'].includes(state.screen))modal('스테이지를 초기화할까요?',state.stageStart?'<p>이번 스테이지에서 얻은 경험치·성장·구출·전투 결과를 되돌리고 TURN 1부터 다시 시작합니다. 전투 시작 전 성장, 출전 배치와 이전 스테이지 기록은 유지됩니다.</p>':'<p>이전 저장에는 시작 시점 배치 기록이 없습니다. 영구 성장과 이전 결과를 유지하고 추천 배치 화면부터 다시 준비합니다. 이번 전투 중 아직 확정되지 않은 성장은 되돌립니다.</p>','<button class="danger" data-do="confirm-restart-stage">스테이지 초기화</button>');break;
 case 'confirm-restart-stage':{const initial=restartStage(state);if(initial){state=initial;ui.selected='eric';ui.mode='choose';ui.preview=null;ui.menu=null;ui.pendingMove=null;ui.phaseConfirm=false;ui.inspected=null;ui.notice=null;renderer.clearPresentation();renderer.reset();closeModal();const saved=save();render();if(saved.ok)toast(state.screen==='battle'?'스테이지 초기화 완료 · 시작 배치에서 TURN 1로 돌아왔습니다.':'이전 저장 · 추천 배치에서 다시 출전하세요.');}break;}
 case 'menu':modal('Command Menu','<p>전투는 자동 저장됩니다. 텍스트 백업은 다른 파일 경로와 브라우저에서도 복원할 수 있습니다.</p>',`${state.screen==='exploration'?'<button data-do="inventory">장비 / Party</button><button data-do="items">도구</button>':''}${['warroom','deployment'].includes(state.screen)?'<button data-do="hub-return">탐색으로 돌아가기</button>':''}${['battle','result'].includes(state.screen)?'<button data-do="restart-stage">스테이지 초기화</button>':''}<button data-do="load">저장 불러오기</button><button data-do="backup">백업 / 복원</button><button data-do="campaign">Campaign</button><button data-do="story-log">대화 기록</button><button data-do="audio">음악 / 효과음</button><button data-do="appearance">장수 외형</button><button data-do="help">플레이 안내</button><button class="danger" data-do="reset">전체 저장 초기화</button>`);break;
 case 'backup':modal('텍스트 백업 / 복원','<p>아래 텍스트를 복사해 보관하세요. 복원하려면 저장 텍스트를 붙여넣고 검증 후 복원을 누릅니다.</p><textarea id="backup-text" aria-label="저장 백업 텍스트"></textarea>','<button data-do="copy-backup">전체 선택 / 복사</button><button class="primary" data-do="restore">검증 후 복원</button>');$('#backup-text').value=serialize(state);break;
 case 'copy-backup':$('#backup-text').select();try{await navigator.clipboard.writeText($('#backup-text').value);toast('백업 텍스트를 복사했습니다.');}catch{toast('전체 선택했습니다. Ctrl+C 또는 길게 눌러 복사하세요.');}break;

 if(action==='npc'){const n=interactions(state).find(n=>n.id===id&&n.npc);if(n?.service){openShop(n.service);return true;}if(interactNPC(state,id)){commit();}}
 if(action==='affiliate'){if(affiliate(state,id)){closeModal();commit();toast(`${SPEAKERS[id].name} · 소속 기록을 남겼습니다.`);}}
 if(action==='place'){const n=interactions(state).find(p=>!p.npc&&p.id===id);if(n?.action==='council')await prepareCouncil();else if(n?.action==='exit'){if(exitInterior(state)){hubCamera.reset();commit();}}else if(n?.action&&enterInterior(state,n.action)){hubCamera.reset();commit();}}
 if(action==='fast-map'){modal('Town Map · 방문한 장소',`<p>직접 찾아간 주요 장소에 빠르게 이동합니다.</p><div class="travel-list">${HUBS[f.hub].places.map(p=>frontierButton('fast-travel',`${p.name} ${f.visited[f.hub].includes(p.id)?'✓':'· 미방문'}`,p.id,!f.visited[f.hub].includes(p.id))).join('')}</div>`,'');}
 if(action==='fast-travel'){if(fastTravel(state,id)){closeModal();commit();}}
 if(action==='inventory')showInventory(id);
 if(action==='items')showItems();
 if(action==='hub-return'&&['warroom','deployment','exploration'].includes(state.screen)){closeModal();enterHub(state,{aftermath:f.phase==='aftermath',story:false});ui.menu=null;commit();}
 if(action==='aftermath'&&state.screen==='result'){closeModal();if(state.outcome==='defeat'){state=replay(state);enterHub(state,{story:false});}else{if(state.practice)state.economy=structuredClone(state.campaign.economy);enterHub(state,{aftermath:true});}ui.menu=null;ui.preview=null;renderer.clearPresentation();commit();}
 if(action==='buy-preview'){const type=id.split('|')[0];showPurchase(type,GEAR[type]?.heroes[0]);}
 if(action==='purchase-hero'){const [type,hero]=id.split('|');showPurchase(type,hero);}
 if(action==='shop-back')openShop(state.frontier.interior);
 if(action==='hub-zoom')hubCamera.zoomBy(id==='in'?1.15:1/1.15);
 if(action==='hub-focus')hubCamera.focus(f.x,f.y);
 if(action==='shop-exit'){const exit=currentHub(state).places.find(p=>p.action==='exit');if(exit){await walkToFrontier(exit.x,exit.y);if(exitInterior(state)){hubCamera.reset();commit();}}}
 if(action==='gear-info'){const [type,hero]=id.split('|');modal('Equipment Comparison',compareGear(type,hero),'');}
 if(action==='gear-compare'){const [instance,hero]=id.split('|'),g=state.economy.gear.find(a=>a.id===instance);if(g)modal('Equipment Comparison',compareGear(g.type,hero,instance),'');}
 if(action==='transaction')transactionPreview(id);
 if(action==='confirm-transaction'&&pendingTransaction){const req=pendingTransaction;pendingTransaction=null;const before=structuredClone(state),result=transact(state,req);if(result.ok){const saved=save();if(!saved.ok){state=before;closeModal();render();toast('거래를 적용하지 않았습니다. 저장이 실패하여 이전 자산을 유지합니다.');}else{closeModal();commit();if(state.frontier.interior)openShop(state.frontier.interior);toast('거래 완료 · 자산과 장비를 저장했습니다.');}}else toast(result.error);}
 if(action==='tool'){const t=TOOLS[id],u=findUnit(state,ui.selected);if(t&&canAct(state,u))modal('도구 사용',`<p>${u.name} · ${t.name}<br>${t.description}<br>보유 ${state.economy.items[id]} · 이동 후 사용 가능, 행동을 마칩니다.</p>`,frontierButton('tool-confirm','사용 확정',id,false,'primary'));}
 if(action==='tool-confirm'){closeModal();await execute(`tool:${id}`);}
 return true;
}

function offerAffiliation(){const candidate=state.frontier?.pendingRecruit;if(state.screen!=='exploration'||state.narrative.active||!candidate||$('#modal-root').children.length)return;if(state.frontier.affiliation[candidate]!=='encountered')return;modal('동료의 약속',`<p>${esc(SPEAKERS[candidate]?.ko)}의 협력을 받아들이겠습니까? 기존 다섯 명의 출전은 유지됩니다. 이 선택은 동료의 소속 기록을 남깁니다.</p>`,`<button class="primary" data-do="affiliate" data-id="${candidate}">함께한다</button><button data-do="close-modal">나중에 이야기</button>`);}

function persistUIPrefs(){try{storage.setItem('ashen-crown:ui:v1',JSON.stringify({speed:ui.speed,movement:ui.movement,reduced:ui.reduced,questClosed:ui.questClosed}));}catch{}}
function renderObjectives(){const f=state.frontier,explore=state.screen==='exploration',panel=$('#quest-panel');panel.hidden=!['exploration','battle','deployment'].includes(state.screen);const rescued=state.units.filter(u=>u.team==='civilian'&&u.rescued).length;$('#quest-content').innerHTML=explore?`<b>Main Quest</b><p>${f.interior?'상점 주인에게 다가가 준비하기 · 출구로 복귀':f.phase==='aftermath'?'동료들과 이야기하고 다음 작전 준비':'War Council에서 작전 확인'}</p><b>Optional</b><p>${f.events.some(k=>k.endsWith(':eric'))?'✓':'◇'} 에릭과 대화<br>${f.visited[f.hub].includes('forge')?'✓':'◇'} 무기점 방문<br>${f.visited[f.hub].includes('shop')?'✓':'◇'} 도구점 방문</p>`:`<b>Required</b><p>${esc(missionOf(state).objective)}</p><p>${state.missionId===2?'생포 '+(findUnit(state,'boss').rescued?'✓':'◇'):`구조 ${rescued}/${missionOf(state).civilians.length}`}${state.missionId===3?' · 남은 턴 '+Math.max(0,11-state.turn):''}</p><b>Optional</b><p>전원 생존 · ${missionOf(state).par}턴 이내${state.missionId===3?' · 주민 전원 구조':''}</p>`;}
function showPurchase(type,hero){const gear=GEAR[type];if(!gear)return;shopKind='weapon';const u=findUnit(state,hero);modal('장비 선택 → 장수 선택',`<div class="purchase-layout"><article><h3>${gear.icon} ${gear.name}</h3><p>${gear.description}</p><p>${gear.price} Gold · ${gear.slot}</p><p>사용 병종: ${gear.heroes.map(id=>findUnit(state,id).className).join(', ')}</p></article><div class="purchase-roster">${HEROES.map(h=>`<button data-do="purchase-hero" data-id="${type}|${h.id}" ${gear.heroes.includes(h.id)?'':'disabled'} class="${h.id===hero?'active':''}">${portrait(findUnit(state,h.id),'card-sprite')}<span>${h.name}<small>${h.className} · ${gear.heroes.includes(h.id)?'장착 가능':'병종 사용 불가'}</small></span></button>`).join('')}</div><article>${u?portrait(u)+`<h3>${u.name}</h3><p>${esc(equipmentLabel(state.economy,hero))}</p>`+compareGear(type,hero):''}</article></div>`,`<button class="primary" data-do="transaction" data-id="buy-gear|${type}|${hero}" ${!gear.heroes.includes(hero)||state.economy.gold<gear.price?'disabled':''}>${gear.price} Gold · 구매 및 장착 확인 →</button><button data-do="shop-back">취소 / 상품 목록</button>`);paintPortraits();}
function frontierFrame(time){const canvas=$('#frontier-map');if(canvas&&state.screen==='exploration')drawHub(canvas,state,{time:ui.reduced?0:time});const stage=$('#scene-stage');if(stage)drawHub(stage,state,{line:storyLine(state),time:ui.reduced?0:time});requestAnimationFrame(frontierFrame);}requestAnimationFrame(frontierFrame);
let hubDrag=null,hubPanUsed=false;
document.addEventListener('pointerdown',e=>{if(e.target.id==='frontier-map'&&(e.shiftKey||e.button===2)){hubDrag={x:e.clientX,y:e.clientY};e.preventDefault();}});
document.addEventListener('pointermove',e=>{if(hubDrag){hubPanUsed=true;hubCamera.panBy(e.clientX-hubDrag.x,e.clientY-hubDrag.y);hubDrag={x:e.clientX,y:e.clientY};}});
document.addEventListener('pointerup',()=>hubDrag=null);
document.addEventListener('contextmenu',e=>{if(e.target.id==='frontier-map')e.preventDefault();});
document.addEventListener('wheel',e=>{if(e.target.id==='frontier-map'){e.preventDefault();hubCamera.zoomBy(e.deltaY<0?1.08:1/1.08);}},{passive:false});

})();</script></body></html>
