function deserialize(text){if(typeof text!=='string'||text.length>5000000)throw Error('저장 크기가 올바르지 않습니다.');const envelope=JSON.parse(text);if(envelope.format!=='AshenCrown'||typeof envelope.data!=='string'||checksum(envelope.data)!==envelope.checksum)throw Error('저장 검증에 실패했습니다.');return migrate(JSON.parse(envelope.data));}

function heroDetail(u){return `<div class="hero-detail">${portrait(u)}<div><h3>${u.name} <span class="tag">LV ${u.level}</span></h3><p>${esc(u.description)}</p><p class="accent">${esc(u.talent)} · ${u.skill}</p></div></div>`;}
function render(){
 const battle=state.screen==='battle',deploy=state.screen==='deployment',u=findUnit(state,ui.selected);const rescued=state.units.filter(c=>c.rescued).length,boss=findUnit(state,'boss');
 $('#phasebar').innerHTML=`<span class="eyebrow">MISSION 01</span><span class="turn">${battle||state.screen==='result'?`TURN ${String(state.turn).padStart(2,'0')}`:'THE ASHEN VILLAGE'}</span><span class="phase-pill">${deploy?'FREE DEPLOYMENT':battle?`${state.phase.toUpperCase()} PHASE`:state.screen==='result'?state.outcome.toUpperCase():'FIRST BATTLE'}</span><div class="objectives"><span class="objective ${rescued===2?'done':''}">주민 ${rescued}/2 구출</span><span class="objective ${boss.hp<=0?'done':''}">산적 대장 격파${battle?` · HP ${boss.hp}/${boss.maxHP}`:''}</span></div>`;
 $('#map-label').innerHTML=battle||deploy?`<div class="eyebrow">BORDERLANDS · SOUTHERN APPROACH</div><h3>The Ashen Village</h3><p>${deploy?'남쪽의 푸른 영역에 장수를 자유 배치하세요.':state.turn<5?'TURN 5 전 주민 구출 권장 · 구출은 행동 1회':'주민이 직접 공격받습니다 · 즉시 구출하세요'}</p>`:'';
 $('#board-caption').textContent=battle?ui.busy?'적의 행동을 지켜보세요.':ui.preview?'예측을 확인한 뒤 행동을 확정하세요.':!u||u.acted?'다음 장수를 선택하거나 Phase를 종료하세요.':ui.mode==='move'?`${u.name} · 푸른 칸으로 이동. 이동 후에는 취소할 수 있습니다.`:ui.mode==='rescue'?'인접한 주민을 선택하세요.':ui.mode==='skill'?`${u.skill} · 유효한 대상을 선택하세요.`:'붉은 범위의 적을 선택해 공격을 예측하세요.':deploy?'장수 선택 → 남쪽 Tile 클릭 · 다른 장수 위치를 클릭하면 Swap':'';
 $('#logentries').innerHTML=state.log.slice(-18).map(l=>`<div>${esc(l)}</div>`).join('');$('#logentries').scrollTop=$('#logentries').scrollHeight;
 $('#rail').classList.toggle('open',ui.panel);$('#screen').innerHTML='';
 if(battle||deploy){renderRail(u,deploy);}else{renderScreen();$('#rail').innerHTML=`<div class="eyebrow">COMMANDER’S NOTES</div><h3 style="margin:13px 0">한 사람씩, 하나의 가능성</h3><p style="font-size:13px">다섯 장수의 역할을 연결하세요. 숲의 사수, 동료를 지키는 기사, 빠른 구출과 치유가 전장의 흐름을 바꿉니다.</p><div class="rule"></div><div class="eyebrow">MISSION OBJECTIVES</div><p style="font-size:12px;margin:10px 0">주민 2명 구출 + Garr 격파<br>선택 목표: 전원 생존 · 8턴 이내 · Eric의 단서</p><div class="rule"></div><div class="muted">완료한 미션: ${state.campaign.clears}회<br>v${VERSION} · 오리지널 픽셀 아트<br>오프라인 실행 · 로컬 저장</div><button class="small" data-do="help" style="margin-top:18px">조작과 전투 규칙</button>`;}
 paintPortraits();
}
function renderScreen(){const u=findUnit(state,ui.selected);let html='';
 if(state.screen==='title')html=`<div class="title-inner"><div class="eyebrow">AN ORIGINAL FANTASY TACTICAL RPG</div><h1>Ashen<br>Crown<span class="accent">.</span></h1><div class="subtitle">First Battle — The Ashen Village</div><p>재가 된 왕관 아래, 다섯 동료의 이야기가 시작됩니다.<br>당신의 선택은 전장을 바꾸고, 장수의 숨겨진 가능성을 깨웁니다.</p><div class="title-actions"><button class="primary" data-do="new">첫 전투 시작 →</button><button data-do="load" ${loaded.state||state.campaign.clears?'':'disabled'}>저장 불러오기</button><button data-do="help">플레이 안내</button></div><div class="title-bottom"><div>TACTICAL COMBAT<br><span class="accent">지형 · 사거리 · 협공</span></div><div>CHARACTER GROWTH<br><span class="accent">다섯 장수 · 서로 다른 역할</span></div><div>HIDDEN POTENTIAL<br><span class="accent">행동에서 발견하는 단서</span></div></div></div>`;
 else if(state.screen==='intro')html=`<div class="screen-inner"><div class="eyebrow">PROLOGUE · THE BORDERLANDS</div><h2>불길 너머의 약속</h2><div class="story">왕국이 무너진 지 세 번째 겨울.<br>국경의 작은 마을마저 산적 Garr의 손에 불타고 있다.<br><br>Eric은 닳은 방패를 들었다.<br>“왕관은 잃었어도, 지킬 사람은 아직 남아 있어.”<br><br>숲의 사수 Elina, 서툰 마법사 Lia, 치유사 Sain,<br>그림자처럼 빠른 Kai가 그의 곁에 섰다.</div><button class="primary" data-do="warroom">동료들과 전투 준비 →</button></div>`;
 else if(state.screen==='warroom')html=`<div class="screen-inner"><div class="eyebrow">WAR ROOM · PREPARE YOUR COMPANY</div><h2>누가 선두에 설 것인가?</h2><p class="muted" style="margin-top:10px">장수를 눌러 고유 능력을 확인하세요. 이번 미션에는 다섯 명 모두 출전합니다.</p><div class="hero-cards">${heroCards()}</div>${heroDetail(u)}<div class="row"><span class="muted spacer">12×10 전장 · 7명의 산적 · 2명의 주민<br>회복약 2개 · 전투불능 장수는 승리 후 복귀</span><button class="primary" data-do="deploy">자유 배치 시작 →</button></div></div>`;
 else if(state.screen==='result'){
 const victory=state.outcome==='victory',last=state.campaign.results.at(-1);
 html=`<div class="screen-inner"><div class="eyebrow">MISSION 01 · GROWTH JOURNAL</div><div class="result-head"><h2>${victory?'Village Saved':'A Costly Lesson'}</h2><span class="muted">TURN ${state.turn}<br>${victory?'VICTORY':'DEFEAT'} · 주민 ${last.rescued}/2</span></div><p style="font-size:13px;margin-top:12px">${esc(state.reason)}</p><div class="badges"><span class="badge ${last.allAlive?'':'failed'}">${last.allAlive?'✓':'◇'} 전원 생존</span><span class="badge ${last.swift&&victory?'':'failed'}">${last.swift&&victory?'✓':'◇'} 8턴 이내 승리</span><span class="badge ${last.potential?'':'failed'}">${last.potential?'✓':'◇'} Guardian’s Oath 단서</span></div><div class="growth-list">${HEROES.map(h=>{const a=findUnit(state,h.id),start=state.missionStart.find(m=>m.id===a.id);const gains=a.growthHistory.filter(g=>g.level>start.level);return `<article class="growth-card" data-growth="${a.id}"><div class="row"><h3>${a.name}</h3><span class="gain">+${a.earnedXP} EXP · LV ${start.level} → ${a.level}</span></div><p>${gains.length?`성장: HP +${a.maxHP-start.stats.maxHP} · ATK +${a.atk-start.stats.atk} · DEF +${a.def-start.stats.def} · MAG +${a.mag-start.stats.mag}`:'이번 전투의 경험이 다음 성장을 준비합니다.'}</p><p>${esc([...new Set(a.highlights)].slice(-3).join(' · ')||'동료와 함께 첫 전장을 경험했습니다.')}${a.hp===0?' · 전투불능':''}</p><p class="accent">${a.clues.length?`Potential: ${esc(a.clues.join(', '))} (1/3)`:'숨겨진 잠재력은 아직 발견되지 않았습니다.'}</p><p class="goal">다음 성장 목표 · ${esc(h.goal)}</p></article>`;}).join('')}</div><div class="row"><button class="primary" data-do="replay">${victory?'성장한 군단으로 다시 출전':'전투 전 성장으로 재도전'} →</button><button data-do="fresh-replay">LV 초기 상태로 연습</button><button data-do="backup">텍스트 백업</button></div><p class="muted" style="margin-top:13px">${victory?'성장한 장수와 결과가 저장되었습니다.':'패배 기록을 저장했습니다. 재도전은 이번 전투 시작 전 성장 상태로 돌아갑니다.'} v0.1에는 첫 전투만 포함됩니다.</p></div>`;
 }
 $('#screen').innerHTML=`<div class="screen-overlay ${state.screen==='result'?'result-overlay':''}">${html}</div>`;
}
function renderRail(u,deploy){const active=canAct(state,u)&&!ui.busy;const chips=HEROES.map(h=>{const a=findUnit(state,h.id);return `<button class="hero-chip ${ui.selected===a.id?'selected':''} ${a.acted||!alive(a)?'done':''}" data-do="select" data-id="${a.id}" aria-label="장수 ${a.name}">${portrait(a,'chip-sprite')}${a.name}</button>`;}).join('');
 let html=`<div class="row"><span class="eyebrow">${deploy?'DEPLOY YOUR HEROES':'HERO & COMMAND'}</span><button class="small mobile-toggle" data-do="panel">닫기</button></div><div class="hero-list">${chips}</div>`;
 if(!u){$('#rail').innerHTML=html;return;}
 html+=`<div class="portrait-box">${portrait(u)}<div><div class="hero-name">${u.name} <span class="tag">LV ${u.level||'—'}</span></div><div class="hero-class">${esc(u.className||u.kind)}<br>${u.team.toUpperCase()} · ${u.team==='ally'?(u.acted?'행동 완료':u.moved?'이동 완료':'이동 / 행동 가능'):'위협을 확인하세요'}</div></div></div><div class="bars">${bar('HP',u.hp,u.maxHP)}${u.maxMP?bar('MP',u.mp,u.maxMP,'mp'):''}${u.team==='ally'?bar('XP',u.xp,100,'xp'):''}</div><div class="stats">${['atk','def','mag','res','spd','mov'].map(k=>`<div>${k.toUpperCase()}<strong>${u[k]+(k==='mov'?(u.shadowBonus||0):0)}</strong></div>`).join('')}<div>RNG<strong>${u.range.join('–')}</strong></div><div>EXP<strong>${u.earnedXP||0}</strong></div></div>`;
 if(u.team==='ally')html+=`<div class="talent"><div class="eyebrow">${esc(u.talent)}</div><p>${esc(u.description)}</p></div>`;
 if(deploy){html+=`<p class="next-action">선택한 장수를 남쪽 푸른 Tile로 배치하세요. 기존 장수 Tile을 선택하면 서로 자리를 바꿉니다.</p><div class="commands"><button data-do="preset" data-id="recommended">추천 배치</button><button data-do="preset" data-id="assault">공격 중심</button><button data-do="preset" data-id="defense">방어 중심</button><button data-do="warroom">장수 확인</button><button class="primary wide" data-do="start-battle">전투 시작 →</button></div>`;}
 else if(u.team==='ally'){
 html+=`<div class="commands"><button data-do="mode" data-id="move" class="${ui.mode==='move'?'active':''}" ${!active||u.moved?'disabled':''}>1 · 이동<span>MOV ${u.mov+(u.shadowBonus||0)}</span></button><button data-do="mode" data-id="attack" class="${ui.mode==='attack'?'active':''}" ${!active?'disabled':''}>2 · 공격<span>사거리 ${u.range.join('–')}</span></button><button data-do="mode" data-id="skill" class="${ui.mode==='skill'?'active':''}" ${!active||u.mp<skillCost(u)?'disabled':''}>3 · ${u.skill}<span>${skillCost(u)} MP</span></button><button data-do="mode" data-id="rescue" class="${ui.mode==='rescue'?'active':''}" ${!active?'disabled':''}>4 · 주민 구출<span>인접 Tile · 행동 1회</span></button><button data-do="undo" ${!active||!state.undo[u.id]?'disabled':''}>Z · 이동 취소</button><button data-do="wait" ${!active?'disabled':''}>W · 대기</button><button data-do="item" ${!active||!state.potions||u.hp===u.maxHP?'disabled':''}>회복약<span>+20 HP · ${state.potions}개</span></button><button data-do="next" ${ui.busy?'disabled':''}>Tab · 다음 장수</button></div>`;
 if(ui.preview){const t=findUnit(state,ui.preview),f=forecast(state,u,t,ui.mode);html+=`<div class="forecast"><div class="eyebrow">ACTION FORECAST</div><h3 style="margin-top:6px">${esc(t.name)}</h3><dl><dt>${f.heal!==undefined?'회복량':f.guard===true?'보호 효과':f.rescue?'구출':'예상 피해'}</dt><dd>${f.heal!==undefined?`+${f.heal} HP`:f.guard===true?'첫 근접 공격 대행':f.rescue?'안전 지대로 대피':`${f.damage} HP`}</dd><dt>명중률</dt><dd>${f.hit}%</dd><dt>반격 피해</dt><dd>${f.counter} HP${f.counter?` · ${f.counterHit}%`:''}</dd><dt>${f.guard&&f.guard!==true?'Guard 대상 예상 HP':'대상 예상 HP'}</dt><dd>${f.after}/${f.victim?findUnit(state,f.victim).maxHP:t.maxHP}</dd>${f.crit?`<dt>Critical 확률</dt><dd>${f.crit}% · 피해 +50%</dd>`:''}${f.flank?'<dt>Quick Strike</dt><dd>협공 +6 적용</dd>':''}</dl><p class="muted">기본 피해 기준의 예측입니다. Miss 또는 Critical로 결과가 달라질 수 있습니다.</p><div class="row"><button class="primary" data-do="confirm">행동 확정</button><button data-do="cancel">취소</button></div></div>`;}
 else html+=`<div class="next-action">${active?ui.mode==='move'?'푸른 칸을 클릭해 이동하세요. 장수의 행동 순서는 자유입니다.':ui.mode==='rescue'?'주민 옆으로 이동한 뒤 주민을 클릭하세요.':`전장의 대상을 클릭하면 ${ui.mode==='skill'?u.skill:'공격'} 결과를 미리 확인합니다.`:'행동을 마친 장수는 어둡게 표시됩니다. 다음 동료를 선택하세요.'}</div>`;
 }
 if(!deploy){html+=`<footer><div class="row"><span class="muted">Animation</span><select class="speed" id="animation-speed" aria-label="애니메이션 속도"><option value="1" ${ui.speed===1?'selected':''}>1×</option><option value="2" ${ui.speed===2?'selected':''}>2×</option><option value="4" ${ui.speed===4?'selected':''}>4×</option></select><button class="small" data-do="help">?</button></div><button class="primary" style="width:100%;margin-top:12px" data-do="end-phase" ${ui.busy||state.phase!=='player'?'disabled':''}>E · Player Phase 종료 →</button>${state.turn===2?'<div class="notice">TURN 3 · 북쪽 모서리에서 증원 2명. 출현 후 먼저 행동할 기회가 있습니다.</div>':state.turn>=4?'<div class="notice">TURN 5부터 주민이 직접 공격받습니다. 인접 장수로 구출하세요.</div>':''}</footer>`;}
 $('#rail').innerHTML=html;
}
function modal(title,body,actions){$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${body}<div class="row">${actions}<button data-do="close-modal">닫기</button></div></section></div>`;$('#modal-root button')?.focus();}
function closeModal(){$('#modal-root').innerHTML='';$('#battle-map').focus({preventScroll:true});}
const help=()=>modal('전투 안내',`<p><b>목표:</b> 주민 2명 구출 + 산적 대장 Garr 격파. 주민 한 명이라도 사망하거나 아군이 전멸하면 패배합니다.</p><p><b>조작:</b> 장수 → 푸른 칸 이동 → 공격/스킬 → 대상 → 예측 → 행동 확정. 유닛당 이동 1회와 행동 1회. 공격·스킬·구출·약·대기는 행동을 마칩니다. 행동 전 이동은 Z로 취소할 수 있습니다.</p><p><b>지형:</b> Grass / Road 이동 비용 1. Forest 비용 2, DEF +1 / 회피 +12%; Kai는 숲 비용 1. Village DEF +2. Ruin은 통과 불가. 사거리는 직교 거리입니다. 건물이나 숲이 사격을 차단하지 않습니다.</p><p><b>스킬:</b> Guard는 인접 동료를 보호하며, Eric이 그 동료 옆에 있을 때 첫 인접 근접 피해를 대신 받습니다. Fire Bolt는 RES를 적용합니다. Heal은 자기 회복 가능. Quick Strike의 협공은 적 반대편 인접 아군이 있어야 성립합니다.</p><p><b>이벤트:</b> TURN 3 증원, TURN 5 주민 공격 시작. 주민 옆에서 구출 행동. 마법에도 기본 공격 사거리 내에서는 반격 가능. 반격에 대한 재반격은 없습니다.</p><p><b>키:</b> 1 이동 · 2 공격 · 3 스킬 · 4 구출 · Z 취소 · W 대기 · Tab 다음 장수 · E Phase 종료 · Escape 취소. 휠 Zoom, 우클릭/Shift 드래그 Pan. Touch는 탭과 드래그 Pan 지원.</p><p>로컬 저장은 현재 브라우저와 파일 경로에 연결됩니다. 파일을 옮기거나 다른 브라우저를 사용하기 전 텍스트 백업을 권장합니다. 초기화는 메뉴에서 직접 확인합니다.</p>`,'');
function nextHero(){const ids=HEROES.map(h=>h.id),start=ids.indexOf(ui.selected);for(let i=1;i<=5;i++){const u=findUnit(state,ids[(start+i)%5]);if(canAct(state,u)){ui.selected=u.id;ui.mode='move';ui.preview=null;render();return;}}ui.preview=null;render();}
async function effects(){renderer.addEffects(state.feedback,450/ui.speed);const potential=state.feedback.find(e=>e.type==='potential');if(potential){const u=findUnit(state,potential.id);toast(`${u.name} · Potential Clue Discovered — ${u.clues.at(-1)} (1/3)`);}await new Promise(r=>setTimeout(r,state.feedback.some(e=>e.type==='move')?Math.max(220,...state.feedback.filter(e=>e.type==='move').map(e=>450/ui.speed*(e.path.length-1)*.45)):500/ui.speed));}
async function enemyLoop(){if(enemyRunning)return;enemyRunning=true;ui.busy=true;render();try{while(state.phase==='enemy'&&state.screen==='battle'){advanceEnemy(state);save();render();await effects();}ui.preview=null;if(!canAct(state,findUnit(state,ui.selected)))ui.selected=HEROES.find(h=>alive(findUnit(state,h.id)))?.id||'eric';ui.mode='move';}finally{ui.busy=false;enemyRunning=false;commit();}}
async function execute(mode,target){if(ui.busy)return;const r=performAction(state,ui.selected,mode,target);if(!r.ok){toast(r.error);return;}ui.preview=null;ui.busy=true;save();render();await effects();ui.busy=false;if(state.screen==='battle')nextHero();commit();}
async function dispatch(action,id){if(ui.busy&&!['panel','zoom-in','zoom-out','reset-camera','help','close-modal'].includes(action))return;
 switch(action){
 case 'new':state=newGame(state.initialSeed,state.campaign);ui.selected='eric';setScreen('intro');break;
 case 'warroom':setScreen('warroom');break;case 'deploy':setScreen('deployment');break;
 case 'select':{const u=findUnit(state,id);if(!u||u.team!=='ally'||state.screen==='battle'&&!alive(u))break;ui.selected=id;ui.mode='move';ui.preview=null;render();break;}
 case 'preset':presetDeployment(state,id);commit();break;
 case 'start-battle':if(startBattle(state)){ui.mode='move';ui.panel=false;commit();toast('주민 2명 구출 + Garr 격파. 먼저 남쪽 산적을 저지하세요.');}break;
 case 'mode':if(canAct(state,findUnit(state,ui.selected))){ui.mode=id;ui.preview=null;render();}break;
 case 'undo':if(undoMove(state,ui.selected)){ui.mode='move';ui.preview=null;commit();}break;
 case 'wait':await execute('wait');break;case 'item':await execute('item');break;
 case 'confirm':if(ui.preview)await execute(ui.mode,ui.preview);break;
 case 'cancel':ui.preview=null;ui.mode='move';render();break;
 case 'next':nextHero();break;
 case 'end-phase':{const n=state.units.filter(u=>canAct(state,u)).length;if(n)modal('Phase를 종료할까요?',`<p>아직 행동 가능한 장수가 ${n}명 있습니다. 남은 행동을 포기하고 적 Phase로 넘어갑니다.</p>`,'<button class="primary" data-do="confirm-phase">적 Phase 진행</button>');else if(beginEnemyPhase(state)){save();await enemyLoop();}break;}
 case 'confirm-phase':closeModal();if(beginEnemyPhase(state)){save();await enemyLoop();}break;
 case 'replay':case 'fresh-replay':state=replay(state,action==='fresh-replay');state.screen='warroom';ui.selected='eric';ui.mode='move';ui.preview=null;renderer.reset();commit();break;
 case 'save':if(save().ok)toast('전투·성장·RNG 상태를 저장했습니다.');break;
 case 'load':{const r=loadGame(storage);if(r.state){state=r.state;ui.preview=null;ui.mode='move';ui.selected='eric';closeModal();render();if(r.warning)toast(r.warning);if(state.phase==='enemy'&&state.screen==='battle')enemyLoop();}else toast(r.warning||'저장이 없습니다.');break;}
 case 'menu':modal('Command Menu','<p>전투는 자동 저장됩니다. 텍스트 백업은 다른 파일 경로와 브라우저에서도 복원할 수 있습니다.</p>','<button data-do="load">저장 불러오기</button><button data-do="backup">백업 / 복원</button><button data-do="help">플레이 안내</button><button class="danger" data-do="reset">전체 저장 초기화</button>');break;
 case 'backup':modal('텍스트 백업 / 복원','<p>아래 텍스트를 복사해 보관하세요. 복원하려면 저장 텍스트를 붙여넣고 검증 후 복원을 누릅니다.</p><textarea id="backup-text" aria-label="저장 백업 텍스트"></textarea>','<button data-do="copy-backup">전체 선택 / 복사</button><button class="primary" data-do="restore">검증 후 복원</button>');$('#backup-text').value=serialize(state);break;
 case 'copy-backup':$('#backup-text').select();try{await navigator.clipboard.writeText($('#backup-text').value);toast('백업 텍스트를 복사했습니다.');}catch{toast('전체 선택했습니다. Ctrl+C 또는 길게 눌러 복사하세요.');}break;
 case 'restore':try{const restored=deserialize($('#backup-text').value);state=restored;ui.selected='eric';ui.preview=null;closeModal();commit();toast('검증한 저장을 복원했습니다.');if(state.phase==='enemy'&&state.screen==='battle')enemyLoop();}catch(e){toast(`복원 실패: ${e.message}. 현재 진행 상태를 유지합니다.`);}break;
 case 'reset':modal('모든 저장을 초기화할까요?','<p>장수 성장, 전투와 결과 기록을 삭제합니다. 먼저 텍스트 백업을 보관할 수 있습니다.</p>','<button data-do="backup">먼저 백업</button><button class="danger" data-do="confirm-reset">모든 저장 삭제</button>');break;
 case 'confirm-reset':{const r=resetSave(storage);if(!r.ok){toast(`초기화 실패: ${r.error}`);break;}state=newGame();ui.selected='eric';ui.preview=null;closeModal();render();toast('저장을 초기화했습니다.');break;}
 case 'help':help();break;case 'close-modal':closeModal();break;
 case 'panel':ui.panel=!ui.panel;$('#rail').classList.toggle('open',ui.panel);break;
 case 'zoom-in':renderer.zoomBy(1.15);break;case 'zoom-out':renderer.zoomBy(1/1.15);break;case 'reset-camera':renderer.reset();break;
 }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-do]');if(b&&!b.disabled)dispatch(b.dataset.do,b.dataset.id);});
document.addEventListener('change',e=>{if(e.target.id==='animation-speed')ui.speed=Number(e.target.value);});
const canvas=$('#battle-map');let pointer=null;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();renderer.zoomBy(e.deltaY<0?1.08:1/1.08);},{passive:false});
canvas.addEventListener('pointerdown',e=>{pointer={id:e.pointerId,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,drag:false,pan:e.button===2||e.shiftKey||e.pointerType==='touch'};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{const b=canvas.getBoundingClientRect(),tile=renderer.tileAt(e.clientX-b.left,e.clientY-b.top);ui.hover=tile;const t=terrainAt(tile.x,tile.y),unit=at(state,tile.x,tile.y);$('#terrain-readout').textContent=t?`${t.name} · 비용 ${Number.isFinite(t.cost)?t.cost:'불가'} · DEF +${t.defense}${t.evade?` · 회피 +${t.evade}%`:''}${unit?` · ${unit.name} ${unit.hp} HP`:''}`:'전장 밖';if(pointer&&pointer.id===e.pointerId&&pointer.pan){if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>7)pointer.drag=true;if(pointer.drag){renderer.pan.x+=e.clientX-pointer.lastX;renderer.pan.y+=e.clientY-pointer.lastY;renderer.clampPan();}}if(pointer){pointer.lastX=e.clientX;pointer.lastY=e.clientY;}});
canvas.addEventListener('pointerup',async e=>{if(!pointer||pointer.id!==e.pointerId)return;const p=pointer;pointer=null;if(p.drag||e.button===2||ui.busy)return;const b=canvas.getBoundingClientRect(),tile=renderer.tileAt(e.clientX-b.left,e.clientY-b.top),t=at(state,tile.x,tile.y),u=findUnit(state,ui.selected);
 if(state.screen==='deployment'){if(setDeployment(state,ui.selected,tile.x,tile.y))commit();else toast('남쪽 배치 영역의 유효한 Tile을 선택하세요.');return;}
 if(state.screen!=='battle'||state.phase!=='player')return;
 if(canAct(state,u)&&['attack','skill','rescue'].includes(ui.mode)&&t&&validTarget(state,u,t,ui.mode)){ui.preview=t.id;ui.panel=true;render();return;}
 if(t?.team==='ally'){ui.selected=t.id;ui.mode='move';ui.preview=null;render();return;}
 if(ui.mode==='move'&&canAct(state,u)&&!u.moved){state.feedback=[];const path=moveUnit(state,u.id,tile.x,tile.y);if(path){ui.preview=null;ui.busy=true;save();render();await effects();ui.busy=false;ui.mode='attack';render();}else if(t?.team==='enemy'){ui.mode='attack';ui.preview=validTarget(state,u,t)?t.id:null;ui.panel=true;render();}else toast('지형 비용, 이동력과 점유 상태를 확인하세요.');return;}
 if(t?.team==='enemy'){ui.selected=t.id;ui.preview=null;ui.panel=true;render();}
});
canvas.addEventListener('pointercancel',()=>pointer=null);
document.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT','SELECT'].includes(document.activeElement?.tagName))return;if($('#modal-root').children.length){if(e.key==='Escape')closeModal();return;}const actions={'1':['mode','move'],'2':['mode','attack'],'3':['mode','skill'],'4':['mode','rescue'],z:['undo'],w:['wait'],e:['end-phase'],Tab:['next'],Escape:['cancel']};const a=actions[e.key]||actions[e.key.toLowerCase()];if(a&&state.screen==='battle'){e.preventDefault();dispatch(...a);}});
render();if(loaded.warning)toast(loaded.warning);if(state.screen==='battle'&&state.phase==='enemy')enemyLoop();
// Read-only diagnostics for QA and reproducibility. No state injection or win shortcut.
window.AshenCrown=Object.freeze({version:VERSION,snapshot:()=>structuredClone(state),view:()=>({selected:ui.selected,mode:ui.mode,busy:ui.busy,zoom:renderer.zoom}),tileCenter:(x,y)=>renderer.tileCenter(x,y)});

})();</script></body></html>
