function contextMessage(s,u,ui){

 if(u.acted)return '행동 완료 · 다른 장수를 누르거나 턴을 종료하세요.';

function renderDock(s,ui,esc,portrait,bar){
 const u=findUnit(s,ui.selected)||findUnit(s,'eric'),deploy=s.screen==='deployment',active=canAct(s,u)&&!ui.busy;
 const command=(action,label,extra='',disabled=false,id='',klass='')=>`<button data-do="${action}" ${id?`data-id="${id}"`:''} class="${klass} ${action==='mode'&&ui.mode===id?'active':''}" ${disabled?'disabled':''}>${label}${extra?`<small>${extra}</small>`:''}</button>`;
 let commands=deploy?command('mode','배치 이동','남쪽 영역',false,'deploy')+command('preset','추천 배치','',false,'recommended')+command('preset','공격 중심','',false,'assault')+command('preset','방어 중심','',false,'defense')+command('start-battle','전투 시작 →','',false,'','primary'):
 command('mode','이동',`${u.mov+(u.shadowBonus||0)} MOV`,!active||u.moved,'move')+command('mode','공격',`${u.range.join('–')}칸`,!active,'attack')+command('mode',u.skill,`${skillCost(u)} MP`,!active||u.mp<skillCost(u),'skill')+command('wait','대기','행동 종료',!active)+command('mode','주민 구출','인접 1칸',!active,'rescue')+command('undo','이동 취소','',!active||!s.undo[u.id])+command('item','회복약',`${s.potions}개 · +20 HP`,!active||!s.potions||u.hp===u.maxHP)+command('next','다음 장수','',ui.busy);
 let context=`<div class="dock-hint" role="status">${esc(contextMessage(s,u,ui))}</div>`;
 if(ui.inspected){const t=findUnit(s,ui.inspected);if(t)context=`<div class="dock-hint">${esc(t.name)} · HP ${t.hp}/${t.maxHP} · ${ui.notice||'현재 공격 사거리 밖입니다. 이동 또는 다른 장수의 공격을 선택하세요.'}</div>`;}
 if(ui.preview){const t=findUnit(s,ui.preview),f=forecast(s,u,t,ui.mode);context=`<div class="forecast dock-forecast"><div class="forecast-values"><strong>${esc(t.name)}</strong><span>${f.heal!==undefined?'회복':f.guard===true?'Guard':f.rescue?'구출':'피해'} <b>${f.heal!==undefined?`+${f.heal}`:f.guard===true?'근접 보호':f.rescue?'안전 대피':f.damage}</b></span><span>명중 <b>${f.hit}%</b></span><span>반격 <b>${f.counter}</b></span><span>예상 HP <b>${f.after}/${f.victim?findUnit(s,f.victim).maxHP:t.maxHP}</b></span>${f.flank?'<span>협공 <b>+6</b></span>':''}</div><div class="forecast-buttons">${command('confirm','행동 확정','',ui.busy,'','primary')}${command('cancel','취소')}</div><span class="forecast-note">${f.crit?`Critical ${f.crit}% · `:''}기본 피해 예측. Miss와 Critical에 따라 달라질 수 있습니다.</span></div>`;}
 if(ui.phaseConfirm)context=`<div class="phase-confirm"><strong>아직 행동 가능한 장수가 ${s.units.filter(u=>canAct(s,u)).length}명 있습니다.</strong><span>남은 행동을 포기하고 적 Phase로 넘어갈까요?</span>${command('confirm-phase','적 Phase 진행','',false,'','primary')}${command('cancel','계속 행동')}</div>`;
 const roster=deploy?`<div class="deploy-roster">${HEROES.map(h=>`<button data-do="select" data-id="${h.id}" class="${ui.selected===h.id?'active':''}">${h.name}</button>`).join('')}</div>`:'';
 return `<div class="dock-identity">${portrait(u,'dock-portrait')}<div class="dock-vitals"><div class="dock-name"><strong>${u.name}</strong><span>LV ${u.level||'—'} · ${u.role||u.kind}</span></div>${bar('HP',u.hp,u.maxHP)}${bar('MP',u.mp,u.maxMP,'mp')}<div class="dock-talent">${esc(u.talent||'')} ${u.clues?.length?'· Potential 1/3':''}</div></div></div><div class="dock-workspace">${roster}<div class="dock-context">${context}</div><div class="dock-commands">${commands}</div></div><div class="dock-utilities"><span class="dock-state">${deploy?'FREE DEPLOYMENT':ui.busy?'ENEMY PHASE':u.acted?'ACTION COMPLETE':u.moved?'MOVED · ACTION READY':'READY'}</span><div class="utility-buttons"><select class="speed" id="animation-speed" aria-label="애니메이션 속도">${[1,2,4].map(v=>`<option value="${v}" ${ui.speed===v?'selected':''}>${v}×</option>`).join('')}</select><button data-do="journal" class="small">기록</button><button data-do="help" class="small">?</button>${deploy?'':command('end-phase','턴 종료 →','',ui.busy||s.phase!=='player','','primary')}</div></div>`;
}

 const battle=state.screen==='battle',deploy=state.screen==='deployment',u=findUnit(state,ui.selected);const rescued=state.units.filter(c=>c.rescued).length,boss=findUnit(state,'boss');

function modal(title,body,actions){$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${body}<div class="row">${actions}<button data-do="close-modal">닫기</button></div></section></div>`;$('#modal-root button')?.focus();}
function closeModal(){$('#modal-root').innerHTML='';$('#battle-map').focus({preventScroll:true});}
const help=()=>modal('전투 안내',`<p><b>목표:</b> 주민 2명 구출 + 산적 대장 Garr 격파. 주민 한 명이라도 사망하거나 아군이 전멸하면 패배합니다.</p><p><b>조작:</b> 장수 → 푸른 칸 이동 → 공격/스킬 → 대상 → 예측 → 행동 확정. 유닛당 이동 1회와 행동 1회. 공격·스킬·구출·약·대기는 행동을 마칩니다. 행동 전 이동은 Z로 취소할 수 있습니다.</p><p><b>지형:</b> Grass / Road 이동 비용 1. Forest 비용 2, DEF +1 / 회피 +12%; Kai는 숲 비용 1. Village DEF +2. Ruin은 통과 불가. 사거리는 직교 거리입니다. 건물이나 숲이 사격을 차단하지 않습니다.</p><p><b>스킬:</b> Guard는 인접 동료를 보호하며, Eric이 그 동료 옆에 있을 때 첫 인접 근접 피해를 대신 받습니다. Fire Bolt는 RES를 적용합니다. Heal은 자기 회복 가능. Quick Strike의 협공은 적 반대편 인접 아군이 있어야 성립합니다.</p><p><b>이벤트:</b> TURN 3 증원, TURN 5 주민 공격 시작. 주민 옆에서 구출 행동. 마법에도 기본 공격 사거리 내에서는 반격 가능. 반격에 대한 재반격은 없습니다.</p><p><b>키:</b> 1 이동 · 2 공격 · 3 스킬 · 4 구출 · Z 취소 · W 대기 · Tab 다음 장수 · E Phase 종료 · Escape 취소. 휠 Zoom, 우클릭/Shift 드래그 Pan. Touch는 탭과 드래그 Pan 지원. 선택한 장수의 얼굴과 HP/MP, 명령은 하단에 항상 표시됩니다. 이동을 선택한 뒤 같은 Tile을 누르면 제자리에서 행동합니다.</p><p>로컬 저장은 현재 브라우저와 파일 경로에 연결됩니다. 파일을 옮기거나 다른 브라우저를 사용하기 전 텍스트 백업을 권장합니다. 초기화는 메뉴에서 직접 확인합니다.</p>`,'');
function nextHero(){const ids=HEROES.map(h=>h.id),start=ids.indexOf(ui.selected);for(let i=1;i<=5;i++){const u=findUnit(state,ids[(start+i)%5]);if(canAct(state,u)){ui.selected=u.id;ui.mode='choose';ui.preview=null;ui.notice=null;ui.inspected=null;render();return;}}ui.preview=null;render();}
async function effects(){renderer.addEffects(state.feedback,450/ui.speed);const potential=state.feedback.find(e=>e.type==='potential');if(potential){const u=findUnit(state,potential.id);toast(`${u.name} · Potential Clue Discovered — ${u.clues.at(-1)} (1/3)`);}await new Promise(r=>setTimeout(r,state.feedback.some(e=>e.type==='move')?Math.max(220,...state.feedback.filter(e=>e.type==='move').map(e=>450/ui.speed*(e.path.length-1)*.45)):500/ui.speed));}
async function enemyLoop(){if(enemyRunning)return;enemyRunning=true;ui.busy=true;render();try{while(state.phase==='enemy'&&state.screen==='battle'){advanceEnemy(state);save();render();await effects();}ui.preview=null;if(!canAct(state,findUnit(state,ui.selected)))ui.selected=HEROES.find(h=>alive(findUnit(state,h.id)))?.id||'eric';ui.mode='choose';}finally{ui.busy=false;enemyRunning=false;commit();}}
async function execute(mode,target){if(ui.busy)return;const r=performAction(state,ui.selected,mode,target);if(!r.ok){toast(r.error);return;}ui.preview=null;ui.notice=null;ui.inspected=null;ui.phaseConfirm=false;ui.busy=true;save();render();await effects();ui.busy=false;if(state.screen==='battle')nextHero();commit();}
async function dispatch(action,id){if(ui.busy&&!['journal','zoom-in','zoom-out','reset-camera','help','close-modal'].includes(action))return;
 switch(action){
 case 'new':state=newGame(state.initialSeed,state.campaign);ui.selected='eric';setScreen('intro');break;
 case 'warroom':setScreen('warroom');break;case 'deploy':setScreen('deployment');break;
 case 'select':{const u=findUnit(state,id);if(!u||u.team!=='ally'||state.screen==='battle'&&!alive(u))break;ui.selected=id;ui.mode=initialMode(u);ui.preview=null;ui.notice=null;ui.inspected=null;ui.phaseConfirm=false;render();break;}
 case 'preset':presetDeployment(state,id);commit();break;
 case 'start-battle':if(startBattle(state)){ui.mode='choose';ui.notice=null;commit();toast('주민 2명 구출 + Garr 격파. 먼저 남쪽 산적을 저지하세요.');}break;
 case 'mode':if(canAct(state,findUnit(state,ui.selected))||state.screen==='deployment'){ui.mode=id;ui.preview=null;ui.notice=null;ui.inspected=null;ui.phaseConfirm=false;render();}break;
 case 'undo':if(undoMove(state,ui.selected)){ui.mode='choose';ui.preview=null;commit();}break;
 case 'wait':await execute('wait');break;case 'item':await execute('item');break;
 case 'confirm':if(ui.preview)await execute(ui.mode,ui.preview);break;
 case 'cancel':ui.preview=null;ui.mode='choose';ui.notice=null;ui.inspected=null;ui.phaseConfirm=false;render();break;
 case 'next':nextHero();break;
 case 'end-phase':{const n=state.units.filter(u=>canAct(state,u)).length;if(n){ui.phaseConfirm=true;ui.preview=null;render();}else if(beginEnemyPhase(state)){save();await enemyLoop();}break;}
 case 'confirm-phase':ui.phaseConfirm=false;if(beginEnemyPhase(state)){save();await enemyLoop();}break;
 case 'replay':case 'fresh-replay':state=replay(state,action==='fresh-replay');state.screen='warroom';ui.selected='eric';ui.mode='choose';ui.preview=null;renderer.reset();commit();break;
 case 'save':if(save().ok)toast('전투·성장·RNG 상태를 저장했습니다.');break;
 case 'load':{const r=loadGame(storage);if(r.state){state=r.state;ui.phaseConfirm=false;ui.notice=null;ui.inspected=null;ui.preview=null;ui.mode='choose';ui.selected='eric';closeModal();render();if(r.warning)toast(r.warning);if(state.phase==='enemy'&&state.screen==='battle')enemyLoop();}else toast(r.warning||'저장이 없습니다.');break;}
 case 'menu':modal('Command Menu','<p>전투는 자동 저장됩니다. 텍스트 백업은 다른 파일 경로와 브라우저에서도 복원할 수 있습니다.</p>','<button data-do="load">저장 불러오기</button><button data-do="backup">백업 / 복원</button><button data-do="help">플레이 안내</button><button class="danger" data-do="reset">전체 저장 초기화</button>');break;
 case 'backup':modal('텍스트 백업 / 복원','<p>아래 텍스트를 복사해 보관하세요. 복원하려면 저장 텍스트를 붙여넣고 검증 후 복원을 누릅니다.</p><textarea id="backup-text" aria-label="저장 백업 텍스트"></textarea>','<button data-do="copy-backup">전체 선택 / 복사</button><button class="primary" data-do="restore">검증 후 복원</button>');$('#backup-text').value=serialize(state);break;
 case 'copy-backup':$('#backup-text').select();try{await navigator.clipboard.writeText($('#backup-text').value);toast('백업 텍스트를 복사했습니다.');}catch{toast('전체 선택했습니다. Ctrl+C 또는 길게 눌러 복사하세요.');}break;
 case 'restore':try{const restored=deserialize($('#backup-text').value);state=restored;ui.phaseConfirm=false;ui.notice=null;ui.inspected=null;ui.selected='eric';ui.preview=null;closeModal();commit();toast('검증한 저장을 복원했습니다.');if(state.phase==='enemy'&&state.screen==='battle')enemyLoop();}catch(e){toast(`복원 실패: ${e.message}. 현재 진행 상태를 유지합니다.`);}break;
 case 'reset':modal('모든 저장을 초기화할까요?','<p>장수 성장, 전투와 결과 기록을 삭제합니다. 먼저 텍스트 백업을 보관할 수 있습니다.</p>','<button data-do="backup">먼저 백업</button><button class="danger" data-do="confirm-reset">모든 저장 삭제</button>');break;
 case 'confirm-reset':{const r=resetSave(storage);if(!r.ok){toast(`초기화 실패: ${r.error}`);break;}state=newGame();ui.selected='eric';ui.preview=null;closeModal();render();toast('저장을 초기화했습니다.');break;}
 case 'help':help();break;case 'close-modal':closeModal();break;
 case 'journal':ui.journal=!ui.journal;app.classList.toggle('journal-open',ui.journal);break;
 case 'zoom-in':renderer.zoomBy(1.15);break;case 'zoom-out':renderer.zoomBy(1/1.15);break;case 'reset-camera':renderer.reset();break;
 }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-do]');if(b&&!b.disabled)dispatch(b.dataset.do,b.dataset.id);});
document.addEventListener('change',e=>{if(e.target.id==='animation-speed')ui.speed=Number(e.target.value);});
const canvas=$('#battle-map');let pointer=null,pinch=null,pinchUsed=false;const touches=new Map();
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();renderer.zoomBy(e.deltaY<0?1.08:1/1.08);},{passive:false});
canvas.addEventListener('pointerdown',e=>{touches.set(e.pointerId,{x:e.clientX,y:e.clientY});pointer={id:e.pointerId,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,drag:false,pan:e.button===2||e.shiftKey||e.pointerType==='touch'};canvas.setPointerCapture(e.pointerId);if(touches.size===2){const [a,b]=[...touches.values()];pinch={distance:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),zoom:renderer.zoom};pinchUsed=true;pointer.drag=true;}});
canvas.addEventListener('pointermove',e=>{if(touches.has(e.pointerId))touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&touches.size===2){const [a,b]=[...touches.values()];const zoom=pinch.zoom*Math.hypot(a.x-b.x,a.y-b.y)/pinch.distance;renderer.zoomBy(zoom/renderer.zoom);return;}const b=canvas.getBoundingClientRect(),tile=renderer.tileAt(e.clientX-b.left,e.clientY-b.top);ui.hover=tile;const t=terrainAt(tile.x,tile.y),unit=at(state,tile.x,tile.y);$('#terrain-readout').textContent=t?`${t.name} · 비용 ${Number.isFinite(t.cost)?t.cost:'불가'} · DEF +${t.defense}${t.evade?` · 회피 +${t.evade}%`:''}${unit?` · ${unit.name} ${unit.hp} HP`:''}`:'전장 밖';if(pointer&&pointer.id===e.pointerId&&pointer.pan){if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>7)pointer.drag=true;if(pointer.drag){renderer.pan.x+=e.clientX-pointer.lastX;renderer.pan.y+=e.clientY-pointer.lastY;renderer.clampPan();}}if(pointer){pointer.lastX=e.clientX;pointer.lastY=e.clientY;}});
canvas.addEventListener('pointerup',async e=>{touches.delete(e.pointerId);if(pinchUsed){if(!touches.size){pinch=null;pinchUsed=false;pointer=null;}return;}if(!pointer||pointer.id!==e.pointerId)return;const p=pointer;pointer=null;if(p.drag||e.button===2||ui.busy)return;const b=canvas.getBoundingClientRect(),tile=renderer.tileAt(e.clientX-b.left,e.clientY-b.top),t=at(state,tile.x,tile.y),u=findUnit(state,ui.selected);
 if(state.screen==='deployment'){
  if(ui.mode==='deploy'){if(setDeployment(state,ui.selected,tile.x,tile.y)){ui.mode='choose';ui.notice='배치 완료 · 장수를 선택해 하단에서 배치 이동을 누르세요.';commit();}else{ui.notice='남쪽 배치 영역의 유효한 Tile을 선택하세요.';render();}}
  else if(t?.team==='ally')dispatch('select',t.id);return;
 }
 if(state.screen!=='battle'||state.phase!=='player')return;
 if(canAct(state,u)&&['attack','skill','rescue'].includes(ui.mode)&&t&&validTarget(state,u,t,ui.mode)){ui.preview=t.id;ui.inspected=null;ui.notice=null;render();return;}
 if(t?.team==='ally'){
  if(t.id===ui.selected&&ui.mode==='move'){ui.mode='choose';ui.preview=null;ui.notice='제자리에서 행동 · 이동을 사용하지 않았습니다. 공격, 스킬 또는 대기를 선택하세요.';render();}
  else dispatch('select',t.id);return;
 }
 if(ui.mode==='move'&&canAct(state,u)&&!u.moved){state.feedback=[];const path=moveUnit(state,u.id,tile.x,tile.y);if(path){ui.preview=null;ui.notice=null;ui.inspected=null;ui.busy=true;save();render();await effects();ui.busy=false;ui.mode='choose';render();}
  else{ui.notice='이동 불가 · 지형 비용, 이동력과 유닛 점유를 확인하세요.';render();}return;
 }
 if(t?.team==='enemy'){
  if(canAct(state,u)&&validTarget(state,u,t,'attack')){ui.mode='attack';ui.preview=t.id;ui.inspected=null;ui.notice=null;}
  else{ui.inspected=t.id;ui.preview=null;ui.notice=null;}render();
 }
});
canvas.addEventListener('pointercancel',()=>{pointer=null;pinch=null;pinchUsed=false;touches.clear();});
document.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT','SELECT'].includes(document.activeElement?.tagName))return;if($('#modal-root').children.length){if(e.key==='Escape')closeModal();return;}const actions={'1':['mode','move'],'2':['mode','attack'],'3':['mode','skill'],'4':['mode','rescue'],z:['undo'],w:['wait'],e:['end-phase'],Tab:['next'],Escape:['cancel']};const a=actions[e.key]||actions[e.key.toLowerCase()];if(a&&state.screen==='battle'){e.preventDefault();dispatch(...a);}});
render();if(loaded.warning)toast(loaded.warning);if(state.screen==='battle'&&state.phase==='enemy')enemyLoop();
// Read-only diagnostics for QA and reproducibility. No state injection or win shortcut.
window.AshenCrown=Object.freeze({version:VERSION,snapshot:()=>structuredClone(state),view:()=>({selected:ui.selected,mode:ui.mode,busy:ui.busy,zoom:renderer.zoom,tileResolution:TILE,portraitResolution:PORTRAIT_SIZE,ranges:renderer.ranges?.()||[],phaseConfirm:ui.phaseConfirm}),tileCenter:(x,y)=>renderer.tileCenter(x,y)});

})();</script></body></html>
