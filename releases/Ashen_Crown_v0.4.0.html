:root{color-scheme:dark;--ink:#ede7d6;--dim:#a6b5b2;--gold:#d9bc7d;--line:#3b5355;--panel:#1b3035;--blue:#88c5d2;--red:#c77f76;--green:#abc48a;font-family:Georgia,'Ashen UI',serif;background:#102529;color:var(--ink)}

.bag-layout{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.bag-label{font:600 11px Arial,'Ashen UI',sans-serif;letter-spacing:.12em;color:#b9c8b5;margin:10px 0 6px}
.bag-grid{display:grid;grid-template-columns:repeat(3,56px);gap:6px}
.bag-slot{width:56px;height:56px;display:grid;place-items:center;background:radial-gradient(#2b4a4f,#163036);border:2px solid #4c6f70;border-radius:6px;padding:0}
.bag-slot.empty{border-style:dashed;opacity:.45}.bag-slot.active{border-color:#e2c27c;box-shadow:0 0 0 2px #e2c27c55}
.bag-counts{display:flex;gap:6px;margin-top:8px}.bag-count{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:5px}.bag-count.active{border-color:#e2c27c}
.item-detail{display:flex;gap:12px;align-items:flex-start;padding:12px;background:#10262b;border:1px solid #d8bb7c66;border-radius:8px;min-height:110px}
.item-detail h3{margin:0 0 4px;color:#f1e3b8}.item-detail p{margin:0 0 6px;font-size:13px}
.gear-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.gear-cell{position:relative;display:grid;justify-items:center;gap:2px;padding:6px 4px;background:#163036;border:1px solid #3f6266;border-radius:6px}
.gear-cell small{font-size:10px;text-align:center;line-height:1.2}.gear-cell i{position:absolute;top:3px;right:5px;font:700 10px Arial;color:#9fe0b5;font-style:normal}
.gear-cell em{position:absolute;top:3px;left:4px;font:700 9px Arial;font-style:normal;background:#d8bb7c;color:#13262a;border-radius:3px;padding:0 3px}
.bag-pending{color:#f1d58c}
.paperdoll{display:grid;grid-template-columns:150px 1fr 1.2fr;gap:12px;align-items:start;margin:10px 0}
.doll-portrait{text-align:center}.doll-portrait h3{margin:6px 0 0;font-size:14px}
.doll-slots{display:grid;gap:8px}
.doll-slot{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:8px;background:#10262b;border:1px solid #3f6266;border-radius:6px}
.doll-slot.filled{border-color:#d8bb7c99}.doll-slot .doll-name{grid-column:1/-1;font:600 10px Arial;letter-spacing:.1em;color:#9fb4a8}
.doll-slot .doll-empty{width:40px;height:40px;display:grid;place-items:center;border:1px dashed #4c6f70;border-radius:4px;font-size:10px;color:#8ea39a}
.doll-slot b{font-size:12px}.doll-slot button{grid-column:2;justify-self:start;padding:2px 8px;font-size:11px}
.doll-stats{display:grid;gap:6px}.stat-row{display:grid;grid-template-columns:34px 1fr 64px;gap:8px;align-items:center;font:12px Arial,'Ashen UI',sans-serif}
.stat-bar{position:relative;height:8px;background:#0c1d21;border-radius:4px;overflow:hidden}.stat-bar i{position:absolute;inset:0 auto 0 0;background:#6fa6b2}.stat-bar em{position:absolute;top:0;bottom:0;background:#e2c27c}
.gear-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.gear-card{display:flex;gap:10px;padding:8px;background:#163036;border:1px solid #3f6266;border-radius:6px}.gear-card.unfit{opacity:.6}.gear-card h3{margin:0;font-size:13px}.gear-card p{margin:2px 0;font-size:12px}
@media(max-width:720px){.bag-layout{grid-template-columns:1fr}.paperdoll{grid-template-columns:1fr}.doll-portrait{display:flex;align-items:center;gap:10px;text-align:left}.doll-portrait canvas{width:72px;height:72px}}
.turn-prompt{position:absolute;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);min-width:250px;padding:14px 18px 16px;background:#152b30f7;border:2px solid #d8bb7c;border-radius:8px;box-shadow:0 10px 30px #071a24cc;text-align:center}
.turn-prompt .row{justify-content:center;gap:10px}.turn-prompt button{min-width:84px}
.turn-prompt[hidden]{display:none}
.chest-find{display:flex;gap:14px;align-items:center;justify-content:center;padding:10px 0;font:15px/1.6 Arial,'Ashen UI',sans-serif}.chest-find b{color:#f1d58c}
/* v0.4 benchmark pass: tabbed unit sheet. */
.info-tabs{display:flex;gap:4px;margin:4px 0 10px;flex-wrap:wrap}.info-tabs button{padding:5px 14px}.info-tabs button.active{border-color:#e2c27c;color:#f1d58c;background:#27464a}
.info-head{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:8px;background:#10262b;border:1px solid #3f6266;border-radius:6px}.info-head canvas{width:96px;height:96px}
.info-head h3{margin:0}.info-head h3 small{font-size:11px;color:#a7c0b4;margin-left:6px}.info-head p{margin:2px 0 6px;font-size:12px}
.info-bar{display:grid;grid-template-columns:34px 1fr 64px;gap:8px;align-items:center;font:11px Arial,'Ashen UI',sans-serif;margin:3px 0}.info-bar div{height:8px;background:#0c1d21;border-radius:4px;overflow:hidden}.info-bar i{display:block;height:100%}
.info-bar.hp i{background:#8fc78a}.info-bar.mp i{background:#6fa6d6}.info-bar.xp i{background:#e2c27c}
.info-body{padding:10px 2px}.grade-table{border-collapse:collapse;width:100%;max-width:420px}.grade-table th{text-align:left;font-weight:600;padding:5px 8px;color:#c7d6c6}.grade-table td{padding:5px 8px}
.grade{font:700 16px Arial;width:34px;text-align:center}.g-S{color:#ffd86b}.g-A{color:#f4b860}.g-B{color:#9fd3a1}.g-C{color:#8fc0d8}.g-D{color:#a9a9b8}.g-E{color:#8b8b8b}
.info-note{font-size:12px;color:#cbd8c7}.info-bio{font:14px/1.9 'Ashen UI',Arial,'Ashen UI',sans-serif;max-width:560px}
.tactic-card{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}.tactic-card h4{margin:0 0 4px;grid-column:1}.tactic-card p{grid-column:1;margin:0;font-size:13px}.tactic-card .range-grid{grid-column:2;grid-row:1/3}
.range-grid{display:grid;grid-template-columns:repeat(7,14px);gap:2px;padding:6px;background:#0c1d21;border-radius:6px;width:max-content}.range-grid i{width:14px;height:14px;background:#24383b;display:block}.range-grid i.hit{background:#c8574a}.range-grid i.self{background:#6fa6d6}
.class-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.class-grid h4{margin:0 0 6px}.apt-table{border-collapse:collapse;font-size:12px}.apt-table th,.apt-table td{padding:3px 8px;border-bottom:1px solid #284346;text-align:left}
.info-slots{display:grid;gap:8px;max-width:420px}
@media(max-width:720px){.class-grid,.tactic-card{grid-template-columns:1fr}.tactic-card .range-grid{grid-column:1;grid-row:auto}.info-head{grid-template-columns:72px 1fr}.info-head canvas{width:72px;height:72px}}
/* v0.4 feedback #3: readable intro, guide and dialogue text. */
.title-inner p{font-size:18px;line-height:1.85;max-width:620px}
.title-bottom{font:14px/1.8 Arial,'Ashen UI',sans-serif;color:#b9c8bf}
.modal p,.modal li{font:15px/1.85 Arial,'Ashen UI',sans-serif}
.story{font-size:18px;line-height:2}
.dialogue-text{font-size:19px;line-height:1.8}
@media(max-width:720px){.title-inner p{font-size:16px}.title-bottom{font-size:13px}.modal p,.modal li{font-size:15px}.story{font-size:16px}.dialogue-text{font-size:17px;line-height:1.7}}
/* v0.4 feedback #4/#7: full-width play area, floating hub controls, scroll-icon quest. */
.frontier-screen.fs{padding:0;overflow:hidden}
.frontier-screen.fs .frontier-layout{display:block;max-width:none;height:100%;margin:0}
.frontier-screen.fs .frontier-map-wrap{position:relative;height:100%!important;max-height:none!important;min-height:0!important;border:0;overflow:hidden;background:#1d3330}
.frontier-screen.fs #frontier-map{width:100%;height:100%;display:block}
.hub-top{position:absolute;top:10px;left:12px;right:auto;display:flex;gap:10px;align-items:center;margin:0;z-index:3;pointer-events:none}
.hub-title{font:600 16px 'Ashen UI',Arial,'Ashen UI',sans-serif;color:#f1e3b8;background:#0f2226cc;padding:5px 12px;border-radius:6px;border:1px solid #d8bb7c66}
.hub-top .gold{font:600 14px Arial,'Ashen UI',sans-serif;background:#0f2226cc;padding:5px 10px;border-radius:6px;border:1px solid #d8bb7c66;color:#f1d58c}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.frontier-screen.fs .hub-map-controls{position:absolute;top:10px;right:64px;z-index:3;display:flex;gap:4px}
.frontier-screen.fs .location-tag{position:absolute;left:12px;bottom:12px;z-index:3}
.frontier-screen.fs .interaction-list{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:4;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:70%}
.frontier-screen.fs .interaction-list button{background:#15302ff0;border:2px solid #d8bb7c;padding:9px 16px;font:600 14px 'Ashen UI',Arial,'Ashen UI',sans-serif;box-shadow:0 4px 14px #0009}
.frontier-screen.fs .dpad{position:absolute;left:14px;bottom:52px;z-index:4;opacity:.92}
@media(pointer:fine){.frontier-screen.fs .dpad{display:none}}
.frontier-screen.fs .frontier-actions{position:absolute;right:12px;bottom:12px;z-index:4;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.frontier-screen.fs .frontier-actions button{display:inline-flex;align-items:center;gap:6px;background:#15302fe6;padding:7px 12px;font:600 13px 'Ashen UI',Arial,'Ashen UI',sans-serif}
.frontier-screen.fs .frontier-actions button.primary{background:#d8bb7c;color:#14262a;font-size:14px;padding:10px 16px}
.frontier-screen.fs #hub-minimap{position:absolute;right:12px;top:52px;bottom:auto;z-index:3;width:150px;height:auto}
.quest-panel{position:absolute;top:10px;right:12px;z-index:6;max-width:300px;background:transparent;border:0;padding:0}
.quest-panel>summary{list-style:none;display:inline-flex;align-items:center;gap:4px;margin-left:auto;cursor:pointer;background:#15302ff0;border:2px solid #d8bb7c;border-radius:8px;padding:5px 7px;float:right}
.quest-panel>summary::-webkit-details-marker{display:none}
.quest-key{font:700 11px Arial;color:#f1d58c}
.quest-panel[open]>#quest-content{clear:both;margin-top:6px;background:#132a2ef5;border:2px solid #d8bb7c;border-radius:8px;padding:10px 14px;font:14px/1.6 'Ashen UI',Arial,'Ashen UI',sans-serif;box-shadow:0 8px 24px #000a}
#quest-content b{color:#f1d58c}#quest-content p{margin:4px 0}.quest-opt,.quest-status{font-size:13px;color:#cfe0cf}
.frontier-screen.fs~.quest-panel,.field .quest-panel{top:10px}
.map-label{display:none}
@media(max-width:720px){.frontier-screen.fs .interaction-list{max-width:92%;bottom:auto;top:52px}.frontier-screen.fs .frontier-actions{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;max-width:62%}.frontier-screen.fs #hub-minimap{display:none}.frontier-screen.fs .hub-map-controls{right:58px}.hub-title{font-size:13px}}
.quest-panel,.exploring .quest-panel{position:absolute!important;inset:auto!important;top:10px!important;right:12px!important;left:auto!important;z-index:7!important;width:auto!important;max-width:300px;background:transparent!important;border:0!important;box-shadow:none!important;margin:0!important;grid-column:auto}
.quest-panel>summary{min-height:0;font-size:0}
.frontier-screen.fs #hub-minimap{top:56px}
.frontier-screen.fs .hub-map-controls{top:auto;right:auto;left:12px;bottom:48px}
@media(max-width:720px){.frontier-screen.fs .hub-map-controls{left:auto;right:12px;top:56px;bottom:auto}.quest-panel[open]>#quest-content{max-width:240px}}
/* v0.4 feedback #6: icon-first result screen. */
.result-v2{text-align:center}
.result-banner h2{font:700 54px/1 'Ashen UI',Georgia,serif;letter-spacing:.12em;margin:6px 0}
.result-banner.win h2{color:#f1d58c;text-shadow:0 0 18px #e2c27c66}.result-banner.lose h2{color:#d98a7c}
.result-banner span{font:15px 'Ashen UI',Arial,'Ashen UI',sans-serif;color:#cfdccf}
.result-reason{font-size:15px;color:#e8d6c8}
.victory-rewards{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:16px 0;background:none;border:0;padding:0}
.reward-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:#132a2e;border:2px solid #d8bb7c88;border-radius:10px;font:600 16px 'Ashen UI',Arial,'Ashen UI',sans-serif;color:#f6ebc9}
.reward-chip.bond{border-color:#e48aa0;color:#ffd3de}.reward-chip.warn{border-color:#c98a4a}
.stars{display:flex;justify-content:center;gap:18px;margin:4px 0 14px}.star{display:grid;justify-items:center;font-size:28px;color:#5e6f69}.star.on{color:#f3cf6c;text-shadow:0 0 10px #f3cf6c77}.star small{font:12px Arial,'Ashen UI',sans-serif;color:#b9c8bf}
.hero-row{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:6px 0 16px}
.hero-tile{position:relative;display:grid;justify-items:center;gap:4px;padding:12px 6px 10px!important;background:#132a2e;border:1px solid #3f6266;border-radius:10px}
.hero-tile canvas{width:84px;height:84px}.hero-tile strong{font:600 15px 'Ashen UI',Arial,'Ashen UI',sans-serif}.hero-tile .lv{font:700 13px Arial;color:#f1d58c}
.hero-tile .xpbar{width:80%;height:6px;background:#0c1d21;border-radius:3px;overflow:hidden}.hero-tile .xpbar i{display:block;height:100%;background:#e2c27c}
.hero-tile .gain{font:12px Arial;color:#9fd3a1}.hero-tile .stat-ups{font:11px Arial;color:#cfe0cf}
.hero-tile.leveled{border-color:#f1d58c;box-shadow:0 0 16px #f1d58c44}.hero-tile .lvup{position:absolute;top:-10px;background:#f1d58c;color:#14262a;font:800 11px Arial;padding:2px 8px;border-radius:9px}
.hero-tile.down{opacity:.6}.hero-tile .ko{font:11px Arial;color:#e59a8a}.hero-tile .clue{position:absolute;top:6px;right:8px;color:#c9a4f0;font-size:16px}
.result-actions{justify-content:center;flex-wrap:wrap}
@media(max-width:720px){.hero-row{grid-template-columns:repeat(3,minmax(0,1fr))}.result-banner h2{font-size:40px}.hero-tile canvas{width:64px;height:64px}}
/* v0.4 B3: Lia as strategist */
.strategist-line{display:flex;align-items:center;gap:12px;margin:6px 0}
.strategist-line .card-sprite{width:56px;height:56px;flex:none;image-rendering:pixelated}

 'pre:1':[['aren','에릭, 아침 종 울리기 전에 한 바퀴 돌자. 병사들은 좀 어때?'],['eric','방패 고치는 중이다. 오늘은 좀 조용했으면 좋겠군.'],['aren','네 눈으로 본 것도 듣고 싶다.'],['elina','북쪽 숲에 낯선 발자국이 있어요. 습격이라고 하기엔… 아직 일러요.'],['aren','주민들이 겁먹지 않게 확인해 줘. …에릭, 마을을 부탁한다.'],['lia','아, 기록 보던 중이었어요! 떠나기 전에 잠깐 얘기할 수 있어요?'],['sain','피난민분들이 쉬고 계세요. 약이 없어도 제 손 닿는 데까지는 돕겠습니다.'],['kai','같은 길을 가려면 준비가 돼야지. 할 말 있으면 동쪽 길목으로 와.'],['eric','동료들은 내가 둘러보지. 정찰 보고는 리아한테 듣고.'],['aren','서두르지 마라. 빠뜨린 게 없는지… 천천히 보자.']],

// Supplement existing first-clear Gold, never replace or repeat it.
function supplementalRewards(missionId,{rescued=0,captured=false,seal=false,orders=false}={}){
 const reward=(suffix,kind,type,amount=1,optional=false)=>({id:`v032:m${missionId}:${suffix}`,missionId,kind,type,amount,optional});
 if(missionId===1)return [reward('supply','item','medium'),...(rescued===2?[reward('rescue','item','ward',1,true)]:[])];
 if(missionId===2)return [reward('supply','item','ether'),...(captured?[reward('capture','gold',null,30,true)]:[])];
 if(missionId===3)return [reward('supply-hp','item','medium'),reward('supply-mp','item','ether'),...(rescued===2?[reward('full-rescue','gear','focusCharm',1,true)]:[])];
 const v4=(suffix,kind,type,amount=1,optional=false)=>({...reward(suffix,kind,type,amount,optional),id:`v040:m${missionId}:${suffix}`});
 if(missionId===4)return [v4('supply','item','medium'),...(seal?[v4('seal-notes','gear','focusCharm',1,true)]:[]),...(orders?[v4('orders','gold',null,40,true)]:[]),...(seal&&orders?[v4('all-evidence','item','ether',1,true)]:[])];
 return [];
}
const knownRewards=()=>[1,2,3,4,5,6].flatMap(id=>supplementalRewards(id,{rescued:2,captured:true,seal:true,orders:true}));
function initRewardLedger(e){e.rewardClaims??=[];e.rewardHistory??=[];e.rewardPending??=[];return e;}
function deliverRewards(e){let count=0;for(let i=0;i<e.rewardPending.length;){const r=e.rewardPending[i];if(r.kind==='item'&&Object.values(e.items).reduce((a,b)=>a+b,0)<6){e.items[r.type]++;}else if(r.kind==='gear'&&e.gear.length<24){e.gear.push({id:`g${e.next++}`,type:r.type,level:0});}else{i++;continue;}e.rewardPending.splice(i,1);count++;}return count;}
function grantSupplemental(e,missionId,context={},legacy=false){initRewardLedger(e);const grants=[];for(const r of supplementalRewards(missionId,context)){if(e.rewardClaims.includes(r.id))continue;e.rewardClaims.push(r.id);e.rewardHistory.push({...r,legacy});if(r.kind==='gold')e.gold+=r.amount;else for(let n=0;n<r.amount;n++)e.rewardPending.push({...r});grants.push(r);}deliverRewards(e);return grants;}
function legacyRewardCatchup(e,campaign){initRewardLedger(e);for(const id of campaign.completed||[]){const result=campaign.results.find(r=>r.missionId===id&&r.outcome==='victory'&&!r.practice);const rescued=result?.rescued??(id===1?campaign.flags.mission_01_civilians_rescued:id===3?campaign.flags.mission_03_refugees_saved:0)??0;grantSupplemental(e,id,{rescued,captured:!!campaign.flags.mission_02_prisoner_captured,seal:!!campaign.flags.mission_04_seal_notes,orders:!!campaign.flags.mission_04_transfer_orders},true);}}
function validateRewardLedger(e){const known=new Map(knownRewards().map(r=>[r.id,r]));const valid=r=>{const k=known.get(r?.id);return k&&['missionId','kind','type','amount','optional'].every(p=>r[p]===k[p]);};if(!Array.isArray(e.rewardClaims)||new Set(e.rewardClaims).size!==e.rewardClaims.length||e.rewardClaims.some(id=>!known.has(id))||!Array.isArray(e.rewardHistory)||e.rewardHistory.length!==e.rewardClaims.length||new Set(e.rewardHistory.map(r=>r.id)).size!==e.rewardHistory.length||e.rewardHistory.some(r=>!valid(r)||!e.rewardClaims.includes(r.id)||typeof r.legacy!=='boolean')||!Array.isArray(e.rewardPending)||new Set(e.rewardPending.map(r=>r.id)).size!==e.rewardPending.length||e.rewardPending.some(r=>!valid(r)||r.kind==='gold'||!e.rewardClaims.includes(r.id)))throw Error('보상 기록이 손상되었습니다.');}
const rewardLabel=r=>r.kind==='gold'?`${r.amount} Gold`:`${r.kind==='gear'?GEAR[r.type].name:TOOLS[r.type].name} × ${r.amount}`;

// src/ui/held-movement.js
// Runtime-only input: never serialized. One step per frame avoids catch-up overshoot.
function createHeldMovement(step,{delay=180,interval=100}={}){
 let held=new Map(),next=Infinity;
 return {
  press(source,direction,now){if(held.has(source))return;held.set(source,direction);next=now+delay;if(!step(...direction))this.clear();},
  release(source,now){const active=[...held.keys()].at(-1);held.delete(source);if(active===source)next=now+interval;},
  tick(now,enabled){if(!enabled){this.clear();return;}if(held.size&&now>=next){next=now+interval;if(!step(...[...held.values()].at(-1)))this.clear();}},
  clear(){held.clear();next=Infinity;}
 };
}

// src/core/narrative.js
function narrativeState(){return {queue:[],active:null,events:[],seen:[],history:[],auto:false};}
function enqueueStory(s,key){const n=s.narrative;if(!n||!STORY[key]||n.events.includes(key))return false;n.events.push(key);n.queue.push(key);return true;}
function openStory(s){const n=s.narrative;if(!n.active&&n.queue.length)n.active={key:n.queue.shift(),index:0};return n.active;}
function storyLine(s){const a=s.narrative?.active;return a?STORY[a.key]?.[a.index]:null;}
function advanceStory(s,skip=false){const n=s.narrative,a=n.active;if(!a)return false;if(skip&&!n.seen.includes(a.key))return false;const lines=STORY[a.key];if(skip){for(let i=a.index;i<lines.length;i++)n.history.push({...lines[i],scene:a.key});a.index=lines.length;}else{n.history.push({...lines[a.index],scene:a.key});a.index++;}n.history=n.history.slice(-250);if(a.index>=lines.length){if(!n.seen.includes(a.key))n.seen.push(a.key);n.active=null;openStory(s);}s.campaign.dialogueMemory={seen:[...n.seen],history:structuredClone(n.history)};return true;}
function remember(s,key){if(s.practice)return;s.campaign.tacticalMemory[key]=(s.campaign.tacticalMemory[key]||0)+1;}
function setStoryFlag(s,key,value=true){if(!s.practice)s.campaign.flags[key]=value;}
function introStory(s){enqueueStory(s,`${s.missionId}:intro`);openStory(s);}
function afterBattleEvents(s){
 if(s.screen==='battle'&&s.phase==='player'&&s.turn===2)enqueueStory(s,`${s.missionId}:turn2`);
 if(s.missionId===1&&s.screen==='battle'&&s.turn===4)enqueueStory(s,'1:turn4');
 if(s.units.some(u=>u.rescued))enqueueStory(s,`${s.missionId}:rescue`);
 if(s.missionId===3&&s.units.some(u=>u.team==='civilian'&&u.hp<=0))enqueueStory(s,'3:loss');
 if(s.outcome){enqueueStory(s,s.outcome==='victory'?`${s.missionId}:end`:'defeat');}
}

function initialEconomy(completed=[]){return {gold:180+[...new Set(completed)].reduce((a,id)=>a+rewardFor(id),0),items:{medium:0,ether:0,ward:0},gear:[],equipped:Object.fromEntries(HEROES.map(h=>[h.id,{weapon:null,armor:null,accessory:null}])),next:1,nonce:0,transactions:[],rewards:[...new Set(completed)],rewardClaims:[],rewardHistory:[],rewardPending:[]};}
function ensureEconomy(s){if(!s.campaign.economy)s.campaign.economy=initialEconomy(s.campaign.completed);if(!s.economy)s.economy=structuredClone(s.campaign.economy);return s.economy;}
const itemCount=e=>Object.values(e.items).reduce((a,b)=>a+b,0);
function equipmentBonus(e,hero){const bonus={};for(const id of Object.values(e?.equipped?.[hero]||{})){const instance=e.gear.find(g=>g.id===id),g=GEAR[instance?.type];if(!g)continue;for(const [k,v]of Object.entries(g.bonus))bonus[k]=(bonus[k]||0)+v;if(instance.level===1)for(const [k,v]of Object.entries(g.upgrade))bonus[k]=(bonus[k]||0)+v;}return bonus;}
function effectiveStats(s,u){const b=u.team==='ally'?equipmentBonus(s.economy,u.id):{};const v={...u,mov:u.mov+(u.classMovementModifier||0)};for(const [k,n]of Object.entries(b))v[k]=(v[k]||0)+n;if(u.ward){v.def+=2;v.res+=2;}if(u.guarding)v.def+=3;return v;}
function equipmentLabel(e,hero){return Object.entries(e.equipped[hero]).map(([slot,id])=>{const g=e.gear.find(a=>a.id===id);return `${slot}: ${g?GEAR[g.type].name+(g.level?' +1':''):'Standard'}`;}).join(' · ');}

 const ids=new Set();for(const g of e.gear){if(!g||!GEAR[g.type]||typeof g.id!=='string'||!/^g[1-9][0-9]*$/.test(g.id)||ids.has(g.id)||Number(g.id.slice(1))>=e.next||![0,1].includes(g.level))throw Error('장비 저장이 손상되었습니다.');ids.add(g.id);}

// Stale confirmation tokens never apply twice, even after a reload.
function transact(s,request){
 if(s.practice)return {ok:false,error:'연습에서는 정식 자산 거래를 할 수 없습니다.'};
 if(!['exploration','warroom','deployment'].includes(s.screen)||s.narrative?.active)return {ok:false,error:'전투 전 준비 장소에서 거래하세요.'};
 const current=ensureEconomy(s);if(!request||request.token!==`tx:${current.nonce}`||current.transactions.includes(request.token))return {ok:false,error:'이미 처리되었거나 만료된 거래입니다.'};
 const e=structuredClone(current),{op,id,hero,slot}=request;let cost=0;
 try{
 if(op==='collect-rewards'){if(!deliverRewards(e))throw Error('보상 공간이 부족합니다.');}
 else if(op==='buy-item'){const t=TOOLS[id];if(!t)throw Error('알 수 없는 도구입니다.');if(itemCount(e)>=CARRY_CAPACITY)throw Error('도구 소지 한도는 6개입니다.');cost=t.price;e.items[id]++;}
 else if(op==='sell-item'){const t=TOOLS[id];if(!t||!e.items[id])throw Error('보유 도구가 없습니다.');cost=-t.sell;e.items[id]--;}
 else if(op==='buy-gear'){const g=GEAR[id];if(!g)throw Error('알 수 없는 장비입니다.');if(e.gear.length>=GEAR_CAPACITY)throw Error('장비 소지 한도는 24개입니다.');if(hero&&!g.heroes.includes(hero))throw Error('이 장수의 병종은 장비를 사용할 수 없습니다.');cost=g.price;const instance={id:`g${e.next++}`,type:id,level:0};e.gear.push(instance);if(hero)e.equipped[hero][g.slot]=instance.id;}
 else if(op==='sell-gear'||op==='upgrade'){const instance=e.gear.find(a=>a.id===id);if(!instance)throw Error('장비를 찾을 수 없습니다.');if(op==='upgrade'){if(instance.level)throw Error('이미 +1 강화한 장비입니다.');cost=40;instance.level=1;}else{if(Object.values(e.equipped).some(slots=>Object.values(slots).includes(id)))throw Error('장착을 해제한 뒤 판매하세요.');cost=-Math.floor(GEAR[instance.type].price*.4);e.gear=e.gear.filter(a=>a.id!==id);}}
 else if(op==='chest'){e.chests??=[];const r=request.reward;if(typeof id!=='string'||!/^m[1-9]:[a-z]+:[a-z]+-[0-9]+:[a-z]$/.test(id)||e.chests.includes(id))throw Error('이미 열어 본 상자입니다.');if(!r||!['gold','item','empty'].includes(r.kind))throw Error('상자 내용이 올바르지 않습니다.');e.chests.push(id);if(r.kind==='gold'){if(!Number.isInteger(r.amount)||r.amount<1||r.amount>60)throw Error('상자 내용이 올바르지 않습니다.');e.gold+=r.amount;}else if(r.kind==='item'){if(!TOOLS[r.type])throw Error('상자 내용이 올바르지 않습니다.');if(itemCount(e)<CARRY_CAPACITY)e.items[r.type]++;else e.gold+=20;}}
 else if(op==='equip'){const instance=e.gear.find(a=>a.id===id),g=GEAR[instance?.type];if(!g||!g.heroes.includes(hero)||g.slot!==slot)throw Error('이 장수의 직업/슬롯과 호환되지 않습니다.');if(Object.values(e.equipped).some(slots=>Object.values(slots).includes(id)))throw Error('이미 장착된 장비입니다.');e.equipped[hero][slot]=id;}
 else if(op==='unequip'){if(!e.equipped[hero]||!['weapon','armor','accessory'].includes(slot))throw Error('슬롯이 올바르지 않습니다.');e.equipped[hero][slot]=null;}
 else throw Error('알 수 없는 거래입니다.');
 if(cost>e.gold)throw Error('Gold가 부족합니다.');e.gold-=cost;e.transactions.push(request.token);e.transactions=e.transactions.slice(-100);e.nonce++;validateEconomy(e);
 s.economy=e;s.campaign.economy=structuredClone(e);return {ok:true,cost};
 }catch(error){return {ok:false,error:error.message};}
}
function commitEconomyReward(s){if(s.practice||s.campaign.completed.includes(s.missionId))return 0;const e=ensureEconomy(s);if(e.rewards.includes(s.missionId))return 0;const reward=rewardFor(s.missionId);e.rewards.push(s.missionId);e.gold+=reward;const result=s.campaign.results.at(-1);const extras=grantSupplemental(e,s.missionId,{rescued:result.rescued,captured:!!s.campaign.flags.mission_02_prisoner_captured,seal:!!s.campaign.flags.mission_04_seal_notes,orders:!!s.campaign.flags.mission_04_transfer_orders});result.rewards={gold:reward,extras};s.campaign.economy=structuredClone(e);s.log.push(`첫 승리 보상 +${reward} Gold`);return reward;}
function useTool(s,u,id){const e=ensureEconomy(s),t=TOOLS[id];if(!t||!e.items[id])return {ok:false,error:'보유 도구가 없습니다.'};if(id==='ward'&&u.ward)return {ok:false,error:'보호 효과가 이미 적용 중입니다.'};if(t.stat==='hp'&&u.hp>=u.maxHP||t.stat==='mp'&&u.mp>=u.maxMP)return {ok:false,error:'회복할 수치가 없습니다.'};e.items[id]--;if(id==='ward'){u.ward=true;s.feedback.push({type:'guard',id:u.id,text:'WARD'});}else{const max=t.stat==='hp'?u.maxHP:u.maxMP,amount=Math.min(t.amount,max-u[t.stat]);u[t.stat]+=amount;s.feedback.push({type:'heal',id:u.id,text:`+${amount} ${t.stat.toUpperCase()}`,...(t.stat==='hp'?{toHP:u.hp}:{})});}s.log.push(`${u.name}: ${t.name} 사용 · 행동 1회`);return {ok:true};}

function enterInterior(s,kind){const f=s.frontier;if(s.screen!=='exploration'||s.narrative.active||f.interior)return false;
 const door=!INTERIORS[kind]?interactions(s).find(n=>n.action==='enter'&&n.buildingId===kind):null;
 if(!door&&(!INTERIORS[kind]||INTERIORS[kind].generic||!interactions(s).some(n=>n.action===kind)))return false;
 f.returnPosition={hub:f.hub,x:f.x,y:f.y,facing:f.facing};f.interior=door?door.interior:kind;if(door)f.interiorBuilding=door.buildingId;[f.x,f.y]=INTERIORS[f.interior].spawn;f.facing='up';syncFrontier(s);return true;}

// Only legacy spatial records are repaired; economic/tactical/story state is untouched.
function migrateFrontier(f,missionId=1){
 if(!f)return frontierState(missionId);
 f.actorId='eric';f.campaignEntry='advisor';f.advisorPending=false;if(!HUBS[f.hub])f.hub=missionId===1?'village':'camp';
 const safe=(interior,x,y)=>walkable({frontier:{...f,interior}},x,y);
 if(f.interior){
  if(!INTERIORS[f.interior]){delete f.interior;delete f.interiorBuilding;delete f.returnPosition;}
  else{const p=f.returnPosition;if(!p||p.hub!==f.hub||!safe(null,p.x,p.y)){const door=HUBS[f.hub].places.find(p=>p.action===f.interior);f.returnPosition={hub:f.hub,x:door.x,y:door.y,facing:'up'};}}
 }
 if(!safe(f.interior,f.x,f.y)){const spawn=(f.interior?INTERIORS[f.interior]:HUBS[f.hub]).spawn;[f.x,f.y]=spawn;f.facing='down';}
 return f;
}

 return roll<60?{kind:'gold',amount}:roll<80?{kind:'item',type:'medium'}:roll<90?{kind:'item',type:'ether'}:{kind:'empty'};}

// src/core/rules.js
const distance=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
const key=(x,y)=>`${x},${y}`;
const alive=u=>u.hp>0&&!u.rescued;
const terrainAt=(x,y,s)=>TERRAIN[(s?missionOf(s).map:MAP)[y]?.[x]];
const findUnit=(s,id)=>s.units.find(u=>u.id===id);
const at=(s,x,y)=>s.units.find(u=>alive(u)&&u.x===x&&u.y===y);
function nextRandom(state){const next=(Math.imul(state>>>0,1664525)+1013904223)>>>0;return {state:next,value:next/4294967296};}
function roll(s){const r=nextRandom(s.rng);s.rng=r.state;return r.value;}
function terrainCost(s,u,x,y){const type=missionOf(s).map[y]?.[x];if(!type||missionOf(s).layers.collision[y]?.[x]||!Number.isFinite(TERRAIN[type]?.cost))return Infinity;const profile=u.movementProfile||CLASS_MOVEMENT[HERO_CLASS[u.id]]?.profile||'infantry';return TERRAIN_COSTS[profile]?.[type]??TERRAIN[type].cost;}
function movement(s,u,ignore=false){
 const start=key(u.x,u.y), costs=new Map([[start,0]]),prev=new Map(),queue=[{x:u.x,y:u.y,c:0}];
 const allowance=effectiveStats(s,u).mov+(u.shadowBonus||0);
 while(queue.length){queue.sort((a,b)=>a.c-b.c);const p=queue.shift();if(p.c!==costs.get(key(p.x,p.y)))continue;
  for(const [dx,dy] of [[0,-1],[-1,0],[1,0],[0,1]]){const x=p.x+dx,y=p.y+dy,t=terrainAt(x,y,s);if(!t||!Number.isFinite(t.cost))continue;
   const occupant=at(s,x,y);if(!ignore&&occupant&&occupant.id!==u.id&&occupant.team!==u.team)continue;
   const c=p.c+terrainCost(s,u,x,y),k=key(x,y);
   if(c<=allowance&&c<(costs.get(k)??Infinity)){costs.set(k,c);prev.set(k,key(p.x,p.y));queue.push({x,y,c});}
  }
 }
 if(!ignore)for(const p of [...costs.keys()]){const [x,y]=p.split(',').map(Number),occupant=at(s,x,y);if(occupant&&occupant.id!==u.id)costs.delete(p);}
 return {costs,prev};
}
function pathTo(s,u,x,y){const {costs,prev}=movement(s,u);let k=key(x,y);if(!costs.has(k))return null;const path=[];while(k){const [px,py]=k.split(',').map(Number);path.unshift({x:px,y:py});k=prev.get(k);}return path;}
function skillCost(u){const h=HEROES.find(h=>h.id===u.id);return (h?.cost||0)+(u.id==='lia'&&u.hp<=u.maxHP/2?1:0);}
function rangeFor(u,mode='attack'){return mode==='skill'&&u.id==='lia'?[1,3]:mode==='skill'&&u.id==='sain'?[0,2]:mode==='skill'&&u.id==='eric'?[0,0]:u.range;}
function validTarget(s,u,t,mode='attack'){
 if(!u||!t||!alive(u)||!alive(t))return false;
 const d=distance(u,t);if(t.team==='object')return mode==='search'&&u.team==='ally'&&d===1;if(mode==='search')return false;if(mode==='capture')return s.missionId===2&&t.id==='boss'&&t.team==='enemy'&&t.hp<=t.maxHP/2&&d===1;
 if(mode==='rescue')return t.team==='civilian'&&d===1;
 if(mode==='skill'&&u.id==='eric')return t.id===u.id;
 if(mode==='skill'&&u.id==='sain')return t.team==='ally'&&d>=rangeFor(u,mode)[0]&&d<=rangeFor(u,mode)[1];
 const [min,max]=rangeFor(u,mode);return u.team!==t.team&&t.team!=='civilian'&&d>=min&&d<=max;
}
function flank(s,u,t){return s.units.some(a=>a.team===u.team&&alive(a)&&a.id!==u.id&&distance(a,t)===1&&((u.x<t.x&&a.x>t.x)||(u.x>t.x&&a.x<t.x)||(u.y<t.y&&a.y>t.y)||(u.y>t.y&&a.y<t.y)));}
function strikeStats(s,u,t,mode='attack'){
 u=effectiveStats(s,u);t=effectiveStats(s,t);
 const magic=mode==='skill'&&u.id==='lia',aim=mode==='skill'&&u.id==='elina',quick=mode==='skill'&&u.id==='kai';
 const ground=terrainAt(t.x,t.y,s),defense=magic?t.res:t.def,burning=!!s.burning?.[key(t.x,t.y)];
 let raw=Math.max(1,(magic?u.mag:u.atk)-defense+(aim?2:0)+(magic&&u.hp<=u.maxHP/2?4:0)+(quick&&flank(s,u,t)?6:0));
 let dmg=Math.max(1,Math.round(magic?raw*(ground.fire??1):raw*(1-(ground.phys||0))));
 if(t.id==='eric'&&t.hp<=t.maxHP*.3)dmg=Math.max(1,Math.floor(dmg*.85));
 const standing=missionOf(s).map[u.y][u.x];const hawk=u.id==='elina'&&(standing==='f'||standing==='v')?12:0;
 const hit=Math.max(70,Math.min(100,(magic?100:97)+Math.round((u.spd-t.spd)*1.5)-(ground.evade||0)+hawk+(aim?18:0)+(u.hit||0)-(t.dodge||0)));
 const crit=magic?0:Math.min(12,Math.max(3,Math.round((u.spd-t.spd)/2)+5));
 return {damage:dmg,hit,crit,magic,fire:magic,terrainMul:magic?(ground.fire??1):1-(ground.phys||0),flank:quick&&flank(s,u,t),burning};
}
function guardFor(s,u,t,mode){if(mode==='skill'&&u.id==='lia'||distance(u,t)!==1)return null;return s.units.find(g=>alive(g)&&g.team===t.team&&g.id!==t.id&&(g.guarding&&!g.guardUsed||g.guardTarget===t.id)&&distance(g,t)===1);}
function forecast(s,u,t,mode='attack'){
 if(mode==='skill'&&u.id==='sain')return {heal:Math.min(t.maxHP-t.hp,12+effectiveStats(s,u).mag),hit:100,damage:0,counter:0,after:Math.min(t.maxHP,t.hp+12+effectiveStats(s,u).mag)};
 if(mode==='skill'&&u.id==='eric')return {guard:true,damage:0,hit:100,counter:0,after:t.hp};
 if(mode==='capture')return {capture:true,damage:0,hit:100,counter:0,after:t.hp};
 if(mode==='rescue')return {rescue:true,damage:0,hit:100,counter:0,after:t.hp};
 if(mode==='search')return {search:true,damage:0,hit:100,counter:0,after:t.hp};
 const guard=guardFor(s,u,t,mode),victim=guard||t,stats=strikeStats(s,u,victim,mode),canCounter=validTarget(s,victim,u,'attack')&&victim.hp>stats.damage;
 const counter=canCounter?strikeStats(s,victim,u).damage:0;
 return {...stats,counter,counterHit:canCounter?strikeStats(s,victim,u).hit:0,after:Math.max(0,victim.hp-stats.damage),guard:guard?.id,victim:victim.id};
}
function awardXP(s,u,amount,reason){
 if(u.team!=='ally'||!amount)return;
 u.xp+=amount;u.earnedXP+=amount;u.highlights.push(reason);s.feedback.push({type:'xp',id:u.id,text:`+${amount} EXP`});
 let leveled=false;while(u.xp>=BALANCE.xpLevel){leveled=true;u.xp-=BALANCE.xpLevel;u.level++;const g=HEROES.find(h=>h.id===u.id).growth;const changes={...g};for(const [stat,n] of Object.entries(g)){if(stat==='hp'){u.maxHP+=n;u.hp=Math.min(u.maxHP,u.hp+n);}else if(stat==='mp'){u.maxMP+=n;u.mp=Math.min(u.maxMP,u.mp+n);}else u[stat]+=n;}if(u.id==='eric'&&u.level>=5)u.appearanceTier=2;u.growthHistory.push({level:u.level,changes});s.feedback.push({type:'level',id:u.id,text:`LEVEL ${u.level}`,toHP:u.hp});s.log.push(`${u.name} → LV ${u.level}. 성장이 새로운 힘으로 이어집니다.`);}
 if(leveled){u.hp=u.maxHP;u.mp=u.maxMP;s.log.push(`${u.name}: 레벨업으로 HP/MP 전부 회복.`);}
}
function discover(s,u,clue){if(!u.clues.includes(clue)){u.clues.push(clue);s.feedback.push({type:'potential',id:u.id,text:'POTENTIAL DISCOVERED'});s.log.push(`Potential Clue Discovered — ${clue} (1/3). 각성은 아직 해금되지 않았습니다.`);}}
// One-line tactical summary of a tile, shown when the player taps terrain.
function terrainSummary(s,x,y,u=null){const type=missionOf(s).map[y]?.[x],t=TERRAIN[type];if(!t)return '전장 밖';
 if(!Number.isFinite(t.cost))return `${t.ko} · 통행 불가`;
 const costs=['infantry','rogue','cavalry'].map(p=>TERRAIN_COSTS[p]?.[type]??t.cost),cost=c=>Number.isFinite(c)?c:'불가';
 const move=costs.every(c=>c===costs[0])?`이동 ${cost(costs[0])}`:`이동 보병 ${cost(costs[0])} · 도적 ${cost(costs[1])} · 기병 ${cost(costs[2])}`;
 const parts=[t.ko,move];if(t.phys)parts.push(`일반공격 ${Math.round(t.phys*100)}%↓`);if(t.evade)parts.push(`회피 ${Math.abs(t.evade)}%${t.evade>0?'↑':'↓'}`);
 if(t.fire&&t.fire!==1)parts.push(`화공 ${Math.round(Math.abs(t.fire-1)*100)}%${t.fire>1?'↑':'↓'}`);if(t.hpRecovery)parts.push(`턴 시작 HP ${t.hpRecovery*100}% 회복`);
 if(s.burning?.[key(x,y)])parts.push('🔥 불타는 중');if(u&&u.team==='ally'){const c=terrainCost(s,u,x,y);parts.push(`${u.name}: ${Number.isFinite(c)?`비용 ${c}`:'진입 불가'}`);}
 return parts.join(' · ');}

// Logical world coordinates; output backing resolution never alters hit testing.
class MapCamera{
 constructor(){this.zoom=1;this.target=null;this.offset={x:0,y:0};this.current=null;this.key=null;}
 reset(){this.zoom=1;this.offset={x:0,y:0};this.target=null;this.current=null;}

 zoomBy(factor){this.zoom=Math.max(.35,Math.min(2.4,this.zoom*factor));}
 panBy(x,y){this.offset.x+=x;this.offset.y+=y;}
 layout(width,height,mapWidth,mapHeight,{follow=null,key='',smooth=true}={}){
  if(this.key!==key){this.key=key;this.reset();}
  const base=width<600||height<300?40:64,tilePixels=Math.max(base,Math.min(width/mapWidth,base*1.5))*this.zoom,scale=tilePixels/64;
  const point=this.target||follow||{x:mapWidth/2-.5,y:mapHeight/2-.5};
  const clamp=(v,extent,view)=>extent<=view?(view-extent)/2:Math.max(view-extent,Math.min(0,v));
  let x=clamp(width/2-(point.x+.5)*tilePixels+this.offset.x,mapWidth*tilePixels,width),y=clamp(height/2-(point.y+.5)*tilePixels+this.offset.y,mapHeight*tilePixels,height);
  if(smooth&&this.current&&Math.abs(this.current.scale-scale)<.001){x=this.current.x+(x-this.current.x)*.3;y=this.current.y+(y-this.current.y)*.3;}
  this.current={x:Math.round(x*2)/2,y:Math.round(y*2)/2,scale,width,height,mapWidth,mapHeight};return this.current;
 }
 tileAt(px,py){const {x,y,scale}=this.current||{x:0,y:0,scale:1};return {x:Math.floor((px-x)/scale/64),y:Math.floor((py-y)/scale/64)};}
}

 const colors={f:'#395e4b',g:'#73835b',r:'#b9a17a',x:'#4b5050',w:'#477b96',b:'#bb9361',v:'#98734d',m:'#89917d',s:'#556f63',d:'#c2ad7b'};

// B4 graphics sample (v0.4, PROPOSED — not wired into the game until approved).
// Original pixel art painted at 48 logical pixels per tile: per-pixel shading ramps with
// ordered dithering, coloured outlines, organic terrain edges and hand-built figures.

const HD_TILE=48;

// ---------- colour helpers ----------
const hex=h=>{const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];};

// hue-shifted toward violet in shadow and warm yellow in light (classic pixel-art ramp).
function ramp(h){const c=hex(h);return [mixRGB(c,SHADOW,.55),mixRGB(c,SHADOW,.28),c,mixRGB(c,LIGHT,.22),mixRGB(c,LIGHT,.45)].map(v=>pack(v));}
const col=h=>pack(hex(h));
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
const dither=(x,y,v)=>v>BAYER[(y&3)*4+(x&3)];

const hash=(x,y,s=0)=>{let h=(x*374761393+y*668265263+s*1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;};
const smooth=t=>t*t*(3-2*t);
function noise(x,y,scale,s=0){const gx=x/scale,gy=y/scale,x0=Math.floor(gx),y0=Math.floor(gy),fx=smooth(gx-x0),fy=smooth(gy-y0);const a=hash(x0,y0,s),b=hash(x0+1,y0,s),c=hash(x0,y0+1,s),d=hash(x0+1,y0+1,s);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy;}

// ---------- pixel buffer ----------
class Pix{

 rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,c);}

const GRASS=['#43623a','#527440','#5f8445','#6d924c','#8cad5c'].map(col);

const tileAt=(map,x,y)=>map[y]?.[x];
const isLike=(t,set)=>t!==undefined&&set.includes(t);
// ground layer for one tile into a Pix covering the whole map (global coords keep noise seamless)

const KIND={g:'grass',f:'grass',v:'grass',t:'grass',h:'grass',r:'dirt',x:'grass',m:'grass',d:'sand',w:'water',b:'water',s:'swamp',k:'flag',q:'flag',p:'plank'};

// ---------- scene composition ----------
function drawShadow(c,x,y,w=14,h=4){c.fillStyle='rgba(20,24,30,.32)';c.beginPath();c.ellipse(x,y,w,h,0,0,Math.PI*2);c.fill();}
function drawFlame(c,x,y,t,s=1){for(let i=0;i<5;i++){const ph=t/120+i*1.7,h=(10+6*Math.sin(ph))*s,w=4*s;c.fillStyle=i%2?'#ffcf6a':'#f07a32';c.fillRect(Math.round(x-8*s+i*4*s),Math.round(y-h),Math.round(w),Math.round(h));}c.fillStyle='#fff2b0';c.fillRect(Math.round(x-2*s),Math.round(y-8*s),Math.round(4*s),Math.round(5*s));}

// src/render/hd-world.js
// B4 rollout: bridges the 48-pixel original art in hd-art.js to the 64-unit world coordinates
// used by every renderer, hit test and camera. Art is pre-scaled ×3 (nearest) once and drawn
// with smoothing so the 4/3 world ratio never produces uneven pixel widths.
const HD_K=64/HD_TILE,HD_UP=3;
const hdUpCache=new WeakMap();
function hdUp(src){let out=hdUpCache.get(src);if(out)return out;out=document.createElement('canvas');out.width=src.width*HD_UP;out.height=src.height*HD_UP;const g=out.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(src,0,0,out.width,out.height);hdUpCache.set(src,out);return out;}
// draw an hd-art canvas at hd-art pixel coordinates (ax,ay) converted to world units
function hdBlit(c,src,wx,wy){const up=hdUp(src),smooth=c.imageSmoothingEnabled;c.imageSmoothingEnabled=true;c.drawImage(up,wx,wy,src.width*HD_K,src.height*HD_K);c.imageSmoothingEnabled=smooth;}

// ---------- terrain ----------
const hdGroundCache=new Map();
// bake(o) → true draws that decor into the ground once (static scenery no actor can stand behind)
function hdGround(key,map,theme='',bake=null){if(hdGroundCache.has(key))return hdGroundCache.get(key);const {pix,objects}=paintGround(map,{theme}),base=pix.canvas(),kept=[];if(bake){const g=base.getContext('2d');g.imageSmoothingEnabled=false;const baked=objects.filter(o=>bake(o)).sort((a,b)=>(a.key??a.y)-(b.key??b.y));for(const o of baked)drawHDObjectRaw(g,o);for(const o of objects)if(!baked.includes(o))kept.push(o);}else kept.push(...objects);const g={canvas:hdUp(base),objects:kept,width:map[0].length,height:map.length};hdGroundCache.set(key,g);if(hdGroundCache.size>6)hdGroundCache.delete(hdGroundCache.keys().next().value);return g;}
// same decor drawn at native hd-art scale (for baking)
function drawHDObjectRaw(g,o){if(o.kind==='tree'){const size=Math.round(o.size*20)/20,s=treeSprite(o.seed%9,size);g.fillStyle='rgba(20,24,30,.32)';g.beginPath();g.ellipse(o.x,o.y-2,11*size,3.5*size,0,0,Math.PI*2);g.fill();g.drawImage(s,Math.round(o.x-20),Math.round(o.y-s.height+3));}else if(o.kind==='bush'){g.drawImage(bushSprite(o.seed%5),o.x-12,o.y-14);}}
// Ground is resampled once per device scale, so each frame is a 1:1 blit (software renderers
// otherwise filter the whole map every frame).
function drawHDGround(c,g){const t=c.getTransform(),scale=Math.abs(t.a),w=Math.max(1,Math.round(g.width*64*scale)),h=Math.max(1,Math.round(g.height*64*scale));
 if(!g.device||g.device.width!==w||g.device.height!==h){if(w*h>36e6){const smooth=c.imageSmoothingEnabled;c.imageSmoothingEnabled=true;c.drawImage(g.canvas,0,0,g.width*64,g.height*64);c.imageSmoothingEnabled=smooth;return;}const d=g.device||document.createElement('canvas');d.width=w;d.height=h;const dc=d.getContext('2d');dc.imageSmoothingEnabled=true;dc.imageSmoothingQuality='high';dc.drawImage(g.canvas,0,0,w,h);g.device=d;}
 c.save();c.setTransform(1,0,0,1,Math.round(t.e),Math.round(t.f));c.imageSmoothingEnabled=false;c.drawImage(g.device,0,0);c.restore();}
// world-space sort key (feet / base line) for decor objects
const hdObjectKey=o=>o.key!=null?o.key*HD_K:o.y*HD_K;
const shadowAt=(c,x,y,w,h)=>{c.fillStyle='rgba(20,24,30,.32)';c.beginPath();c.ellipse(x,y,w,h,0,0,Math.PI*2);c.fill();};
function drawHDObject(c,o,time=0){const K=HD_K;
 if(o.kind==='tree'){const size=Math.round(o.size*20)/20,s=treeSprite(o.seed%9,size);shadowAt(c,o.x*K,(o.y-2)*K,11*size*K,3.5*size*K);hdBlit(c,s,(o.x-20)*K,(o.y-s.height+3)*K);}
 if(o.kind==='bush'){shadowAt(c,o.x*K,o.y*K,9*K,3*K);hdBlit(c,bushSprite(o.seed%5),(o.x-12)*K,(o.y-14)*K);}
 if(o.kind==='ruin')hdBlit(c,ruinSprite(o.seed%4),o.x*K,(o.y-40)*K);
 if(o.kind==='crag'){shadowAt(c,(o.x+24)*K,(o.y-3)*K,20*K,5*K);hdBlit(c,cragSprite(o.seed%3),o.x*K,(o.y-56)*K);}
 if(o.kind==='bridge')hdBlit(c,bridgeSprite(o.map,o.tx,o.ty),o.x*K,o.y*K);
 if(o.kind==='well')hdBlit(c,wellSprite(),o.x*K,(o.y-48)*K);
 if(o.kind==='outpost'){shadowAt(c,(o.x+24)*K,(o.y-4)*K,20*K,5*K);hdBlit(c,outpostSprite(),o.x*K,(o.y-56)*K);}
 if(o.kind==='house'){const s=houseSprite(o.seed%6,o.w||1,o.h||1,o.state||'intact');c.fillStyle='rgba(20,24,30,.28)';c.fillRect((o.x+6)*K,(o.y-4)*K,(s.width-4)*K,6*K);hdBlit(c,s,o.x*K,(o.y-s.height+2)*K);if(o.state==='burning')hdHouseFire(c,o.x*K,(o.y-s.height+2)*K,s.width*K,(o.w||1),time);}
}
function hdHouseFire(c,x,y,w,tiles,time){for(let i=0;i<tiles*2;i++){const fx=x+16+i*(w-28)/Math.max(1,tiles*2-1),fy=y+22+(i%2)*10;for(let k=0;k<5;k++){const ph=time/120+k*1.7+i,h=(13+8*Math.sin(ph)),wd=5;c.fillStyle=k%2?'#ffcf6a':'#f07a32';c.fillRect(Math.round(fx-10+k*5),Math.round(fy-h),wd,Math.round(h));}c.fillStyle='#fff2b0';c.fillRect(Math.round(fx-2),Math.round(fy-10),5,6);}
 for(let i=0;i<7;i++){const r=Math.round(5+i*1.8),px=Math.round(x+w/2-6+i*4+Math.sin(i*1.3+time/500)*4),py=Math.round(y-4-i*10-(time/40)%10);c.fillStyle=`rgba(70,66,72,${Math.max(0,.30-i*.035)})`;c.fillRect(px-r,py-r+2,r*2,r*2-4);c.fillRect(px-r+2,py-r,r*2-4,r*2);}}

function recoveryAmount(current,max,ratio=0){return ratio>0&&current<max?Math.min(max-current,Math.max(1,Math.floor(max*ratio))):0;}
function recoveryValue(s,u,x=u.x,y=u.y){const t=terrainAt(x,y,s);return recoveryAmount(u.hp,u.maxHP,t?.hpRecovery)+recoveryAmount(u.mp,u.maxMP,t?.mpRecovery);}
function applyTerrainRecovery(s){
 if(s.screen!=='battle')return [];
 const team=s.phase==='player'?'ally':'enemy',marker=`${s.turn}:${s.phase}`,events=[];
 for(const u of s.units.filter(u=>u.team===team&&alive(u))){if(u.recoveryPhase===marker)continue;u.recoveryPhase=marker;const t=terrainAt(u.x,u.y,s);for(const [stat,max,ratio]of [['hp',u.maxHP,t.hpRecovery],['mp',u.maxMP,t.mpRecovery]]){const n=recoveryAmount(u[stat],max,ratio);if(!n)continue;u[stat]+=n;const text=`${stat.toUpperCase()} +${n}`;events.push({type:'heal',id:u.id,text,resource:stat,...(stat==='hp'?{toHP:u.hp}:{})});s.log.push(`${u.name} · ${t.name} · ${text}`);}}
 s.feedback.push(...events);return events;
}

 if(n.active&&(!STORY[n.active.key]||!Number.isInteger(n.active.index)||n.active.index<0||n.active.index>=STORY[n.active.key].length))throw Error('대화 위치가 손상되었습니다.');
 if(!Array.isArray(c.completed)||c.completed.some(id=>!MISSIONS[id])||!c.flags||!c.bonds||!c.tacticalMemory||[c.flags,c.bonds,c.tacticalMemory].some(v=>typeof v!=='object'||Array.isArray(v))||Object.values(c.tacticalMemory).some(v=>!Number.isInteger(v)||v<0))throw Error('캠페인 상태가 손상되었습니다.');
 if(c.choices!=null&&(typeof c.choices!=='object'||Array.isArray(c.choices)||Object.values(c.choices).some(v=>typeof v!=='string'||v.length>40)))throw Error('선택 기록이 손상되었습니다.');

 if(s?.schema===2){s.schema=3;s.version='0.3.0';ensureEconomy(s);s.frontier=frontierState(s.missionId);s.campaign.frontier=structuredClone(s.frontier);if(s.stageStart)s.stageStart=migrate(s.stageStart);}

 if(s?.schema===4){s.schema=5;s.version='0.3.2';legacyRewardCatchup(s.campaign.economy,s.campaign);legacyRewardCatchup(s.economy,s.campaign);if(s.stageStart)s.stageStart=migrate(s.stageStart);}

function serialize(s){validate(s);const data=JSON.stringify({...s,feedback:[]});return JSON.stringify({format:'AshenCrown',schema:SCHEMA,checksum:checksum(data),data});}

function saveGame(s,storage){let old,previousBackup,writing=false;try{const data=serialize(s);old=storage.getItem(SAVE_KEY);previousBackup=storage.getItem(BACKUP_KEY);if(old){try{deserialize(old);storage.setItem(BACKUP_KEY,old);}catch{}}

function loadGame(storage){try{const data=storage.getItem(SAVE_KEY);if(!data)return {state:null};try{return {state:deserialize(data)};}catch(primary){const backup=storage.getItem(BACKUP_KEY);if(backup)return {state:deserialize(backup),warning:'최근 저장이 손상되어 이전 정상 저장을 복구했습니다.'};return {state:null,warning:`저장을 불러올 수 없습니다: ${primary.message}`};}}catch(e){return {state:null,warning:`브라우저 저장을 사용할 수 없습니다: ${e.message}`};}}
function resetSave(storage){try{storage.removeItem(SAVE_KEY);storage.removeItem(BACKUP_KEY);return {ok:true};}catch(e){return {ok:false,error:e.message};}}

const RANGE_STYLE={move:{fill:'rgba(43,161,232,.62)',border:'#a9e8ff'},attack:{fill:'rgba(228,78,64,.62)',border:'#ffbf89'},support:{fill:'rgba(70,190,117,.60)',border:'#cbf5a6'}};
function moveDuration(path,mode='step',speed=1){return mode==='instant'||path.length<2?0:(path.length-1)*(mode==='step'?320:210)/speed;}
function motionAt(path,elapsed,mode='step',speed=1){
 const duration=moveDuration(path,mode,speed),progress=duration?Math.max(0,Math.min(1,elapsed/duration)):1,step=progress*(path.length-1),index=Math.min(path.length-2,Math.floor(step));

}
function attackKind(unit,mode){if(unit.id==='lia'&&mode==='skill')return 'fireball';if(unit.range?.[0]>=2)return 'arrow';if(unit.id==='kai')return 'dagger';return unit.kind==='bandit'||unit.kind==='captain'?'axe':'sword';}

  if(event.type==='move'){const duration=moveDuration(event.path,movement,speed);motions.push({...event,delay:cursor,duration,movement,speed});cursor+=duration;}
  else if(event.type==='attack'){
   const unit=units.find(u=>u.id===event.id),kind=attackKind(unit,event.mode),duration=(reduced?220:kind==='fireball'?1250:kind==='arrow'?680:720)/speed,impact=cursor+duration*(kind==='fireball'?.56:kind==='arrow'?.65:.46);
   plans.push({...event,kind,delay:cursor,duration,impact});lastImpact=impact;cursor+=duration;
  }else{const delay=['hit','critical','miss','death'].includes(event.type)?lastImpact:Math.max(0,cursor-180/speed),duration=(['level','potential'].includes(event.type)?1400:900)/speed;plans.push({...event,delay,duration});
   if(Number.isFinite(event.toHP))hp.push({id:event.id,delay,hp:event.toHP});
  }

}

function contextMessage(s,u,ui){

 if(ui.notice)return ui.notice;
 if(s.screen==='deployment')return ui.mode==='deploy'?'푸른 배치 칸을 누르세요. 다른 장수의 위치에 놓으면 서로 교체합니다.':'장수를 누르면 즉시 선택됩니다. 하단의 배치 이동으로 위치를 변경하세요.';
 if(u.hp<=0)return '전투불능 · 다른 동료를 선택하세요.';
 if(u.acted)return '행동 완료 · 다른 장수를 누르거나 턴을 종료하세요.';
 if(ui.mode==='move')return `MOV ${effectiveStats(s,u).mov+(u.shadowBonus||0)} · 푸른 칸으로 이동. 같은 위치를 다시 누르면 제자리에서 행동합니다.`;
 if(ui.mode==='skill')return `${u.skill} · ${skillCost(u)} MP · ${u.description}`;
 if(ui.mode==='attack')return `공격 사거리 ${u.range.join('–')} · 붉은 범위의 적을 눌러 피해와 반격을 확인하세요.`;

// src/ui/popover-position.js
// Classic SRPG placement: the command list sits right beside the unit (right side first, then
// left, below, above). It never covers the unit itself and avoids legal targets when a
// beside-the-unit slot exists; it is always clamped inside the field.
function placePopover({width,height,popupWidth,popupHeight,anchor,tile=48,protectedPoints=[]}){
 const margin=6,gap=Math.max(14,tile/2+6),maxX=Math.max(margin,width-popupWidth-margin),maxY=Math.max(margin,height-popupHeight-margin),clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
 const half=Math.max(10,tile/2);
 const slots=[
  {x:anchor.x+gap,y:anchor.y-popupHeight/2,side:'right'},
  {x:anchor.x-gap-popupWidth,y:anchor.y-popupHeight/2,side:'left'},
  {x:anchor.x-popupWidth/2,y:anchor.y+gap,side:'below'},
  {x:anchor.x-popupWidth/2,y:anchor.y-gap-popupHeight,side:'above'}];
 let best=null;
 slots.forEach((slot,order)=>{
  const fitsX=slot.x>=margin&&slot.x+popupWidth<=width-margin,fitsY=slot.y>=margin&&slot.y+popupHeight<=height-margin;
  const x=clamp(slot.x,margin,maxX),y=clamp(slot.y,margin,maxY);
  const covers=(p,r)=>p.x+r>x&&p.x-r<x+popupWidth&&p.y+r>y&&p.y-r<y+popupHeight;
  let score=order*10;
  if((slot.side==='right'||slot.side==='left')&&!fitsX)score+=5000;
  if((slot.side==='below'||slot.side==='above')&&!fitsY)score+=5000;
  if(covers(anchor,half))score+=1000000;
  for(const p of protectedPoints)if(covers(p,p.radius??12))score+=100*(p.weight??1);
  if(!best||score<best.score)best={x,y,score,side:slot.side};
 });
 return {x:Math.round(best.x),y:Math.round(best.y),side:best.side};
}

 if(state.screen==='title')html=`<div class="title-inner"><div class="eyebrow">AN ORIGINAL FANTASY TACTICAL RPG</div><h1>Ashen<br>Crown<span class="accent">.</span></h1><div class="subtitle">ACT I — The Living Frontier</div><p>재가 된 왕관 아래, 다섯 동료의 이야기가 시작됩니다.<br>당신의 선택은 전장을 바꾸고, 장수의 숨겨진 가능성을 깨웁니다.</p><div class="title-actions"><button class="primary" data-do="new">캠페인 시작 →</button><button data-do="load" ${loaded.state||state.campaign.clears?'':'disabled'}>저장 불러오기</button><button data-do="campaign">Campaign</button><button data-do="audio">♫ Music</button><button data-do="help">플레이 안내</button></div><div class="title-bottom"><div>TACTICAL COMBAT<br><span class="accent">지형 · 사거리 · 협공</span></div><div>CHARACTER GROWTH<br><span class="accent">다섯 장수 · 서로 다른 역할</span></div><div>HIDDEN POTENTIAL<br><span class="accent">행동에서 발견하는 단서</span></div></div></div>`;
 else if(state.screen==='intro')html=`<div class="screen-inner"><div class="eyebrow">ACT I · MISSION ${state.missionId}</div><h2>${missionOf(state).title}</h2><div class="story">${esc(missionOf(state).objective)}<br><br>${esc(missionOf(state).brief)}<br><br>아렌의 명령 아래, 다섯 동료가 각자의 이유로 전장에 나섭니다.</div><button class="primary" data-do="warroom">동료들과 전투 준비 →</button></div>`;
 else if(state.screen==='warroom')html=`<div class="screen-inner council-screen">${councilHTML(state,esc,portrait,ui.selected)}</div>`;
 else if(state.screen==='result'){
 const victory=state.outcome==='victory',last=state.campaign.results.at(-1),star=(ok,label)=>`<span class="star ${ok?'on':''}" title="${label}">${ok?'★':'☆'}<small>${label}</small></span>`;
 const optional=rulesOf(state)?rulesOf(state).optional(state):state.missionId===2?(state.campaign.flags.mission_02_prisoner_captured?'생포 성공':'생포 실패'):`구조 ${last.rescued}/${missionOf(state).civilians.length}`;
 const heroes=HEROES.map(h=>{const a=findUnit(state,h.id),start=state.missionStart.find(m=>m.id===a.id),up=a.level>start.level,clue=a.clues.length>(state.stageStart?.units?.find(u=>u.id===a.id)?.clues.length??a.clues.length);return `<article class="growth-card hero-tile ${up?'leveled':''} ${a.hp===0?'down':''}" data-growth="${a.id}">${up?'<b class="lvup">LEVEL UP!</b>':''}${portrait(a,'result-portrait')}<strong>${esc(a.name)}</strong><span class="lv">LV ${up?`${start.level}→`:''}${a.level}</span><div class="xpbar" title="EXP ${a.xp}/100"><i style="width:${a.xp}%"></i></div><span class="gain">+${a.earnedXP} EXP</span>${up?`<span class="stat-ups">HP+${a.maxHP-start.stats.maxHP} ATK+${a.atk-start.stats.atk} DEF+${a.def-start.stats.def}</span>`:''}${clue?'<span class="clue" title="잠재력 단서 발견">✦</span>':''}${a.hp===0?'<span class="ko">전투불능</span>':''}</article>`;}).join('');
 html=`<div class="screen-inner result-v2"><div class="result-banner ${victory?'win':'lose'}"><h2>${victory?'VICTORY':'DEFEAT'}</h2><span>${esc(missionOf(state).title)} · 턴 ${state.turn}</span></div>${victory?'':`<p class="result-reason">${esc(state.reason)}</p>`}${renderVictoryRewards(last)}<div class="stars">${star(last.allAlive,'전원 생존')}${star(last.swift&&victory,`${missionOf(state).par}턴 이내`)}${star(victory&&!/0\/|실패/.test(optional),esc(optional))}</div><div class="growth-list hero-row">${heroes}</div><div class="row result-actions">${victory&&state.missionId<LAST_MISSION&&state.campaign.completed.includes(state.missionId)?`<button class="primary" data-do="next-mission" ${ui.busy?'disabled':''}>Mission ${state.missionId+1} →</button>`:''}<button class="primary" data-do="aftermath">${victory?'마을 / 야영지로':'야영지에서 다시 준비'} →</button><button data-do="replay" ${ui.busy?'disabled':''}>${victory?'연습':'재도전'}</button><button data-do="fresh-replay" ${ui.busy?'disabled':''}>LV 초기 연습</button><button data-do="backup" ${ui.busy?'disabled':''}>백업</button></div></div>`;
 }
 $('#screen').innerHTML=`<div class="screen-overlay ${state.screen==='result'?'result-overlay':''}">${html}</div>`;
}
function modal(title,body,actions){heldMovement.clear();$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-title"><h2>${esc(title)}</h2><button class="modal-close" data-do="close-modal" aria-label="닫기">×</button></div>${body}<div class="row">${actions}</div></section></div>`;const dialog=$('#modal-root .modal');dialog.tabIndex=-1;dialog.focus({preventScroll:true});dialog.scrollTop=0;}
function closeModal(){doorStep=false;if($('#modal-root .modal')?.getAttribute('aria-label')==='군사 리아'){state.frontier.advisorPending=false;syncFrontier(state);save();}if($('#modal-root .modal')?.getAttribute('aria-label')==='동료의 약속'){state.frontier.pendingRecruit=null;syncFrontier(state);save();}pendingTransaction=null;shopKind=null;$('#modal-root').innerHTML='';audio.select(musicScene(state));if(state.narrative.active){renderStory();paintPortraits();}$('#battle-map').focus({preventScroll:true});}
const help=()=>modal('전투 안내',`<p><b>목표:</b> 주민 2명 구출 + 산적 대장 Garr 격파. 주민 한 명이라도 사망하거나 아군이 전멸하면 패배합니다.</p><p><b>조작:</b> 장수 탭 → 작은 행동 메뉴 → 이동 → 목적지 → 이동 확정. 이후 공격/스킬 → 대상 → 예측 → 행동 확정. 유닛당 이동 1회와 행동 1회. 공격·스킬·구출·약·대기는 행동을 마칩니다. 행동 전 이동은 Z로 취소할 수 있습니다.</p><p><b>지형:</b> Grass / Road 이동 비용 1. Forest 비용 2, DEF +1 / 회피 +12%; Kai는 숲 비용 1. Village DEF +2. Ruin은 통과 불가. 사거리는 직교 거리입니다. 건물이나 숲이 사격을 차단하지 않습니다.</p><p><b>스킬:</b> Guard는 인접 동료를 보호하며, Eric이 그 동료 옆에 있을 때 첫 인접 근접 피해를 대신 받습니다. Fire Bolt는 RES를 적용합니다. Heal은 자기 회복 가능. Quick Strike의 협공은 적 반대편 인접 아군이 있어야 성립합니다.</p><p><b>이벤트:</b> TURN 3 증원, TURN 5 주민 공격 시작. 주민 옆에서 구출 행동. 마법에도 기본 공격 사거리 내에서는 반격 가능. 반격에 대한 재반격은 없습니다.</p><p><b>키:</b> 1 이동 · 2 공격 · 3 스킬 · 4 구출 · Z 취소 · W 대기 · Tab 다음 장수 · E Phase 종료 · Escape 취소. 휠 Zoom, 우클릭/Shift 드래그 Pan. Touch는 탭과 드래그 Pan 지원. 선택한 장수의 얼굴과 HP/MP는 하단에 표시됩니다. 작은 메뉴에서 스킬·도구·특성을 열 수 있습니다. 하단에서 칸별 걷기 / 연속 걷기 / 즉시 이동, 속도와 약한 효과를 선택하세요. 두 손가락으로 확대할 수 있습니다. 이동을 선택한 뒤 같은 Tile을 누르면 제자리에서 행동합니다.</p><p>로컬 저장은 현재 브라우저와 파일 경로에 연결됩니다. 파일을 옮기거나 다른 브라우저를 사용하기 전 텍스트 백업을 권장합니다. 초기화는 메뉴에서 직접 확인합니다.</p>`,'');
function nextHero(){const ids=HEROES.map(h=>h.id),start=ids.indexOf(ui.selected);for(let i=1;i<=5;i++){const u=findUnit(state,ids[(start+i)%5]);if(canAct(state,u)){ui.selected=u.id;renderer.focus(u.x,u.y);ui.mode=u.moved?'choose':'move';ui.menu='root';ui.preview=null;ui.notice=null;ui.inspected=null;render();return;}}ui.preview=null;render();}
async function effects(before){for(const e of state.feedback)if(['attack','heal','death'].includes(e.type))audio.effect(e.type);if(state.outcome&&!before.outcome)audio.stinger(state.outcome);
 const duration=renderer.addEffects(state.feedback,before,{movement:ui.movement,speed:ui.speed,reduced:ui.reduced});const potential=state.feedback.find(e=>e.type==='potential');if(potential){const u=findUnit(state,potential.id);toast(`${u.name} · Potential Clue Discovered — ${u.clues.at(-1)} (1/3)`);}await new Promise(r=>setTimeout(r,duration+24));}
async function startEnemyPhaseUI(){const before=structuredClone(state);if(!beginEnemyPhase(state))return;ui.busy=true;const playing=effects(before);save();render();await playing;ui.busy=false;await enemyLoop();}
async function enemyLoop(){if(enemyRunning)return;ui.menu=null;enemyRunning=true;ui.busy=true;render();try{while(state.phase==='enemy'&&state.screen==='battle'&&!state.narrative.active){const before=structuredClone(state);advanceEnemy(state);const actor=findUnit(state,state.feedback.find(e=>e.type==='move'||e.type==='attack')?.id);if(actor)renderer.focus(actor.x,actor.y);const playing=effects(before);const stored=save();if(!stored.ok&&state.outcome==='victory'&&!before.outcome){state=before;renderer.clearPresentation();toast('승리 보상을 저장하지 못했습니다. 이전 행동으로 돌아갑니다.');break;}render();await playing;}ui.preview=null;if(!canAct(state,findUnit(state,ui.selected)))ui.selected=HEROES.find(h=>alive(findUnit(state,h.id)))?.id||'eric';ui.mode='choose';const selected=findUnit(state,ui.selected);if(selected)renderer.focus(selected.x,selected.y);}finally{ui.busy=false;enemyRunning=false;commit();}}
async function execute(mode,target){if(ui.busy)return;const before=structuredClone(state);const r=performAction(state,ui.selected,mode,target);if(!r.ok){toast(r.error);return;}ui.preview=null;ui.menu=null;ui.notice=null;ui.inspected=null;ui.phaseConfirm=false;ui.busy=true;const playing=effects(before);const stored=save();if(!stored.ok&&state.outcome==='victory'&&!before.outcome){state=before;renderer.clearPresentation();ui.busy=false;render();toast('승리 보상을 저장하지 못했습니다. 이전 행동으로 돌아갑니다.');return;}render();await playing;ui.busy=false;if(state.screen==='battle')nextHero();commit();promptTurnEnd();}
function promptTurnEnd(){if(state.screen!=='battle'||state.phase!=='player'||state.outcome||state.narrative.active||ui.busy||ui.pendingMove||state.units.some(u=>canAct(state,u)))return;ui.turnPrompt=true;syncTurnPrompt();}
function syncTurnPrompt(){const t=$('#turn-prompt');if(!t)return;const left=state.units.filter(u=>canAct(state,u)).length,show=!!ui.turnPrompt&&state.screen==='battle'&&state.phase==='player'&&!state.outcome&&!state.narrative.active&&!ui.busy&&!ui.pendingMove&&(ui.turnPrompt==='early'?left>0:left===0);if(!show)ui.turnPrompt=false;const html=show?`<p class="turn-end-copy">${left?`아직 행동하지 않은 장수가 <b>${left}명</b> 있습니다.`:'모든 장수가 행동을 마쳤습니다.'}<br><b>다음 턴으로 넘어가겠습니까?</b></p><div class="row"><button class="primary" data-do="confirm-phase">예</button><button data-do="dismiss-turn-prompt">아니오</button></div>`:'';if(t.innerHTML!==html)t.innerHTML=html;t.hidden=!show;}
async function dispatch(action,id){if(state.narrative.active&&!['story-next','story-skip','story-auto','story-fast','story-log','audio','close-modal','save','menu','backup','copy-backup','restore','load','restart-stage','confirm-restart-stage'].includes(action))return;
if(ui.pendingMove&&!['confirm-move','cancel-move','close-unit-menu','zoom-in','zoom-out','reset-camera','help','close-modal'].includes(action)){ui.menu='move-confirm';render();toast('먼저 이동을 확정하거나 취소하세요.');return;}if(ui.busy&&!['journal','zoom-in','zoom-out','reset-camera','help','close-modal'].includes(action))return;
 if(await frontierDispatch(action,id))return;
 switch(action){
 case 'story-next':case 'story-skip':advanceStory(state,action==='story-skip');commit();if(!state.narrative.active)promptTurnEnd();if(!state.narrative.active&&state.phase==='enemy'&&state.screen==='battle')enemyLoop();break;
 case 'story-fast':state.narrative.fast=!state.narrative.fast;commit();break;
 case 'story-auto':state.narrative.auto=!state.narrative.auto;commit();break;
 case 'story-log':modal('Dialogue History',`<div class="history">${state.narrative.history.map(l=>`<p><b>${esc(SPEAKERS[l.speaker]?.name||'Enemy')}</b> · ${esc(l.text)}</p>`).join('')||'<p>아직 기록이 없습니다.</p>'}</div>`,'');break;
 case 'audio':showAudio();break;
 case 'campaign':showCampaign();break;
 case 'choose-mission':{if(['battle','deployment'].includes(state.screen)){toast('현재 전투/배치를 마친 뒤 Campaign을 선택하세요.');break;}if(state.outcome==='defeat')state=replay(state);const idn=Number(id);if(!MISSIONS[idn])break;if(idn>1&&!state.campaign.completed.includes(idn-1))break;state=newGame(state.initialSeed,state.campaign,idn);ui.selected='eric';closeModal();enterHub(state);renderer.clearPresentation();renderer.reset();commit();break;}
 case 'records-choice':showRecordsChoice();break;
 case 'item-detail':showItems(id);break;
 case 'unit-info':{const [uid,tab='ability']=String(id).split('|');const u=findUnit(state,uid);if(u&&(u.team!=='object')){modal('장수 정보',unitInfoHTML(state,u,tab,esc,portrait),'');paintPortraits();}break;}
 case 'records-pick':{if(state.missionId!==4||state.practice||state.frontier?.phase!=='aftermath'||state.campaign.choices?.m04_records_choice||!['kept','reported'].includes(id))break;state.campaign.choices??={};state.campaign.choices.m04_records_choice=id;closeModal();enqueueStory(state,`after:4:${id}`);openStory(state);commit();break;}
 case 'appearance':showAppearance();break;
 case 'new':state=newGame(state.initialSeed,state.campaign,state.campaign.completed.includes(1)?Math.min(LAST_MISSION,(state.campaign.completed.at(-1)||0)+1):1);ui.selected='eric';enterHub(state);commit();break;
 case 'warroom':await prepareCouncil();break;case 'deploy':state.frontier.ready.formation=true;syncFrontier(state);setScreen('deployment');break;
 case 'select':{const u=findUnit(state,id);if(!u||u.team!=='ally'||state.screen==='battle'&&!alive(u))break;ui.selected=id;ui.menu=state.screen==='battle'?'root':null;ui.mode=state.screen==='battle'&&!u.moved&&!u.acted?'move':initialMode(u);renderer.focus(u.x,u.y);ui.preview=null;ui.notice=null;ui.inspected=null;ui.phaseConfirm=false;render();break;}
 case 'preset':presetDeployment(state,id);commit();break;
 case 'start-battle':if(state.screen==='deployment'){modal('출전 최종 확인',`<p><b>${esc(missionOf(state).objective)}</b></p><p>${esc(councilInfo(state).plan)}</p><p>Equipment / Items / Formation / Objective<br>기본 장비로 출전 가능 · 구매 준비는 선택입니다.</p><p>기본 회복약 2개 + 구매 도구 ${itemCount(state.economy)}개. 출전 이후 장비 변경은 잠깁니다.</p>`,'<button class="primary" data-do="confirm-battle">출전 확정</button><button data-do="close-modal">계속 준비</button>');}break;
 case 'confirm-battle':if(startBattle(state)){closeModal();ui.mode='choose';ui.notice=null;commit();}break;
 case 'open-unit-menu':ui.menu=ui.pendingMove?'move-confirm':'root';render();break;
 case 'submenu':ui.menu=id;render();break;
 case 'close-unit-menu':if(ui.pendingMove)await cancelMovement();else{ui.menu=null;ui.preview=null;render();}break;
 case 'cancel-target':ui.menu=null;ui.preview=null;render();break;
 case 'confirm-move':confirmMovement();break;
 case 'cancel-move':await cancelMovement();break;
 case 'mode':if(canAct(state,findUnit(state,ui.selected))||state.screen==='deployment'){if(id==='skill'&&ui.selected==='eric'&&state.screen==='battle'){ui.mode='skill';ui.preview='eric';ui.menu='forecast';ui.notice=null;ui.inspected=null;ui.phaseConfirm=false;render();break;}ui.mode=id;ui.menu=null;ui.preview=null;ui.notice=null;ui.inspected=null;ui.phaseConfirm=false;render();}break;
 case 'undo':if(undoMove(state,ui.selected)){ui.menu='root';ui.mode='choose';ui.preview=null;commit();}break;
 case 'wait':await execute('wait');break;case 'item':await execute('item');break;
 case 'confirm':if(ui.preview)await execute(ui.mode,ui.preview);break;
 case 'cancel':if(ui.pendingMove){await cancelMovement();break;}ui.menu=null;ui.preview=null;ui.mode='choose';ui.notice=null;ui.inspected=null;ui.phaseConfirm=false;render();break;
 case 'next':nextHero();break;
 case 'end-phase':{ui.menu=null;const n=state.units.filter(u=>canAct(state,u)).length;if(n){ui.turnPrompt='early';ui.preview=null;render();}else await startEnemyPhaseUI();break;}
 case 'dismiss-turn-prompt':ui.turnPrompt=false;syncTurnPrompt();break;
 case 'confirm-phase':ui.turnPrompt=false;ui.menu=null;ui.phaseConfirm=false;await startEnemyPhaseUI();break;
 case 'next-mission':{if(state.missionId===4&&state.frontier.phase==='aftermath'&&!state.practice&&!state.campaign.choices?.m04_records_choice){showRecordsChoice();break;}const next=state.frontier.phase==='aftermath'&&state.missionId<LAST_MISSION?newGame(state.initialSeed+1,state.campaign,state.missionId+1):nextMission(state);if(next){state=next;ui.selected='eric';ui.menu=null;ui.preview=null;enterHub(state);renderer.clearPresentation();renderer.reset();commit();}break;}
 case 'replay':case 'fresh-replay':ui.menu=null;ui.pendingMove=null;state=replay(state,action==='fresh-replay');enterHub(state);ui.selected='eric';ui.mode='choose';ui.preview=null;renderer.reset();commit();break;
 case 'save':if(save().ok)toast('전투·성장·RNG 상태를 저장했습니다.');break;
 case 'load':{const r=loadGame(storage);if(r.state){ui.menu=null;ui.pendingMove=null;state=r.state;ui.phaseConfirm=false;ui.notice=null;ui.inspected=null;ui.preview=null;ui.mode='choose';ui.selected='eric';closeModal();render();if(r.warning)toast(r.warning);if(state.phase==='enemy'&&state.screen==='battle')enemyLoop();}else toast(r.warning||'저장이 없습니다.');break;}

async function walkToFrontier(x,y){if(frontierWalking||$('#modal-root').children.length||state.narrative.active)return;const door=!state.frontier.interior&&currentHub(state).places.find(p=>p.entrance&&p.entrance.tileX===x&&p.entrance.tileY===y);if(door){x=door.x;y=door.y;}const npc=currentHub(state).npcs.find(n=>n.x===x&&n.y===y);const path=npc?[[0,-1],[-1,0],[1,0],[0,1]].map(([dx,dy])=>frontierPath(state,x+dx,y+dy)).filter(Boolean).sort((a,b)=>a.length-b.length)[0]:frontierPath(state,x,y);if(!path){toast('건물과 사람을 피해 길 위의 목적지를 누르세요.');return;}frontierWalking=true;const epoch=navigationEpoch,startInterior=state.frontier.interior;try{for(const [a,b]of path.slice(1)){if(epoch!==navigationEpoch||state.frontier.interior!==startInterior||state.screen!=='exploration'||state.narrative.active||$('#modal-root').children.length)break;const f=state.frontier;stepAren(state,a-f.x,b-f.y);commit();const c=$('#frontier-map');if(c)drawHub(c,{...state,walking:true},{time:performance.now()});await new Promise(resolve=>setTimeout(resolve,75));}}finally{frontierWalking=false;render();}if(door&&!$('#modal-root').children.length&&state.frontier.x===door.x&&state.frontier.y===door.y)confirmEntrance(door);if(npc&&!$('#modal-root').children.length)await dispatch('npc',npc.id);}
document.addEventListener('click',e=>{if(e.target.id!=='frontier-map'||e.shiftKey||hubPanUsed){hubPanUsed=false;return;}const box=e.target.getBoundingClientRect(),point=hubCamera.tileAt(e.clientX-box.left,e.clientY-box.top);walkToFrontier(point.x,point.y);});

  if(!interactions(state).some(n=>n.id==='advisor'&&n.npc)){const n=currentHub(state).npcs.find(n=>n.id==='advisor');await walkToFrontier(n.x,n.y);}

function openShop(kind,mode=shopMode){if(state.screen!=='exploration'||state.frontier.interior!==kind||!interactions(state).some(n=>n.service===kind))return;shopKind=kind;shopMode=mode;modal(kind==='weapon'?'Blacksmith · 무기점':'Item Shop · 도구점',mode==='buy'?shopHTML(state,kind,esc):ownedShopHTML(state,mode),`<button data-do="shop-owner">주인에게 돌아가기</button><button data-do="inventory">Party / 장비</button><button data-do="items">Inventory</button>`);audio.select('shop');}
function showInventory(id){if(!['exploration','warroom','deployment'].includes(state.screen)){toast('전투 전 준비 단계에서 장비를 바꿀 수 있습니다.');return;}shopKind=null;const hero=HEROES.some(h=>h.id===id)?id:ui.selected;ui.selected=hero;modal('Party · Equipment',inventoryHTML(state,hero,esc,portrait),'');paintPortraits();}
function showItems(sel=null){const e=state.economy,ids=Object.keys(TOOLS),bag=ids.flatMap(id=>Array.from({length:e.items[id]},()=>id)),pick=sel&&TOOLS[sel]?sel:bag[0]||ids[0],t=TOOLS[pick];
 const slots=Array.from({length:6},(_,i)=>bag[i]?`<button class="bag-slot ${bag[i]===pick?'active':''}" data-do="item-detail" data-id="${bag[i]}" aria-label="${esc(TOOLS[bag[i]].name)}">${itemIcon(bag[i],40)}</button>`:'<div class="bag-slot empty" aria-hidden="true"></div>').join('');
 const owner=id=>Object.entries(e.equipped).find(([,slots])=>Object.values(slots).includes(id))?.[0];

 modal('Inventory · 소지품',`<div class="bag-head"><span>${itemIcon('gold',26)}<b>${e.gold}</b> Gold</span><span>도구 <b>${itemCount(e)}</b>/6</span><span>${itemIcon('potion',22)} 기본 회복약 <b>${state.potions}</b>/2</span></div><div class="bag-layout"><div><div class="bag-label">가방</div><div class="bag-grid">${slots}</div><div class="bag-counts">${ids.map(id=>`<button class="bag-count ${id===pick?'active':''}" data-do="item-detail" data-id="${id}">${itemIcon(id,26)}<b>×${e.items[id]}</b></button>`).join('')}</div></div><div class="item-detail">${itemIcon(pick,56)}<div><h3>${esc(t.name)}</h3><p>${esc(t.description)}</p><small>구매 ${t.price} Gold · 판매 ${t.sell} Gold · 보유 ${e.items[pick]}</small></div></div></div><div class="bag-label">장비 보관함 ${e.gear.length}/24</div><div class="gear-grid">${gear}</div>${e.rewardPending.length?`<p class="bag-pending">보관 보상: ${e.rewardPending.map(rewardLabel).join(' / ')}</p>${frontierButton('transaction','빈 공간으로 보상 받기','collect-rewards|')}`:''}<p class="muted">도구는 공용 가방에 최대 6개. 전투에서 선택한 장수가 자신에게 사용합니다(이동 후 가능, 행동 1회). Retry/Stage Restart는 출전 직전 수량으로 돌아갑니다.</p>`,'');}
function compareGear(type,hero,instanceId=null){const g=GEAR[type],u=findUnit(state,hero);if(!g||!u)return '';const e=structuredClone(state.economy);let instance=e.gear.find(a=>a.id===instanceId);if(!instance){instance={id:'preview',type,level:0};e.gear.push(instance);}const before=effectiveStats(state,u);e.equipped[hero][g.slot]=instance.id;const after=effectiveStats({...state,economy:e},u);return `<p>${g.icon} <b>${g.name} ${instance.level?'+1':''}</b><br>${g.description}</p><p>비교: ${u.name} · 현재 ${g.slot} → 후보<br>${['atk','def','mag','res','spd','mov','hit'].map(k=>{const a=before[k]||0,b=after[k]||0,d=b-a;return `<span class="stat-delta">${k.toUpperCase()} ${a} → ${b} <b class="${d<0?'negative':'positive'}">(${d>0?'+':''}${d})</b></span>`;}).join('')}<br>사거리 ${u.range.join('–')} → ${u.range.join('–')} (0) · 지형 회피 변화 0<br>HIT 보너스 ${before.hit||0} → ${after.hit||0}</p><p>${g.heroes.includes(hero)?'병종 호환 · 구매 확정 시 선택 장수에게 장착':'병종 불일치 · 선택할 수 없습니다.'}</p>`;}
function transactionPreview(encoded){if(state.practice){toast('연습에서는 정식 자산 거래를 하지 않습니다.');return;}const shopReturn=state.frontier.interior;const [op,id,hero]=encoded.split('|'),g=state.economy.gear.find(a=>a.id===id);const req={op,id,hero,slot:op==='unequip'?id:op==='equip'?GEAR[g?.type]?.slot:null,token:`tx:${state.economy.nonce}`};const amount=op==='buy-item'?TOOLS[id]?.price:op==='sell-item'?-TOOLS[id]?.sell:op==='buy-gear'?GEAR[id]?.price:op==='upgrade'?40:op==='sell-gear'?-Math.floor((GEAR[g?.type]?.price||0)*.4):0;
 modal('거래 확인',`<p>${esc({ 'collect-rewards':'보관 보상 받기','buy-item':'도구 구매','sell-item':'도구 판매','buy-gear':'장비 구매','sell-gear':'장비 판매',upgrade:'장비 +1 강화',equip:'장비 장착',unequip:'기본 장비로 복귀'}[op]||op)} · ${esc(TOOLS[id]?.name||GEAR[id]?.name||GEAR[g?.type]?.name||id)}</p>${op==='upgrade'?`<p>강화 0 → +1 · ${bonusText(GEAR[g.type].upgrade)}<br>소유 장비 1개에 한 번만 적용됩니다.</p>`:''}<p>Gold ${state.economy.gold} → ${state.economy.gold-amount}${amount>0?` (−${amount})`:amount<0?` (+${-amount})`:''}</p>`,`<button class="primary" data-do="confirm-transaction">확정</button><button data-do="${shopReturn?'shop-back':'close-modal'}">취소</button>`);pendingTransaction=req;
}
async function frontierDispatch(action,id=''){
 const allowed=['advisor-locate','advisor-operation','advisor-recover','advisor-menu','mission-status','shop-service','shop-owner','enter-building','hub-zoom','hub-focus','shop-exit','purchase-hero','shop-back','walk','interact','npc','place','fast-map','fast-travel','hub-return','aftermath','affiliate','inventory','items','transaction','confirm-transaction','buy-preview','gear-info','gear-compare','tool','tool-confirm'];if(!allowed.includes(action))return false;
 if(frontierWalking&&!['items','inventory'].includes(action)){navigationEpoch++;while(frontierWalking)await new Promise(r=>setTimeout(r,16));}
 const f=ensureFrontier(state);
 if(action==='advisor-locate')await prepareCouncil();
 if(action==='advisor-operation'){if(openCouncil(state)){closeModal();commit();}else offerCouncilRecovery();}

 if(action==='mission-status'){const intel=councilInfo(state);modal('현재 임무',`<p>${esc(missionOf(state).title)}</p><p>${f.phase==='aftermath'?state.missionId===LAST_MISSION?'ACT I 진행 중 · 다음 작전은 준비 중입니다.':'전투를 마쳤습니다. 동료를 살핀 뒤 다음 이야기를 선택하세요.':esc(intel.plan)}</p>`,frontierButton('advisor-menu','작전 대화로 돌아가기'));}
 if(action==='advisor-menu'){closeModal();offerAdvisor();}
 if(action==='enter-building'){closeModal();if(enterInterior(state,id)){hubCamera.reset();commit();}}
 if(action==='walk'){const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[id];if(d)walkAren(...d);}
 if(action==='interact'){const n=interactions(state)[0];if(n)await dispatch(n.npc?'npc':'place',n.id);else toast('대화할 사람이나 입구 가까이 이동하세요.');}
 if(action==='npc'){const n=interactions(state).find(n=>n.id===id&&n.npc);if(n?.service){openShopkeeper(n.service);return true;}if(interactNPC(state,id)){commit();}else if(id==='advisor')offerCouncilRecovery();}
 if(action==='affiliate'){if(affiliate(state,id)){closeModal();commit();toast(`${SPEAKERS[id].name} · 소속 기록을 남겼습니다.`);}}
 if(action==='place'){const n=interactions(state).find(p=>!p.npc&&p.id===id);if(n?.action==='council')await prepareCouncil();else if(n?.action==='exit'){if(exitInterior(state)){hubCamera.reset();commit();}}else if(['weapon','item','enter'].includes(n?.action))confirmEntrance(n);else if(n?.action==='chest'){const full=itemCount(state.economy)>=6,r=openChest(state,n.chestId,transact);if(r.ok){const w=r.reward;modal('보물상자',`<div class="chest-find">${itemIcon(w.kind==='gold'?'gold':w.kind==='item'?w.type:'potion',48)}<p>${w.kind==='gold'?`<b>${w.amount} Gold</b>를 찾았다!`:w.kind==='item'?`<b>${esc(TOOLS[w.type].name)}</b>을(를) 찾았다!${full?' 가방이 가득 차서 대신 20 Gold를 챙겼다.':''}`:'먼지와 거미줄뿐이다…'}</p></div>`,frontierButton('close-modal','확인','',false,'primary'));audio.select('shop');commit();}else toast(r.error);}}
 if(action==='fast-map'){modal('Town Map · 방문한 장소',`<p>직접 찾아간 주요 장소에 빠르게 이동합니다.</p><div class="travel-list">${HUBS[f.hub].places.map(p=>frontierButton('fast-travel',`${p.name} ${f.visited[f.hub].includes(p.id)?'✓':'· 미방문'}`,p.id,!f.visited[f.hub].includes(p.id))).join('')}</div>`,'');}
 if(action==='fast-travel'){if(fastTravel(state,id)){closeModal();commit();}}
 if(action==='inventory')showInventory(id);
 if(action==='items')showItems();
 if(action==='hub-return'&&['warroom','deployment','exploration'].includes(state.screen)){closeModal();enterHub(state,{aftermath:f.phase==='aftermath',story:false});ui.menu=null;commit();}
 if(action==='aftermath'&&state.screen==='result'){closeModal();if(state.outcome==='defeat'){state=replay(state);enterHub(state,{story:false});}else{if(state.practice)state.economy=structuredClone(state.campaign.economy);enterHub(state,{aftermath:true});}ui.menu=null;ui.preview=null;renderer.clearPresentation();commit();}
 if(action==='buy-preview'){const type=id.split('|')[0];showPurchase(type,null);}
 if(action==='purchase-hero'){const [type,hero]=id.split('|');showPurchase(type,hero);}

 if(action==='hub-zoom')hubCamera.zoomBy(id==='in'?1.15:1/1.15);
 if(action==='hub-focus')hubCamera.focus(f.x,f.y);
 if(action==='shop-exit'){const exit=currentHub(state).places.find(p=>p.action==='exit');if(exit){await walkToFrontier(exit.x,exit.y);if(exitInterior(state)){hubCamera.reset();commit();}}}
 if(action==='gear-info'){const [type,hero]=id.split('|');modal('Equipment Comparison',compareGear(type,hero),'');}
 if(action==='gear-compare'){const [instance,hero]=id.split('|'),g=state.economy.gear.find(a=>a.id===instance);if(g)modal('Equipment Comparison',compareGear(g.type,hero,instance),'');}
 if(action==='transaction')transactionPreview(id);
 if(action==='confirm-transaction'&&pendingTransaction){const req=pendingTransaction;pendingTransaction=null;const before=structuredClone(state),result=transact(state,req);if(result.ok){const saved=save();if(!saved.ok){state=before;closeModal();render();toast('거래를 적용하지 않았습니다. 저장이 실패하여 이전 자산을 유지합니다.');}else{closeModal();commit();if(state.frontier.interior)openShop(state.frontier.interior);toast('거래 완료 · 자산과 장비를 저장했습니다.');}}else toast(result.error);}
 if(action==='tool'){const t=TOOLS[id],u=findUnit(state,ui.selected);if(t&&canAct(state,u))modal('도구 사용',`<p>${u.name} · ${t.name}<br>${t.description}<br>보유 ${state.economy.items[id]} · 이동 후 사용 가능, 행동을 마칩니다.</p>`,frontierButton('tool-confirm','사용 확정',id,false,'primary'));}
 if(action==='tool-confirm'){closeModal();await execute(`tool:${id}`);}
 return true;
}

function frontierFrame(time){heldMovement.tick(time,state.screen==='exploration'&&!state.narrative.active&&!$('#modal-root').children.length&&!frontierWalking);const canvas=$('#frontier-map');if(canvas&&state.screen==='exploration')drawHub(canvas,{...state,doorStep:doorStep&&!state.frontier.interior,walking:!ui.reduced&&(frontierWalking||time<walkUntil)},{time:ui.reduced?0:time});const stage=$('#scene-stage');if(stage)drawHub(stage,state,{line:storyLine(state),time:ui.reduced?0:time});requestAnimationFrame(frontierFrame);}requestAnimationFrame(frontierFrame);
let hubDrag=null,hubPanUsed=false;

document.addEventListener('pointermove',e=>{if(hubDrag){hubPanUsed=true;hubCamera.panBy(e.clientX-hubDrag.x,e.clientY-hubDrag.y);hubDrag={x:e.clientX,y:e.clientY};}});

document.addEventListener('contextmenu',e=>{if(e.target.id==='frontier-map')e.preventDefault();});
document.addEventListener('wheel',e=>{if(e.target.id==='frontier-map'){e.preventDefault();hubCamera.zoomBy(e.deltaY<0?1.08:1/1.08);}},{passive:false});

document.addEventListener('keyup',e=>heldMovement.release('key:'+e.code,performance.now()));
window.addEventListener('blur',()=>heldMovement.clear());
document.addEventListener('visibilitychange',()=>{if(document.hidden)heldMovement.clear();});
let walkPointer=null;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-do="walk"]');if(!b||walkPointer!==null)return;e.preventDefault();walkPointer=e.pointerId;try{document.body.setPointerCapture(e.pointerId);}catch{}const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.id];if(d)heldMovement.press('pointer',d,performance.now());},{passive:false});
for(const event of ['pointerup','pointercancel','lostpointercapture'])window.addEventListener(event,e=>{if(e.pointerId===walkPointer&&(event!=='lostpointercapture'||e.target===document.body)){walkPointer=null;heldMovement.release('pointer',performance.now());}});

})();</script></body></html>
