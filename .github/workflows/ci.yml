name: Game validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: game-validation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  source-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # v2.2.1 (D-125): build first; the HTML is committed only when a release candidate is packaged.
      - run: npm run build
      - run: npm test
      - run: npm run test:balance
      - run: npm run test:campaign-balance
      - run: npm run test:m05-balance
      - run: npm run test:m06-balance
      - run: npm run test:act1-balance
      - run: npm run test:class-balance
      - run: npm run test:act2-balance
      # Skips until the version is packaged; then the committed HTML must equal a clean rebuild.
      - run: python scripts/verify-release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-core
          path: test-output/
  browser:
    needs: source-package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite_group: exploration
            suites: journey quality migration-v031 migration-v032 frontier renaissance performance
          - suite_group: tactical
            suites: e2e mobile tactical http post-move restart audio-mute
          - suite_group: campaign
            suites: campaign economy-balance migration-v02
          - suite_group: act1
            suites: act1 migration-v033 migration-v040 mobile-command class legion world
          - suite_group: act2
            suites: act2 act2-hubs act2-campaign act2b-campaign hub-doors migration-v050 migration-v060
          - suite_group: act2b
            suites: act2c-campaign act2d-campaign migration-v061 migration-v070 tactics migration-v071 arms migration-v080
          - suite_group: act3
            suites: act3 migration-v081 item-art act3b migration-v090 feedback-v091 act3c migration-v091 act3d migration-v092
          - suite_group: act4
            suites: act4a act4b act4c act4d migration-v093 migration-v0100 migration-v0101 migration-v0102 v200 v230
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # D-125: earlier builds the migration suites play, from their GitHub Releases when they are no longer in the tree.
      - run: node scripts/fetch-releases.mjs ${{ matrix.suites }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        if: matrix.suite_group == 'tactical'
        with:
          name: validation-core
          path: test-output/
      - name: Run ${{ matrix.suite_group }} regression
        env:
          BROWSER_SUITES: ${{ matrix.suites }}
        run: |
          for suite in $BROWSER_SUITES; do
            npm run "test:$suite"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.suite_group }}
          path: test-output/
