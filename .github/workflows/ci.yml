name: Game validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: game-validation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  source-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:balance
      - run: npm run test:campaign-balance
      - run: npm run test:m05-balance
      - run: npm run test:m06-balance
      - run: npm run test:act1-balance
      - run: npm run test:class-balance
      - run: npm run build
      - run: git diff --exit-code -- index.html releases/Ashen_Crown_v0.5.0.html
      - run: python scripts/verify-release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-core
          path: test-output/
  browser:
    needs: source-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite_group: exploration
            suites: journey quality migration-v031 migration-v032 frontier renaissance performance
          - suite_group: tactical
            suites: e2e mobile tactical http post-move restart
          - suite_group: campaign
            suites: campaign economy-balance migration-v02
          - suite_group: act1
            suites: act1 migration-v033 migration-v040 mobile-command class legion world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        if: matrix.suite_group == 'tactical'
        with:
          name: validation-core
          path: test-output/
      - name: Run ${{ matrix.suite_group }} regression
        env:
          BROWSER_SUITES: ${{ matrix.suites }}
        run: |
          for suite in $BROWSER_SUITES; do
            npm run "test:$suite"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.suite_group }}
          path: test-output/
