name: Game validation
on:
  pull_request:
  push:
    branches: [main, feature/v0.1-first-battle]
permissions:
  contents: read
jobs:
  first-battle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:balance
      - run: npm run build
      - run: git diff --exit-code -- index.html releases/Ashen_Crown_v0.1.0.html
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-battle-evidence
          path: test-output/
