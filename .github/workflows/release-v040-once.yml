name: Publish v0.4.0 (one-time)
# One-shot publisher requested by the user on 2026-10-19: tags the approved v0.4.0 merge (f922a18) and creates
# the GitHub Release with the four packaged assets after re-checking their SHA256. Runs only when this file
# changes on the v0.5 branch; it is removed again after the release exists. Idempotent: skips if v0.4.0 exists.
on:
  push:
    branches: [feature/v0.5-advanced-class]
    paths: [.github/workflows/release-v040-once.yml]
permissions:
  contents: write
concurrency:
  group: publish-v040
  cancel-in-progress: false
env:
  RELEASE_SHA: f922a180f49821c72247b9d105d79b36ea7e2809
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f922a180f49821c72247b9d105d79b36ea7e2809
          path: release
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: notes
          persist-credentials: false
      - name: Verify assets against the committed SHA256 manifest
        working-directory: release/releases
        run: |
          set -euo pipefail
          sha256sum -c Ashen_Crown_v0.4.0_SHA256SUMS
          test "$(grep -c '' Ashen_Crown_v0.4.0_SHA256SUMS)" = 3
      - name: Create tag v0.4.0 and the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v0.4.0 already exists; nothing to do.'; exit 0
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/10" --jq .merge_commit_sha)" = "$RELEASE_SHA"
          cd release/releases
          gh release create v0.4.0 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
            --title 'v0.4.0 — The Broken Allegiance' --notes-file "$GITHUB_WORKSPACE/notes/docs/v0.4.0/RELEASE_NOTES.md" --latest \
            Ashen_Crown_v0.4.0.html Ashen_Crown_v0.4.0_Source.zip Ashen_Crown_v0.4.0_Test_Report.md Ashen_Crown_v0.4.0_SHA256SUMS
          gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" --json tagName,assets --jq '.tagName, (.assets[] | .name + " " + .digest)'
